# Deploy pipeline: Manual deployment trigger
# Azure Pipelines counterpart to .github/workflows/deploy.yaml
# Set each environment's service connection and variable group in the
# Environment settings block under variables.

name: $(Date:yyyyMMdd)$(Rev:.r) · ${{ parameters.environment }} · ${{ parameters.manifest }}${{ iif(parameters.dryRun, ' (dry-run)', '') }}

trigger: none
pr: none

parameters:
  - name: workspace
    displayName: Workspace
    type: string
    default: iot-operations
    values: [iot-operations]

  - name: manifest
    displayName: Manifest (path relative to the workspace root)
    type: string
    default: manifests/aio-install/manifest.yaml
    values:
      # Core entry points follow the common operator lifecycle.
      - manifests/aio-install/manifest.yaml
      - manifests/aio-upgrade/manifest.yaml
      - manifests/secretsync/manifest.yaml
      - manifests/aksee-bootstrap/manifest.yaml
      - manifests/aksee-upgrade/manifest.yaml
      - manifests/aio-resources/manifest.yaml
      # Samples are alphabetical for predictable scanning.
      - samples/aio-with-aksee-bootstrap/manifest.yaml
      - samples/aio-with-opc-ua/manifest.yaml
      - samples/asset-sample/manifest.yaml
      - samples/dataflow-sample/manifest.yaml
      - samples/opc-ua-solution/manifest.yaml
      - samples/resource-set-basic/manifest.yaml
      - samples/resource-set-composition/manifest.yaml
      - samples/secretsync-sample/manifest.yaml

  - name: environment
    displayName: Target environment
    type: string
    default: dev
    values: [dev, staging, prod]

  - name: selector
    displayName: Additional site selector (e.g., country=US,name=seattle-dev)
    type: string
    default: ' '

  - name: dryRun
    displayName: Prepare executable plan only
    type: boolean
    default: false

  - name: keepAzSessionActive
    displayName: Refresh Azure WIF session (experimental AzureCLI task option)
    type: boolean
    default: false

  # Operators select the engine only as a verified release. A custom
  # engine source belongs in reviewed YAML, as the siteopsSource
  # parameter of templates/siteops-deploy.yaml.
  - name: release
    displayName: Engine or content release (empty uses this checkout's tag)
    type: string
    default: ' '
  - name: sourceCommit
    displayName: Full source commit for an explicit release
    type: string
    default: ' '
  - name: siteFile
    displayName: Complete Site file in this checkout, labeled for the target environment
    type: string
    default: ' '

variables:
  - name: SITE_OVERRIDES
    value: ''

  # Environment settings: one service connection and variable group per
  # environment. Edit the names here. A queued run chooses only the
  # environment, so it cannot pair one environment's approvals with another
  # environment's identity or secrets. Add a block for each value you add to
  # the environment parameter.
  - ${{ if eq(parameters.environment, 'dev') }}:
    - group: siteops-secrets
    - name: siteopsServiceConnection
      value: azure-siteops
  - ${{ if eq(parameters.environment, 'staging') }}:
    - group: siteops-secrets
    - name: siteopsServiceConnection
      value: azure-siteops
  - ${{ if eq(parameters.environment, 'prod') }}:
    - group: siteops-secrets
    - name: siteopsServiceConnection
      value: azure-siteops

  - name: PYTHONUNBUFFERED
    value: '1'
  # Engine output reaches this pipeline's logs and artifacts, which are public.
  - name: SITEOPS_REDACT_OUTPUT
    value: '1'

pool:
  vmImage: ubuntu-24.04

stages:
  - stage: prepare
    displayName: Validate and Resolve
    jobs:
      - job: resolve
        displayName: Prepare Deployment
        steps:
          - checkout: self
            fetchDepth: 1
            persistCredentials: false

          - script: |
              set -euo pipefail
              MANIFEST_PATH="workspaces/${{ parameters.workspace }}/${{ parameters.manifest }}"
              if [[ ! -f "$MANIFEST_PATH" ]]; then
                echo "##vso[task.logissue type=error]Manifest not found: $MANIFEST_PATH"
                echo ""
                echo "Available manifests:"
                { find "workspaces/${{ parameters.workspace }}/manifests" -mindepth 2 -maxdepth 2 \
                    \( -name "manifest.yaml" -o -name "manifest.yml" \) 2>/dev/null
                  find "workspaces/${{ parameters.workspace }}/samples" -mindepth 2 -maxdepth 2 \
                    \( -name "manifest.yaml" -o -name "manifest.yml" \) 2>/dev/null
                } || echo "  (none found)"
                exit 1
              fi
              echo "✓ Manifest found: $MANIFEST_PATH"
            displayName: Validate manifest exists

          - script: |
              set -euo pipefail
              case "$MANIFEST_REL" in
                samples/resource-set-basic/manifest.yaml|samples/resource-set-composition/manifest.yaml)
                  if [[ "$ENV" != "dev" ]]; then
                    echo "##vso[task.logissue type=error]Resource-set samples use the dev deployment environment"
                    exit 1
                  fi
                  ;;
              esac

              SUMMARY_FILE="$(Build.ArtifactStagingDirectory)/deploy-config.md"
              echo "### Deployment Configuration" > "$SUMMARY_FILE"
              echo "| Setting | Value |" >> "$SUMMARY_FILE"
              echo "|---------|-------|" >> "$SUMMARY_FILE"
              echo "| Workspace | \`$WORKSPACE_DIR\` |" >> "$SUMMARY_FILE"
              echo "| Manifest | \`$MANIFEST_REL\` |" >> "$SUMMARY_FILE"
              echo "| Environment | \`$ENV\` |" >> "$SUMMARY_FILE"
              echo "| Selector | \`<redacted>\` |" >> "$SUMMARY_FILE"
              echo "| Dry Run | \`$DRY_RUN\` |" >> "$SUMMARY_FILE"
              echo "##vso[task.uploadsummary]$SUMMARY_FILE"
            displayName: Write deployment summary
            # Parameters are routed through env vars rather than interpolated
            # into the script body so a value containing shell metachars
            # cannot break out of the command.
            env:
              ENV: ${{ parameters.environment }}
              WORKSPACE_DIR: workspaces/${{ parameters.workspace }}
              MANIFEST_REL: ${{ parameters.manifest }}
              DRY_RUN: ${{ parameters.dryRun }}

  - template: templates/siteops-deploy.yaml
    parameters:
      serviceConnection: ${{ variables.siteopsServiceConnection }}
      keepAzSessionActive: ${{ parameters.keepAzSessionActive }}
      workspace: workspaces/${{ parameters.workspace }}
      manifest: ${{ parameters.manifest }}
      environment: ${{ parameters.environment }}
      # A Site file replaces the configured Sites. The selector below still
      # applies as a label requirement, so a Site file for another
      # environment fails before Site Ops uses this environment's identity.
      ${{ if not(in(parameters.siteFile, '', ' ')) }}:
        siteFile: ${{ parameters.siteFile }}
      ${{ if eq(parameters.manifest, 'samples/resource-set-basic/manifest.yaml') }}:
        ${{ if not(in(parameters.selector, '', ' ')) }}:
          selector: environment=sample,sample=resource-set-basic,${{ parameters.selector }}
        ${{ else }}:
          selector: environment=sample,sample=resource-set-basic
      ${{ elseif eq(parameters.manifest, 'samples/resource-set-composition/manifest.yaml') }}:
        ${{ if not(in(parameters.selector, '', ' ')) }}:
          selector: environment=sample,sample=resource-set-composition,${{ parameters.selector }}
        ${{ else }}:
          selector: environment=sample,sample=resource-set-composition
      ${{ elseif not(in(parameters.selector, '', ' ')) }}:
        selector: environment=${{ parameters.environment }},${{ parameters.selector }}
      ${{ else }}:
        selector: environment=${{ parameters.environment }}
      dryRun: ${{ parameters.dryRun }}
      release: ${{ parameters.release }}
      sourceCommit: ${{ parameters.sourceCommit }}
