# Stage template: structural consumer validation without Azure authority.
parameters:
  - name: templateRepository
    type: string
    default: self
  - name: workspace
    type: string
    default: workspaces/iot-operations
  - name: manifest
    type: string
  - name: selector
    type: string
    default: ''
  - name: siteFile
    type: string
    default: ''
  - name: siteopsSource
    type: string
    default: ''
  - name: release
    type: string
    default: ''
  - name: sourceCommit
    type: string
    default: ''
  - name: repository
    type: string
    default: ''
  - name: stageName
    type: string
    default: validate

stages:
  - stage: ${{ parameters.stageName }}
    variables:
      - template: siteops-context.yaml
        parameters:
          templateRepository: ${{ parameters.templateRepository }}
    jobs:
      - job: siteops_validate
        displayName: Validate Site Ops content
        steps:
          - template: siteops-checkout.yaml
            parameters:
              templateRepository: ${{ parameters.templateRepository }}
          - template: setup-siteops.yaml
            parameters:
              templateRepository: ${{ parameters.templateRepository }}
              sourceDirectory: $(SITEOPS_TEMPLATE_ROOT)
              siteopsSource: ${{ parameters.siteopsSource }}
              release: ${{ parameters.release }}
              sourceCommit: ${{ parameters.sourceCommit }}
              repository: ${{ parameters.repository }}
          - template: siteops-inputs.yaml
            parameters:
              workspace: ${{ parameters.workspace }}
              manifest: ${{ parameters.manifest }}
              selector: ${{ parameters.selector }}
              siteFile: ${{ parameters.siteFile }}
          - script: |
              set -euo pipefail
              umask 077
              private="$(mktemp -d "$STATE_PARENT/siteops-validate.XXXXXX")"
              cleanup() {
                local status=$?
                if [[ ${VALIDATE_EXIT_CODE:-0} -ne 0 ]]; then status=$VALIDATE_EXIT_CODE; fi
                if rm -f "$private/stdout" "$private/stderr" 2>/dev/null && rmdir "$private" 2>/dev/null; then
                  :
                else
                  echo "##vso[task.logissue type=error]Private validation files could not be removed."
                  if [[ $status -eq 0 ]]; then status=1; fi
                fi
                exit "$status"
              }
              trap cleanup EXIT
              args=(-w "$WORKSPACE" validate "$MANIFEST" --output json --projection publishable)
              [[ -n "$SELECTOR" ]] && args+=(-l "$SELECTOR")
              [[ -n "$SITE_FILE" ]] && args+=(--site-file "$SITE_FILE")
              if siteops "${args[@]}" > "$private/stdout" 2> "$private/stderr"; then
                VALIDATE_EXIT_CODE=0
              else
                VALIDATE_EXIT_CODE=$?
              fi
              if [[ -f "$TOOL_ROOT/scripts/render-siteops-output.py" ]]; then
                if python3 -I -S -B "$TOOL_ROOT/scripts/render-siteops-output.py" "$private/stdout" \
                    --kind ValidationResult --exit-code "$VALIDATE_EXIT_CODE" --platform ado; then
                  REPORT_EXIT_CODE=0
                else
                  REPORT_EXIT_CODE=$?
                fi
              else
                if [[ $VALIDATE_EXIT_CODE -eq 2 ]]; then
                  echo "##vso[task.logissue type=error]Site Ops engine and template releases do not match. Use matching engine, setup, templates and helpers."
                else
                  echo "##vso[task.logissue type=error]Diagnostic details are unavailable."
                fi
                REPORT_EXIT_CODE=1
              fi
              if [[ $VALIDATE_EXIT_CODE -ne 0 ]]; then exit "$VALIDATE_EXIT_CODE"; fi
              exit "$REPORT_EXIT_CODE"
            displayName: Validate caller content
            workingDirectory: $(SITEOPS_WORKSPACE_ROOT)
            env:
              WORKSPACE: ${{ parameters.workspace }}
              MANIFEST: ${{ parameters.manifest }}
              SELECTOR: ${{ parameters.selector }}
              SITE_FILE: ${{ parameters.siteFile }}
              STATE_PARENT: $(Agent.TempDirectory)
              TOOL_ROOT: $(SITEOPS_TEMPLATE_ROOT)
              PYTHONSAFEPATH: '1'
