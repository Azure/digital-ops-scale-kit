# Stage template: Site Ops deployment
# Azure Pipelines counterpart to .github/workflows/_siteops-deploy.yaml

parameters:
  - name: serviceConnection
    displayName: Azure service connection name
    type: string
  - name: keepAzSessionActive
    displayName: Refresh Azure WIF session (experimental AzureCLI task option)
    type: boolean
    default: false
  - name: workspace
    displayName: Workspace directory
    type: string
    default: workspaces/iot-operations
  - name: manifest
    displayName: Manifest path (relative to workspace)
    type: string
  - name: environment
    displayName: ADO environment name (approval gates)
    type: string
    default: ''
  - name: selector
    displayName: Site selector, or the labels a Site file must carry
    type: string
    default: ''
  - name: siteFile
    displayName: Complete Site file relative to the caller checkout, used instead of configured Sites
    type: string
    default: ''
  - name: dryRun
    displayName: Prepare executable plan only
    type: boolean
    default: false
  - name: siteopsSource
    displayName: Explicit pip source, set only in reviewed YAML (empty selects the released engine)
    type: string
    default: ''
  - name: release
    type: string
    default: ''
  - name: sourceCommit
    type: string
    default: ''
  - name: repository
    type: string
    default: ''
  - name: stageName
    displayName: Stage id (override when including this template more than once)
    type: string
    default: deploy
  - name: templateRepository
    displayName: Repository resource alias containing these templates
    type: string
    default: self

stages:
  - stage: ${{ parameters.stageName }}
    variables:
      - template: siteops-context.yaml
        parameters:
          templateRepository: ${{ parameters.templateRepository }}
    jobs:
      - deployment: siteops_deploy
        displayName: Deploy
        environment: ${{ parameters.environment }}
        strategy:
          runOnce:
            deploy:
              steps:
                - template: siteops-checkout.yaml
                  parameters:
                    templateRepository: ${{ parameters.templateRepository }}

                - template: setup-siteops.yaml
                  parameters:
                    siteopsSource: ${{ parameters.siteopsSource }}
                    enableCache: false
                    sourceDirectory: $(SITEOPS_TEMPLATE_ROOT)
                    templateRepository: ${{ parameters.templateRepository }}
                    release: ${{ parameters.release }}
                    sourceCommit: ${{ parameters.sourceCommit }}
                    repository: ${{ parameters.repository }}

                - template: siteops-inputs.yaml
                  parameters:
                    workspace: ${{ parameters.workspace }}
                    manifest: ${{ parameters.manifest }}
                    selector: ${{ parameters.selector }}
                    siteFile: ${{ parameters.siteFile }}

                - task: AzureCLI@2
                  displayName: Prepare executable plan and deploy
                  inputs:
                    azureSubscription: ${{ parameters.serviceConnection }}
                    keepAzSessionActive: ${{ parameters.keepAzSessionActive }}
                    scriptType: bash
                    scriptLocation: inlineScript
                    workingDirectory: $(SITEOPS_WORKSPACE_ROOT)
                    inlineScript: |
                      set -euo pipefail
                      # Bicep compiler acquisition and module restore run inside
                      # this authenticated AzureCLI task. Only publishable JSON
                      # reaches the uploaded plan summary.
                      umask 077
                      PLAN_ARGS=(
                        -w "$WORKSPACE"
                        plan "$MANIFEST"
                        --output json
                        --projection publishable
                      )
                      [[ -n "$SELECTOR" ]] && PLAN_ARGS+=(-l "$SELECTOR")
                      [[ -n "$SITE_FILE" ]] && PLAN_ARGS+=(--site-file "$SITE_FILE")

                      PLAN_STDOUT="$PLAN_TEMP_DIRECTORY/siteops-plan.json"
                      PLAN_STDERR="$PLAN_TEMP_DIRECTORY/siteops-plan.stderr"
                      PRIVATE_FILES=("$PLAN_STDOUT" "$PLAN_STDERR")
                      cleanup_plan_files() {
                        local status=$?
                        local operation_status=${DEPLOY_EXIT_CODE:-${PLAN_EXIT_CODE:-0}}
                        if [[ $operation_status -ne 0 ]]; then
                          status=$operation_status
                        fi
                        if rm -f "${PRIVATE_FILES[@]}" 2>/dev/null; then
                          :
                        else
                          local cleanup_status=$?
                          echo "##vso[task.logissue type=error]Private deployment files could not be removed."
                          if [[ $status -eq 0 ]]; then status=$cleanup_status; fi
                        fi
                        exit "$status"
                      }
                      trap cleanup_plan_files EXIT

                      if siteops "${PLAN_ARGS[@]}" >"$PLAN_STDOUT" 2>"$PLAN_STDERR"; then
                        PLAN_EXIT_CODE=0
                      else
                        PLAN_EXIT_CODE=$?
                      fi

                      PLAN_SUMMARY="$PLAN_SUMMARY_DIRECTORY/deployment-plan.md"
                      echo "### Deployment Plan" > "$PLAN_SUMMARY"
                      PLAN_DOCUMENT_VALID=0
                      PLAN_REPORT_EXIT_CODE=1
                      if [[ -f "$TOOL_ROOT/scripts/render-siteops-output.py" ]]; then
                        if python3 -I -S -B "$TOOL_ROOT/scripts/render-siteops-output.py" "$PLAN_STDOUT" \
                            --kind DeploymentPlan --exit-code "$PLAN_EXIT_CODE" --platform ado \
                            --summary "$PLAN_SUMMARY" --require-executable; then
                          PLAN_DOCUMENT_VALID=1
                        else
                          PLAN_REPORT_EXIT_CODE=$?
                        fi
                      else
                        message="Diagnostic details are unavailable."
                        if [[ $PLAN_EXIT_CODE -eq 2 ]]; then message="Site Ops engine and template releases do not match. Use matching engine, setup, templates and helpers."; fi
                        echo "##vso[task.logissue type=error]$message"
                        echo "$message" >> "$PLAN_SUMMARY"
                      fi
                      echo "##vso[task.uploadsummary]$PLAN_SUMMARY"

                      if [[ $PLAN_EXIT_CODE -ne 0 ]]; then
                        if [[ $PLAN_EXIT_CODE -ne 2 ]]; then
                          echo "##vso[task.logissue type=error]Executable plan preparation failed. Run the plan locally for private diagnostics."
                        fi
                        exit "$PLAN_EXIT_CODE"
                      fi
                      if [[ $PLAN_DOCUMENT_VALID -ne 1 ]]; then
                        echo "##vso[task.logissue type=error]Site Ops returned an unsupported plan document."
                        exit "$PLAN_REPORT_EXIT_CODE"
                      fi
                      if [[ "$DRY_RUN" == "True" ]]; then
                        echo "##vso[task.logissue type=warning]Executable plan prepared. No deployment was executed."
                        exit 0
                      fi

                      CMD_ARGS=(
                        -w "$WORKSPACE"
                        deploy "$MANIFEST"
                        --yes
                        --output json
                        --projection publishable
                      )
                      [[ -n "$SELECTOR" ]] && CMD_ARGS+=(-l "$SELECTOR")
                      [[ -n "$SITE_FILE" ]] && CMD_ARGS+=(--site-file "$SITE_FILE")

                      RUN_STDOUT="$PLAN_TEMP_DIRECTORY/siteops-run.json"
                      RUN_STDERR="$PLAN_TEMP_DIRECTORY/siteops-run.stderr"
                      PRIVATE_FILES+=("$RUN_STDOUT" "$RUN_STDERR")

                      echo "Executing Site Ops deployment"
                      if siteops "${CMD_ARGS[@]}" >"$RUN_STDOUT" 2>"$RUN_STDERR"; then
                        DEPLOY_EXIT_CODE=0
                      else
                        DEPLOY_EXIT_CODE=$?
                      fi

                      RESULT_FILE="$PLAN_SUMMARY_DIRECTORY/deployment-result.md"
                      echo "### Deployment Result" > "$RESULT_FILE"
                      RUN_DOCUMENT_VALID=0
                      RUN_REPORT_EXIT_CODE=1
                      if [[ -f "$TOOL_ROOT/scripts/render-siteops-output.py" ]]; then
                        if python3 -I -S -B "$TOOL_ROOT/scripts/render-siteops-output.py" "$RUN_STDOUT" \
                            --kind DeploymentRun --exit-code "$DEPLOY_EXIT_CODE" --platform ado \
                            --summary "$RESULT_FILE"; then
                          RUN_DOCUMENT_VALID=1
                        else
                          RUN_REPORT_EXIT_CODE=$?
                        fi
                      else
                        message="Diagnostic details are unavailable."
                        if [[ $DEPLOY_EXIT_CODE -eq 2 ]]; then message="Site Ops engine and template releases do not match. Use matching engine, setup, templates and helpers."; fi
                        echo "##vso[task.logissue type=error]$message"
                        echo "$message" >> "$RESULT_FILE"
                      fi
                      echo "##vso[task.uploadsummary]$RESULT_FILE"

                      if [[ $DEPLOY_EXIT_CODE -eq 130 ]]; then
                        echo "##vso[task.logissue type=error]Deployment stopped before every operation finished. Work already accepted by Azure was not cancelled."
                        exit "$DEPLOY_EXIT_CODE"
                      fi
                      if [[ $DEPLOY_EXIT_CODE -ne 0 ]]; then
                        if [[ $DEPLOY_EXIT_CODE -ne 2 ]]; then
                          echo "##vso[task.logissue type=error]Deployment did not complete successfully. Review the result summary."
                        fi
                        exit "$DEPLOY_EXIT_CODE"
                      fi
                      if [[ $RUN_DOCUMENT_VALID -ne 1 ]]; then
                        echo "##vso[task.logissue type=error]Site Ops returned an unsupported deployment result."
                        exit "$RUN_REPORT_EXIT_CODE"
                      fi
                  env:
                    WORKSPACE: ${{ parameters.workspace }}
                    MANIFEST: ${{ parameters.manifest }}
                    SELECTOR: ${{ parameters.selector }}
                    SITE_FILE: ${{ parameters.siteFile }}
                    DRY_RUN: ${{ parameters.dryRun }}
                    PLAN_TEMP_DIRECTORY: $(Agent.TempDirectory)
                    PLAN_SUMMARY_DIRECTORY: $(Build.ArtifactStagingDirectory)
                    TOOL_ROOT: $(SITEOPS_TEMPLATE_ROOT)
