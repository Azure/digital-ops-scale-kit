# Stage template: Site Ops deployment
# Azure Pipelines counterpart to .github/workflows/_siteops-deploy.yaml

parameters:
  - name: serviceConnection
    displayName: Azure service connection name (WIF)
    type: string
  - name: workspace
    displayName: Workspace directory
    type: string
    default: workspaces/iot-operations
  - name: manifest
    displayName: Manifest path (relative to workspace)
    type: string
  - name: environment
    displayName: ADO environment name (approval gates)
    type: string
    default: ''
  - name: selector
    displayName: Site selector
    type: string
    default: ''
  - name: dryRun
    displayName: Prepare executable plan only
    type: boolean
    default: false
  - name: siteopsSource
    displayName: siteops install source (empty = local editable install)
    type: string
    default: ''
  - name: stageName
    displayName: Stage id (override when including this template more than once)
    type: string
    default: deploy

stages:
  - stage: ${{ parameters.stageName }}
    variables:
      PYTHONUNBUFFERED: '1'
      SITEOPS_REDACT_OUTPUT: '1'
      AZURE_CORE_OUTPUT: none
    jobs:
      - deployment: siteops_deploy
        displayName: Deploy
        environment: ${{ parameters.environment }}
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                  fetchDepth: 1
                  persistCredentials: false

                - template: setup-siteops.yaml
                  parameters:
                    siteopsSource: ${{ parameters.siteopsSource }}
                    enableCache: false

                - script: |
                    # Prevent path traversal attacks
                    if [[ "$WORKSPACE" == *".."* ]] || [[ "$MANIFEST" == *".."* ]]; then
                      echo "##vso[task.logissue type=error]Path traversal not allowed"
                      exit 1
                    fi

                    if [[ -n "$SELECTOR" && ! "$SELECTOR" =~ ^[a-zA-Z0-9_=,./:-]+$ ]]; then
                      echo "##vso[task.logissue type=error]Invalid selector format"
                      exit 1
                    fi

                    if [[ ! -d "$WORKSPACE" ]]; then
                      echo "##vso[task.logissue type=error]Workspace directory not found: $WORKSPACE"
                      exit 1
                    fi

                    echo "✓ Inputs validated"
                  displayName: Validate inputs
                  env:
                    WORKSPACE: ${{ parameters.workspace }}
                    MANIFEST: ${{ parameters.manifest }}
                    SELECTOR: ${{ parameters.selector }}

                - script: |
                    # ADO `script:` does not set pipefail by default. Without it
                    # a python or jq failure could continue with overrides not
                    # written or values not masked.
                    set -o pipefail
                    if [[ -z "$SITE_OVERRIDES" ]]; then
                      echo "No site overrides configured, using committed sites"
                      exit 0
                    fi

                    echo "$SITE_OVERRIDES" | python3 scripts/generate-site-overrides.py "$WORKSPACE"

                    # Mask override values in ADO logs
                    echo "$SITE_OVERRIDES" | jq -r '.. | strings' | while IFS= read -r val; do
                      [[ -n "$val" ]] && echo "##vso[task.setvariable variable=masked;issecret=true]${val}"
                    done
                  displayName: Setup site overrides
                  env:
                    WORKSPACE: ${{ parameters.workspace }}
                    SITE_OVERRIDES: $(SITE_OVERRIDES)

                - task: AzureCLI@2
                  displayName: Prepare executable plan and deploy
                  inputs:
                    azureSubscription: ${{ parameters.serviceConnection }}
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      # Bicep compiler acquisition and module restore run inside
                      # this authenticated AzureCLI task. Only publishable JSON
                      # reaches the uploaded plan summary.
                      umask 077
                      PLAN_ARGS=(
                        -w "$WORKSPACE"
                        plan "$MANIFEST"
                        --output json
                        --projection publishable
                      )
                      [[ -n "$SELECTOR" ]] && PLAN_ARGS+=(-l "$SELECTOR")

                      PLAN_STDOUT="$PLAN_TEMP_DIRECTORY/siteops-plan.json"
                      PLAN_STDERR="$PLAN_TEMP_DIRECTORY/siteops-plan.stderr"
                      cleanup_plan_files() {
                        rm -f "$PLAN_STDOUT" "$PLAN_STDERR"
                      }
                      trap cleanup_plan_files EXIT

                      if siteops "${PLAN_ARGS[@]}" >"$PLAN_STDOUT" 2>"$PLAN_STDERR"; then
                        PLAN_EXIT_CODE=0
                      else
                        PLAN_EXIT_CODE=$?
                      fi

                      PLAN_STATUS=""
                      if PLAN_STATUS=$(python3 -c '
                      import json
                      import sys

                      with open(sys.argv[1], encoding="utf-8") as stream:
                          document = json.load(stream)
                      if (
                          document.get("apiVersion") != "siteops/v1alpha1"
                          or document.get("kind") != "DeploymentPlan"
                          or document.get("projection") != "publishable"
                          or document.get("status") not in {"planned", "invalid"}
                          or document.get("intent") != "executable"
                          or document.get("executable") is not (document.get("status") == "planned")
                      ):
                          raise SystemExit(1)
                      print(document["status"])
                      ' "$PLAN_STDOUT" 2>/dev/null); then
                        PLAN_DOCUMENT_VALID=1
                      else
                        PLAN_DOCUMENT_VALID=0
                      fi

                      if [[ $PLAN_EXIT_CODE -eq 0 && "$PLAN_STATUS" != "planned" ]]; then
                        PLAN_DOCUMENT_VALID=0
                      elif [[ $PLAN_EXIT_CODE -ne 0 && "$PLAN_STATUS" != "invalid" ]]; then
                        PLAN_DOCUMENT_VALID=0
                      fi

                      PLAN_SUMMARY="$PLAN_SUMMARY_DIRECTORY/deployment-plan.md"
                      echo "### Deployment Plan" > "$PLAN_SUMMARY"
                      if [[ $PLAN_DOCUMENT_VALID -eq 1 ]]; then
                        echo '```json' >> "$PLAN_SUMMARY"
                        cat "$PLAN_STDOUT" >> "$PLAN_SUMMARY"
                        echo '```' >> "$PLAN_SUMMARY"
                      else
                        echo "Publishable plan output was unavailable." >> "$PLAN_SUMMARY"
                      fi
                      echo "##vso[task.uploadsummary]$PLAN_SUMMARY"

                      if [[ $PLAN_EXIT_CODE -ne 0 ]]; then
                        echo "##vso[task.logissue type=error]Executable plan preparation failed. Run the plan locally for private diagnostics."
                        exit "$PLAN_EXIT_CODE"
                      fi
                      if [[ $PLAN_DOCUMENT_VALID -ne 1 ]]; then
                        echo "##vso[task.logissue type=error]Site Ops returned an unsupported plan document."
                        exit 1
                      fi
                      if [[ "$DRY_RUN" == "True" ]]; then
                        echo "##vso[task.logissue type=warning]Executable plan prepared. No deployment was executed."
                        exit 0
                      fi

                      START_TIME=$(date +%s)

                      CMD_ARGS=(-w "$WORKSPACE" deploy "$MANIFEST")

                      [[ -n "$SELECTOR" ]] && CMD_ARGS+=(-l "$SELECTOR")

                      echo "Executing Site Ops deployment"
                      if siteops "${CMD_ARGS[@]}" 2>&1; then
                        DEPLOY_EXIT_CODE=0
                      else
                        DEPLOY_EXIT_CODE=$?
                      fi

                      END_TIME=$(date +%s)
                      DURATION=$((END_TIME - START_TIME))

                      RESULT_FILE="$PLAN_SUMMARY_DIRECTORY/deployment-result.md"
                      echo "### Deployment Result" > "$RESULT_FILE"
                      if [[ $DEPLOY_EXIT_CODE -eq 0 ]]; then
                        echo "✅ **Success** in ${DURATION}s" >> "$RESULT_FILE"
                      else
                        echo "❌ **Failed** after ${DURATION}s" >> "$RESULT_FILE"
                      fi
                      echo "##vso[task.uploadsummary]$RESULT_FILE"

                      exit $DEPLOY_EXIT_CODE
                  env:
                    WORKSPACE: ${{ parameters.workspace }}
                    MANIFEST: ${{ parameters.manifest }}
                    SELECTOR: ${{ parameters.selector }}
                    DRY_RUN: ${{ parameters.dryRun }}
                    PLAN_TEMP_DIRECTORY: $(Agent.TempDirectory)
                    PLAN_SUMMARY_DIRECTORY: $(Build.ArtifactStagingDirectory)
