# Maintainer stages exercising the ordinary source-install consumer path.
stages:
  - template: siteops-validate.yaml
    parameters:
      stageName: validate_selector
      siteopsSource: $(Build.SourcesDirectory)
      workspace: tests/fixtures/ado-consumer/workspace
      manifest: manifests/smoke.yaml
      selector: environment=smoke

  - template: siteops-validate.yaml
    parameters:
      stageName: validate_site_file
      siteopsSource: $(Build.SourcesDirectory)
      workspace: tests/fixtures/ado-consumer/workspace
      manifest: manifests/smoke.yaml
      siteFile: tests/fixtures/ado-consumer/operator/site.yaml

  # The frozen v1.0.0b7 caller fixture, so released caller content keeps
  # passing through the current templates.
  - template: siteops-validate.yaml
    parameters:
      stageName: validate_b7_selector
      siteopsSource: $(Build.SourcesDirectory)
      workspace: tests/fixtures/compatibility/v1.0.0b7/ado-consumer/workspace
      manifest: manifests/smoke.yaml
      selector: environment=smoke

  - template: siteops-validate.yaml
    parameters:
      stageName: validate_b7_site_file
      siteopsSource: $(Build.SourcesDirectory)
      workspace: tests/fixtures/compatibility/v1.0.0b7/ado-consumer/workspace
      manifest: manifests/smoke.yaml
      siteFile: tests/fixtures/compatibility/v1.0.0b7/ado-consumer/operator/site.yaml
