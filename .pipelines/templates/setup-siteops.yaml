# Steps template: Install an identified engine or an explicitly selected source.

parameters:
  - name: pythonVersion
    displayName: Python version
    type: string
    default: '3.11'
  - name: installDev
    displayName: Explicit editable checkout installation with development dependencies
    type: boolean
    default: false
  - name: siteopsSource
    displayName: Explicit pip source (empty selects the released engine)
    type: string
    default: ''
  - name: enableCache
    displayName: Enable pip caching (disable for deployment jobs which lack caching scopes)
    type: boolean
    default: true
  - name: sourceDirectory
    displayName: Reviewed automation or development source directory
    type: string
    default: $(Build.SourcesDirectory)
  - name: templateRepository
    type: string
    default: self
  - name: release
    type: string
    default: ''
  - name: sourceCommit
    type: string
    default: ''
  - name: repository
    type: string
    default: ''

steps:
  - task: UsePythonVersion@0
    displayName: Set up Python ${{ parameters.pythonVersion }}
    inputs:
      versionSpec: ${{ parameters.pythonVersion }}

  - ${{ if and(eq(parameters.enableCache, true), or(eq(parameters.installDev, true), not(in(parameters.siteopsSource, '', ' ')))) }}:
    - script: |
        set -euo pipefail
        PIP_CACHE_DIR="$(pip cache dir)"
        if [[ -z "$PIP_CACHE_DIR" ]]; then
          echo "##vso[task.logissue type=error]Pip returned an empty cache directory."
          exit 1
        fi
        echo "##vso[task.setvariable variable=PIP_CACHE_DIR]$PIP_CACHE_DIR"
      displayName: Resolve pip cache directory

    - task: Cache@2
      displayName: Cache pip packages
      inputs:
        ${{ if eq(parameters.siteopsSource, '') }}:
          key: pip | "$(Agent.OS)" | ${{ parameters.installDev }} | ${{ parameters.sourceDirectory }}/pyproject.toml
        ${{ else }}:
          key: pip | "$(Agent.OS)" | "${{ parameters.siteopsSource }}"
        path: $(PIP_CACHE_DIR)
        restoreKeys: |
          pip | "$(Agent.OS)"

  - script: |
      set -euo pipefail
      if [[ -n "${SITEOPS_SOURCE//[[:space:]]/}" || "$INSTALL_DEV" == "True" ]]; then
        if [[ -n "${SITEOPS_RELEASE//[[:space:]]/}${SITEOPS_SOURCE_COMMIT//[[:space:]]/}${SITEOPS_REPOSITORY//[[:space:]]/}" ||
              ( -n "${SITEOPS_SOURCE//[[:space:]]/}" && "$INSTALL_DEV" == "True" ) ]]; then
          echo "##vso[task.logissue type=error]Choose a release, an explicit source, or a development installation."
          exit 1
        fi
        pip install --upgrade pip
        if [[ -n "${SITEOPS_SOURCE//[[:space:]]/}" ]]; then
          pip install "$SITEOPS_SOURCE"
        else
          pip install -e ".[dev]"
        fi
      else
        if [[ ! -f "$SOURCE_DIRECTORY/scripts/install-siteops-consumer.py" ]]; then
          echo "##vso[task.logissue type=error]Release installation requires the matching automation scripts. Select templateRepository or copy the matching helpers."
          exit 1
        fi
        python3 -I -S -B "$SOURCE_DIRECTORY/scripts/install-siteops-consumer.py" \
          --source-directory "$SOURCE_DIRECTORY" --state-parent "$STATE_PARENT"
      fi
    displayName: Install Site Ops
    workingDirectory: ${{ parameters.sourceDirectory }}
    env:
      INSTALL_DEV: ${{ parameters.installDev }}
      SITEOPS_SOURCE: ${{ parameters.siteopsSource }}
      SITEOPS_RELEASE: ${{ parameters.release }}
      SITEOPS_SOURCE_COMMIT: ${{ parameters.sourceCommit }}
      SITEOPS_REPOSITORY: ${{ parameters.repository }}
      SOURCE_DIRECTORY: ${{ parameters.sourceDirectory }}
      STATE_PARENT: $(Agent.TempDirectory)
      ${{ if eq(parameters.templateRepository, 'self') }}:
        SITEOPS_AUTOMATION_REF: $(Build.SourceBranch)
        SITEOPS_AUTOMATION_VERSION: $(Build.SourceVersion)
        SITEOPS_AUTOMATION_REPOSITORY: $(Build.Repository.Name)
        SITEOPS_AUTOMATION_PROVIDER: $(Build.Repository.Provider)
      ${{ else }}:
        SITEOPS_AUTOMATION_REF: $(SITEOPS_AUTOMATION_REF)
        SITEOPS_AUTOMATION_VERSION: $(SITEOPS_AUTOMATION_VERSION)
        SITEOPS_AUTOMATION_REPOSITORY: $(SITEOPS_AUTOMATION_REPOSITORY)
        SITEOPS_AUTOMATION_PROVIDER: $(SITEOPS_AUTOMATION_PROVIDER)

  - script: siteops --version
    displayName: Verify Site Ops installation
