# Integration tests: deploy manifests against real Azure and assert outputs
# On-demand only via manual trigger
# Azure Pipelines counterpart to .github/workflows/integration-test.yaml
# Set each environment's service connection and variable group in the
# Environment settings block under variables.

trigger: none

pr: none

parameters:
  - name: manifest
    displayName: "Test phase"
    type: string
    default: all
    values:
      - all
      - aio-install
      - enable-secretsync
      - sync-secrets
      - opc-ua-solution
      - dataflow-sample
      - aio-resources

  - name: skipCleanup
    displayName: "Skip resource cleanup (for debugging)"
    type: boolean
    default: false

  - name: keepAzSessionActive
    displayName: Refresh Azure WIF session (experimental AzureCLI task option)
    type: boolean
    default: false

  - name: environment
    displayName: Target environment
    type: string
    default: dev
    values: [dev, staging, prod]

  - name: selector
    displayName: "Site selector override (default: manifest selector)"
    type: string
    default: ""

variables:
  - name: SITE_OVERRIDES
    value: ''

  # Environment settings: one service connection and variable group per
  # environment. Edit the names here. A queued run chooses only the
  # environment, so it cannot pair one environment's approvals with another
  # environment's identity or secrets. Add a block for each value you add to
  # the environment parameter.
  - ${{ if eq(parameters.environment, 'dev') }}:
    - group: siteops-secrets
    - name: siteopsServiceConnection
      value: azure-siteops
  - ${{ if eq(parameters.environment, 'staging') }}:
    - group: siteops-secrets
    - name: siteopsServiceConnection
      value: azure-siteops
  - ${{ if eq(parameters.environment, 'prod') }}:
    - group: siteops-secrets
    - name: siteopsServiceConnection
      value: azure-siteops

  - name: PYTHONUNBUFFERED
    value: '1'
  # Engine output reaches this pipeline's logs and artifacts, which are public.
  - name: SITEOPS_REDACT_OUTPUT
    value: '1'

pool:
  vmImage: ubuntu-latest

jobs:
  - deployment: integration_test
    displayName: Integration Tests
    environment: ${{ parameters.environment }}

    strategy:
      runOnce:
        deploy:
          steps:
            - checkout: self
              fetchDepth: 1
              persistCredentials: false

            - template: templates/setup-siteops.yaml
              parameters:
                installDev: true
                enableCache: false

            - script: |
                set -euo pipefail
                python3 scripts/mask-site-overrides.py azure-pipelines
              displayName: Mask secret values
              env:
                SITE_OVERRIDES: $(SITE_OVERRIDES)

            - task: AzureCLI@2
              displayName: Run integration tests
              inputs:
                azureSubscription: ${{ variables.siteopsServiceConnection }}
                keepAzSessionActive: ${{ parameters.keepAzSessionActive }}
                scriptType: bash
                scriptLocation: inlineScript
                inlineScript: |
                  set -euo pipefail
                  if [[ "$MANIFEST" == "all" ]]; then
                    PYTEST_ARGS="tests/integration/"
                  else
                    PYTEST_ARGS="tests/integration/test_${MANIFEST//-/_}_manifest.py"
                  fi

                  pytest $PYTEST_ARGS \
                    -v --tb=long \
                    -m integration \
                    --junitxml="$RESULTS_DIRECTORY/integration-results.xml"
              env:
                MANIFEST: ${{ parameters.manifest }}
                SITE_OVERRIDES: $(SITE_OVERRIDES)
                INTEGRATION_SKIP_CLEANUP: ${{ parameters.skipCleanup }}
                INTEGRATION_SELECTOR: ${{ parameters.selector }}
                RESULTS_DIRECTORY: $(Build.ArtifactStagingDirectory)

            - task: PublishTestResults@2
              displayName: Publish test results
              condition: succeededOrFailed()
              inputs:
                testResultsFormat: JUnit
                testResultsFiles: "$(Build.ArtifactStagingDirectory)/integration-results.xml"
                testRunTitle: Integration Tests
                failTaskOnFailedTests: true
                failTaskOnMissingResultsFile: true
