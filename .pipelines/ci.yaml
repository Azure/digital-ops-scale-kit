# CI pipeline: Unit tests and manifest validation
# Azure Pipelines counterpart to .github/workflows/ci.yaml

trigger:
  branches:
    include: [main]
  paths:
    include:
      - siteops/**
      - workspaces/**
      - tests/**
      - scripts/**
      - pyproject.toml
      - .pipelines/**

pr:
  branches:
    include: [main]
  paths:
    include:
      - siteops/**
      - workspaces/**
      - tests/**
      - scripts/**
      - pyproject.toml
      - .pipelines/**

pool:
  vmImage: ubuntu-latest

jobs:
  - job: lint
    displayName: Lint
    steps:
      - checkout: self
        fetchDepth: 1
        persistCredentials: false

      - template: templates/setup-siteops.yaml
        parameters:
          installDev: true

      - script: ruff check siteops tests scripts
        displayName: Run ruff

  - job: test
    displayName: Unit Tests
    pool:
      vmImage: ubuntu-24.04
    steps:
      - checkout: self
        fetchDepth: 1
        persistCredentials: false

      # Tests compare the frozen v1.0.0b7 fixtures with this protected upstream tag.
      - script: |
          set -euo pipefail
          git fetch --quiet --no-tags --depth=1 https://github.com/Azure/digital-ops-scale-kit \
            "+refs/tags/v1.0.0b7:refs/tags/v1.0.0b7"
        displayName: Fetch the v1.0.0b7 compatibility baseline

      - template: templates/setup-siteops.yaml
        parameters:
          installDev: true

      - script: |
          set -euo pipefail
          fixtures="$AGENT_TEMPDIRECTORY/siteops-uv-fixtures"
          bash tests/fixtures/prepare-native-uv.sh "$fixtures"
          echo "##vso[task.setvariable variable=SITEOPS_TEST_UV]$fixtures/native/uv"
          echo "##vso[task.setvariable variable=SITEOPS_TEST_UV_ARCHIVE]$fixtures/uv.tar.gz"
          echo "##vso[task.setvariable variable=SITEOPS_TEST_UV_PYTHON_ARCHIVE]$fixtures/cpython.tar.gz"
          echo "##vso[task.setvariable variable=SITEOPS_REQUIRE_LINUX_UV]1"
        displayName: Prepare native Linux uv fixtures

      # Includes bounded executable-plan coverage in tests/workspace/
      # test_executable_plans.py, using real catalog sites and Bicep schemas.
      # Compiler acquisition and module restore may use the network. The
      # tests block Azure deployment and cluster commands.
      - script: >
          pytest tests/ -m "not integration" -v
          --cov=siteops
          --cov-report=term-missing
          --cov-report=xml:coverage.xml
          --junitxml=test-results.xml
          --durations=25
        displayName: Run unit tests
        env:
          SITEOPS_REQUIRE_COMPATIBILITY_TAG: "1"

      - task: PublishTestResults@2
        displayName: Publish test results
        condition: succeededOrFailed()
        inputs:
          testResultsFormat: JUnit
          testResultsFiles: test-results.xml
          testRunTitle: Site Ops Unit Tests
          failTaskOnFailedTests: true
          failTaskOnMissingResultsFile: true

      - task: PublishCodeCoverageResults@2
        displayName: Publish code coverage
        condition: succeededOrFailed()
        inputs:
          summaryFileLocation: coverage.xml
          failIfCoverageEmpty: true

  - job: validate
    displayName: Validate Manifests
    variables:
      SITEOPS_REDACT_OUTPUT: '1'
    steps:
      - checkout: self
        fetchDepth: 1
        persistCredentials: false

      - template: templates/setup-siteops.yaml
        parameters:
          installDev: true

      - pwsh: ./scripts/validate-bicep.ps1
        displayName: Validate Bicep templates

      - pwsh: |
          ./workspaces/iot-operations/templates/host-bootstrap/aksee/scripts/Build-Launcher.ps1
          ./workspaces/iot-operations/templates/host-ops/aksee-upgrade/scripts/Build-Launcher.ps1
          git diff --exit-code -- `
            workspaces/iot-operations/templates/host-bootstrap/aksee/scripts/Install-AksEeBootstrap.ps1 `
            workspaces/iot-operations/templates/host-bootstrap/aksee/scripts/Install-AksEeBootstrap.min.ps1 `
            workspaces/iot-operations/templates/host-ops/aksee-upgrade/scripts/Install-AksEeUpgrade.ps1 `
            workspaces/iot-operations/templates/host-ops/aksee-upgrade/scripts/Install-AksEeUpgrade.min.ps1
          if ($LASTEXITCODE -ne 0) {
            throw "Generated host launchers are stale. Run each Build-Launcher.ps1 and commit the outputs."
          }
        displayName: Verify generated host launchers

      - script: |
          set -euo pipefail
          WORKSPACE_DIR="workspaces/iot-operations"
          # Discover standalone Manifest YAML across the standard top-level dirs.
          # Excludes partials (filename prefixed `_`) and non-manifest YAML
          # under samples/ (inputs.yaml, outputs.yaml, etc.).
          if MANIFESTS=$(
            find "$WORKSPACE_DIR/manifests" "$WORKSPACE_DIR/samples" -mindepth 2 -maxdepth 2 \
              \( -name "manifest.yaml" -o -name "manifest.yml" \) 2>/dev/null | tr '\n' ' '
          ); then
            :
          else
            code=$?
            echo "##vso[task.logissue type=error]Manifest discovery failed."
            exit "$code"
          fi

          if [[ -z "$MANIFESTS" ]]; then
            echo "##vso[task.logissue type=error]The workspace has no standalone manifests to validate."
            exit 1
          fi

          echo "Found manifests: $MANIFESTS"

          SUMMARY_FILE="$(Build.ArtifactStagingDirectory)/validation-summary.md"
          echo "## Manifest Validation" > "$SUMMARY_FILE"
          umask 077
          private="$(mktemp -d "$STATE_PARENT/siteops-validate.XXXXXX")"
          cleanup() {
            local status=$?
            if rm -f "$private/stdout" "$private/stderr" 2>/dev/null && rmdir "$private" 2>/dev/null; then
              :
            else
              echo "##vso[task.logissue type=error]Private validation files could not be removed."
              if [[ $status -eq 0 ]]; then status=1; fi
            fi
            exit "$status"
          }
          trap cleanup EXIT
          EXIT_CODE=0

          for manifest in $MANIFESTS; do
            manifest_rel="${manifest#$WORKSPACE_DIR/}"
            echo "##[group]Validating $manifest"
            echo "### $manifest_rel" >> "$SUMMARY_FILE"

            # Libraries without targets remain structurally valid. Executable
            # catalog coverage runs in the workspace tests, not this sweep.
            if siteops -w "$WORKSPACE_DIR" validate "$manifest_rel" --output json --projection publishable \
                > "$private/stdout" 2> "$private/stderr"; then
              code=0
            else
              code=$?
            fi
            if [[ ! -f scripts/render-siteops-output.py ]]; then
              if [[ $code -eq 2 ]]; then
                echo "##vso[task.logissue type=error]Site Ops engine and template releases do not match. Use matching engine, setup, templates and helpers."
              else
                echo "##vso[task.logissue type=error]Diagnostic details are unavailable."
              fi
              report=1
            elif python3 -I -S -B scripts/render-siteops-output.py "$private/stdout" \
                --kind ValidationResult --exit-code "$code" --platform ado \
                --summary "$SUMMARY_FILE"; then
              report=0
            else
              report=$?
            fi
            if [[ $code -ne 0 || $report -ne 0 ]]; then EXIT_CODE=1; fi

            echo "##[endgroup]"
          done

          echo "##vso[task.uploadsummary]$SUMMARY_FILE"
          exit $EXIT_CODE
        displayName: Validate manifest structure
        env:
          STATE_PARENT: $(Agent.TempDirectory)
