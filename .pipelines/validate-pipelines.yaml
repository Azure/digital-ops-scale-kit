# Maintainer qualification: full template previews and non-deploying consumer smoke.
trigger: none
pr: none

pool:
  vmImage: ubuntu-24.04

variables:
  SITE_OVERRIDES: ''

stages:
  - template: templates/consumer-smoke.yaml

  - stage: preview
    displayName: Preview pipeline templates
    dependsOn: []
    jobs:
      - job: preview
        timeoutInMinutes: 20
        steps:
          - checkout: self
            fetchDepth: 1
            persistCredentials: false

          - task: UsePythonVersion@0
            displayName: Set up Python 3.11
            inputs:
              versionSpec: '3.11'

          - script: |
              set -euo pipefail
              umask 077
              python -m venv "$PREVIEW_TOOLS"
              "$PREVIEW_TOOLS/bin/python" -m pip install --require-hashes --only-binary=:all: --no-cache-dir \
                -r scripts/siteops-runtime-requirements.txt
            displayName: Install locked preview dependencies
            env:
              PREVIEW_TOOLS: $(Agent.TempDirectory)/preview-tools
              PIP_EXTRA_INDEX_URL: ''
              PIP_NO_INPUT: '1'
              PIP_KEYRING_PROVIDER: disabled
              PIP_DISABLE_PIP_VERSION_CHECK: '1'

          - script: |
              set -euo pipefail
              umask 077
              "$PREVIEW_TOOLS/bin/python" -E -s -B scripts/preview-ado-pipelines.py \
                --output "$RESULTS_DIRECTORY/pipeline-preview.json"
            displayName: Preview the exact source candidate
            env:
              PREVIEW_TOOLS: $(Agent.TempDirectory)/preview-tools
              SYSTEM_ACCESSTOKEN: $(System.AccessToken)
              SYSTEM_COLLECTIONURI: $(System.CollectionUri)
              SYSTEM_TEAMPROJECTID: $(System.TeamProjectId)
              SYSTEM_DEFINITIONID: $(System.DefinitionId)
              BUILD_REPOSITORY_URI: $(Build.Repository.Uri)
              BUILD_SOURCEBRANCH: $(Build.SourceBranch)
              BUILD_SOURCEVERSION: $(Build.SourceVersion)
              RESULTS_DIRECTORY: $(Build.ArtifactStagingDirectory)

          - task: PublishPipelineArtifact@1
            displayName: Publish preview receipt
            inputs:
              targetPath: $(Build.ArtifactStagingDirectory)/pipeline-preview.json
              artifact: pipeline-preview

  - stage: qualification_report
    displayName: Report qualification
    dependsOn: [preview, validate_selector, validate_site_file]
    condition: always()
    jobs:
      - job: report
        condition: always()
        timeoutInMinutes: 5
        variables:
          ADO_QUALIFICATION_REPORT_READY: 'false'
          PREVIEW_RESULT: $[ stageDependencies.preview.preview.result ]
          SELECTOR_RESULT: $[ stageDependencies.validate_selector.siteops_validate.result ]
          SITE_FILE_RESULT: $[ stageDependencies.validate_site_file.siteops_validate.result ]
        steps:
          - checkout: self
            fetchDepth: 1
            persistCredentials: false

          - task: UsePythonVersion@0
            inputs:
              versionSpec: '3.11'

          - task: DownloadPipelineArtifact@2
            displayName: Read preview receipt
            condition: eq(variables['PREVIEW_RESULT'], 'Succeeded')
            inputs:
              buildType: current
              artifactName: pipeline-preview
              targetPath: $(Agent.TempDirectory)/ado-preview

          - script: |
              set -euo pipefail
              umask 077
              python3 -I -S -B scripts/summarize-ado-qualification.py \
                --preview "$PREVIEW_RECEIPT" --output "$REPORT_DIRECTORY"
            displayName: Summarize qualification
            condition: always()
            env:
              BUILD_SOURCEVERSION: $(Build.SourceVersion)
              PREVIEW_RESULT: $(PREVIEW_RESULT)
              SELECTOR_RESULT: $(SELECTOR_RESULT)
              SITE_FILE_RESULT: $(SITE_FILE_RESULT)
              REPORT_PREPARATION_RESULT: $(Agent.JobStatus)
              PREVIEW_RECEIPT: $(Agent.TempDirectory)/ado-preview/pipeline-preview.json
              REPORT_DIRECTORY: $(Build.ArtifactStagingDirectory)/ado-qualification

          - task: PublishPipelineArtifact@1
            displayName: Publish qualification report
            condition: and(always(), eq(variables['ADO_QUALIFICATION_REPORT_READY'], 'true'))
            inputs:
              targetPath: $(Build.ArtifactStagingDirectory)/ado-qualification
              artifact: ado-qualification
