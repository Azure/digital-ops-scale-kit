apiVersion: siteops/v1
kind: Manifest
name: aksee-upgrade-step
description: |
  AKS Edge Essentials upgrade step, applied in place. Delivers and runs the
  upgrade launcher on a Windows VM onboarded to Azure Arc via Arc Run Command.
  The launcher registers a Scheduled Task that drives the worker state machine
  through preflight + snapshot, stage, apply (reboots the inner node VM),
  verify, and the completion tag.

  Internal partial (filename prefixed `_`). Not deployed directly. Composed by
  the standalone `manifests/aksee-upgrade/manifest.yaml` (which adds the `type: wait`
  gate) and by any composition that adds an upgrade step.

steps:
  - name: aksee-upgrade
    template: templates/host-ops/aksee-upgrade/template.bicep
    scope: resourceGroup
    parameters:
      - parameters/inputs/aksee-upgrade.yaml
