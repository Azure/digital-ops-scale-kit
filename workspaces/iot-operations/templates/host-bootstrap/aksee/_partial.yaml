apiVersion: siteops/v1
kind: Manifest
name: aksee-bootstrap-step
description: |
  AKS Edge Essentials host bootstrap step. Delivers and runs the bootstrap
  launcher on a Windows VM onboarded to Azure Arc via Arc Run Command. The
  launcher registers a Scheduled Task that drives the worker state machine
  through preflight, MSI install + Hyper-V enable (may reboot), K3s cluster
  creation on a single node, connection to Azure Arc with custom locations,
  and cleanup.

  Internal partial (filename prefixed `_`). Not deployed directly. Composed
  by the standalone `manifests/aksee-bootstrap/manifest.yaml` and by compositions
  that add a host bootstrap step before AIO install (for example,
  `samples/aio-with-aksee-bootstrap/manifest.yaml`).

steps:
  - name: aksee-bootstrap
    template: templates/host-bootstrap/aksee/template.bicep
    scope: resourceGroup
    parameters:
      - parameters/inputs/aksee-bootstrap.yaml
