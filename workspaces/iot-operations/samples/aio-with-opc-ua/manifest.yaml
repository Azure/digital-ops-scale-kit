apiVersion: siteops/v1
kind: Manifest
name: aio-with-opc-ua
description: |
  End-to-end example: composes the AIO platform install with the OPC UA
  sample on top, demonstrating an asset producing telemetry that flows from
  the broker through a dataflow to an Event Hub destination.

  From AIO API version 2026-07-01, which includes the default 2607, AIO runs
  the OPC UA connector as a pod it creates on demand from a ConnectorTemplate.
  A future release adds that resource. See samples/opc-ua-solution/README.md.

  Post-flatten step sequence (preview with `siteops validate --plan`):
    1. global-edge-site         (gated by enableGlobalSite)
    2. edge-site                (gated by enableEdgeSite)
    3. schema-registry
    4. adr-ns
    5. aio-enablement
    6. aio-instance
    7. schema-registry-role
    8. resolve-aio
    9. secretsync               (gated by enableSecretSync)
   10. opc-ua-solution
   11. opc-plc-simulator

# Default selector. Override at the CLI with `-l <key>=<value>`.
selector: "environment=dev"

# Max concurrent sites. Mirrors the sample manifest. 0 = unlimited, 1 = serial.
parallel: 3

parameters:
  - parameters/common/common.yaml
  - "parameters/aio-releases/{{ site.properties.aioRelease }}.yaml"

steps:
  - include: ../../manifests/_aio-fundamentals.yaml
  - include: ../../manifests/_resolve-aio.yaml
  # Matches aio-install.yaml, so the site toggle means the same thing here.
  - include: ../../manifests/_secretsync.yaml
    when: "{{ site.properties.deployOptions.enableSecretSync }}"
  - include: ../opc-ua-solution/_partial.yaml
