apiVersion: siteops/v1
kind: Manifest
name: aio-with-opc-ua
description: |
  Install the Azure IoT Operations platform and the OPC UA sample in one
  deploy: a simulated OPC UA asset whose telemetry flows through the broker
  and a dataflow to Event Hub. After the components reconcile, observe the
  broker topic and Event Hub to confirm that data moves.

  Flattened step sequence (preview with `siteops plan <manifest> --describe`):
    1. global-edge-site         (gated by enableGlobalSite)
    2. edge-site                (gated by enableEdgeSite)
    3. schema-registry
    4. adr-ns
    5. aio-enablement
    6. aio-instance
    7. schema-registry-role
    8. resolve-aio
    9. secretsync               (gated by enableSecretSync)
   10. opc-ua-solution
   11. opc-plc-simulator

# Default selector. Override at the CLI with `-l <key>=<value>`.
selector: "environment=dev"

# Max concurrent Sites. 0 = unlimited, 1 = serial.
parallel: 3

parameters:
  - parameters/common/common.yaml
  - "parameters/aio-releases/{{ site.properties.aioRelease }}.yaml"

steps:
  - include: ../../manifests/_partials/_aio-fundamentals.yaml
  - include: ../../manifests/_partials/_resolve-aio.yaml
  # Matches the aio-install manifest, so the Site toggle means the same thing here.
  - include: ../../manifests/_partials/_secretsync.yaml
    when: "{{ site.properties.deployOptions.enableSecretSync }}"
  - include: ../opc-ua-solution/_partial.yaml
