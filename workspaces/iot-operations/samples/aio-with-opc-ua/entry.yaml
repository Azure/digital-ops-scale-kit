apiVersion: siteops/v1alpha1
kind: DeploymentEntry
role: standalone
category: sample
tags: [aio, opc-ua, workload, composition]
documentation: [README.md]
outcome: Install AIO and the composed OPC UA-to-cloud example on a fresh cluster.
prerequisites:
  - A prepared Arc-connected cluster, configured Site and both installation and solution permissions.
  - Azure CLI with the connectedk8s extension, and kubectl. The simulator step applies a Kubernetes manifest through the Arc cluster connect proxy.
  - Azure access to the Arc cluster through cluster connect, and Kubernetes RBAC in the cluster for the simulator objects, as listed in the OPC UA sample prerequisites.
  - Outbound access to raw.githubusercontent.com. The simulator manifest is downloaded from a pinned commit during deployment.
  - Review the selected release's connector limitations and the solution's simulator input.
effects:
  - Combines platform installation, simulated equipment, Device Registry resources, a dataflow and Event Hub resources.
  - Applies the external simulator manifest to the cluster with kubectl. Browsing does not read that manifest.
  - Creates billable resources and role assignments. Deployment does not establish telemetry delivery.
removal:
  - Use the component guides to remove owned resources deliberately while preserving retained infrastructure.
coverage: Composition synopsis. The guides own detailed configuration, functional limits for each release and the telemetry checks after deployment.
