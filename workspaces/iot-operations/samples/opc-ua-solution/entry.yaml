apiVersion: siteops/v1alpha1
kind: DeploymentEntry
role: standalone
category: sample
tags: [aio, opc-ua, event-hub, bicep]
documentation: [README.md]
outcome: Deploy a simulated solution from OPC UA to Event Hub on an existing AIO instance.
prerequisites:
  - An existing AIO instance, configured Site, deployment permissions and Arc Kubernetes access.
  - Azure CLI with the connectedk8s extension, and kubectl. The simulator step applies a Kubernetes manifest through the Arc cluster connect proxy.
  - Outbound access to raw.githubusercontent.com for the simulator manifest pinned to a commit.
  - Review the selected AIO release's connector limitations and that external simulator manifest.
effects:
  - Creates Device Registry, Event Hub, role assignment and dataflow resources and applies the simulator through kubectl.
  - The external simulator document is obtained during execution, outside this local inspection.
  - Confirm telemetry delivery separately with the guide's checks.
removal:
  - Follow the guide's cleanup of Azure resources and the simulator, preserving shared infrastructure.
coverage: Solution synopsis. The guide covers the external simulator manifest, AIO release support and data movement checks.
