# The set of Key Vault secrets this sample synchronizes.
#
# Attached at manifest level, which puts it below site parameters in the merge
# order, so a `sites.local/` overlay or a CI/CD secret store overrides it. It
# also reaches every step in the flattened pipeline, so the enablement step and
# the sync step both PUT the Secret Provider Class from this one declaration
# instead of each holding its own copy.
# See docs/parameter-resolution.md for the attachment rule.
# Consumed by: secretsync, sync-secrets

# Per-secret metadata. The `secretName` is the Key Vault secret name and is
# also the default Kubernetes Secret name and key. Override
# `kubernetesSecretName` and `kubernetesSecretKey` per entry when a consuming
# workload needs a specific Secret name or key. Set `createInKv: false` to
# sync a secret that already exists in the Key Vault.
#
# Entries that share a `kubernetesSecretName` are grouped into a single
# multi-key Kubernetes Secret, the common pattern for credential bundles
# like `db-credentials` with host / username / password keys.
secrets:
  - secretName: secretsync-sample-secret-a
  - secretName: secretsync-sample-secret-b
    kubernetesSecretName: secretsync-sample-app-b
    kubernetesSecretKey: token
  # The three entries below all materialize into one Kubernetes Secret
  # `secretsync-sample-db-credentials` with three keys: host, username,
  # password.
  - secretName: secretsync-sample-db-host
    kubernetesSecretName: secretsync-sample-db-credentials
    kubernetesSecretKey: host
  - secretName: secretsync-sample-db-username
    kubernetesSecretName: secretsync-sample-db-credentials
    kubernetesSecretKey: username
  - secretName: secretsync-sample-db-password
    kubernetesSecretName: secretsync-sample-db-credentials
    kubernetesSecretKey: password
  # A second multi-key group, `secretsync-sample-mqtt-credentials`
  # with keys host and port.
  - secretName: secretsync-sample-mqtt-host
    kubernetesSecretName: secretsync-sample-mqtt-credentials
    kubernetesSecretKey: host
  - secretName: secretsync-sample-mqtt-port
    kubernetesSecretName: secretsync-sample-mqtt-credentials
    kubernetesSecretKey: port

# Secret values keyed by `secretName`. For real deployments, supply via a
# `sites.local/` overlay or a CI/CD secret. Do not commit real values.
secretValues:
  secretsync-sample-secret-a: "secretsync-sample-value-a"
  secretsync-sample-secret-b: "secretsync-sample-value-b"
  secretsync-sample-db-host: "secretsync-sample-db-host-value"
  secretsync-sample-db-username: "secretsync-sample-db-username-value"
  secretsync-sample-db-password: "secretsync-sample-db-password-value"
  secretsync-sample-mqtt-host: "secretsync-sample-mqtt-host-value"
  secretsync-sample-mqtt-port: "1883"
