apiVersion: siteops/v1
kind: Manifest
name: aio-install
description: |
  Install Azure IoT Operations on an existing cluster connected to Azure Arc:
  the AIO extensions, instance, custom location, Schema Registry and Device
  Registry namespace. Set `enableSecretSync` to true to also enable Secret
  Sync.

  Composes `_aio-fundamentals.yaml` and adds Secret Sync, backed by workload
  identity, when the Site enables it.

  Optional capabilities (each gated by a Site `deployOptions.*` flag):
    - enableSecretSync        Secret Sync backed by workload identity
    - enableGlobalSite        Edge Site scoped to the subscription (deployed once per subscription)
    - enableEdgeSite          Edge Site scoped to the resource group (deployed once per resource group)

  To add a sample on top of this install, see `samples/aio-with-opc-ua/manifest.yaml`
  for an example that composes this install with the OPC UA sample in one
  deploy.

# Max concurrent Sites. 0 = unlimited, 1 = serial.
parallel: 3

# Default selector. Override at the CLI with `-l <key>=<value>`.
# Sites scoped to a subscription (for example contoso-global) use different
# labels and are intentionally excluded here. Target them with `-l scope=subscription`.
selector: "environment=dev"

steps:
  - include: ../_partials/_aio-fundamentals.yaml
  - include: ../_partials/_resolve-aio.yaml
    when: "{{ site.properties.deployOptions.enableSecretSync }}"
  - include: ../_partials/_secretsync.yaml
    when: "{{ site.properties.deployOptions.enableSecretSync }}"

