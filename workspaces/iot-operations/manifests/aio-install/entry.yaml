apiVersion: siteops/v1alpha1
kind: DeploymentEntry
role: standalone
category: core
tags: [aio, install, existing-cluster]
documentation: [README.md]
outcome: Install AIO platform fundamentals on an existing Kubernetes cluster connected to Azure Arc.
inputs:
  - field: subscription
    type: string
    requirement: required
    description: The Site's subscription, from a configured Site or typed answers for one Site.
    source: sites/catalog-basic.yaml
  - field: resourceGroup
    type: string
    requirement: required
    description: Existing resource group containing the intended cluster and installation.
    source: sites/catalog-basic.yaml
  - field: location
    type: string
    requirement: required
    description: Confirm the Site's real region. Shared configuration also uses it as cluster location.
    source: parameters/common/common.yaml
  - field: parameters.clusterName
    type: string
    requirement: required
    description: Name of the existing Kubernetes cluster connected to Azure Arc, not the Site name. A declared cluster resource ID can supply this and the Site's subscription, resource group and location through an explicit Azure read.
    source: templates/aio/instance.bicep
  - field: properties.aioRelease
    type: string
    requirement: required
    sensitivity: non-sensitive
    description: The resolved Site needs an AIO release. The configured example inherits one, while the typed AIO route defaults to 2608.
    defaultBehavior: Review the effective AIO release in the selected Site before deployment.
    source: sites/base-site.yaml
  - field: labels
    type: mapping
    requirement: optional
    description: Supplied environment and country labels become resource tags. Omitted labels create no corresponding tags. Optional Edge Site addressing needs its own country and city values when selected.
    source: parameters/common/common.yaml
  - field: parameters.aioInstanceName
    type: string
    requirement: optional
    sensitivity: non-sensitive
    description: Override the supported AIO instance naming convention when needed.
    defaultBehavior: The shared fallback derives the name from the Site name.
    source: parameters/common/common.yaml
  - field: parameters.customLocationName
    type: string
    requirement: optional
    sensitivity: non-sensitive
    description: Installation can accept a Site override of the shared custom location name.
    defaultBehavior: The shared fallback derives the name from the Site name.
    source: templates/aio/instance.bicep
  - field: parameters.brokerConfig
    type: object
    requirement: optional
    description: Broker settings have inherited or template defaults. The typed route starts with the Medium memory profile. Review capacity and trust requirements.
    source: templates/aio/instance.bicep
  - field: properties.deployOptions
    type: mapping
    requirement: conditional
    description: Review cert-manager, Edge Site and optional Secret Sync settings. The typed defaults leave Secret Sync disabled. Guided enablement requires an observed cluster reporting OIDC and workload identity before writes. Host flags do not add those features to an existing cluster.
    source: sites/base-site.yaml
supplied:
  - step: aio-instance
    input: schemaRegistryId
    description: The Schema Registry operation supplies the created registry ID.
    source: parameters/inputs/aio-instance.yaml
  - step: aio-instance
    input: adrNamespaceId
    description: The ADR namespace operation supplies the namespace ID.
    source: parameters/inputs/aio-instance.yaml
  - step: aio-instance
    input: clExtensionIds
    description: The enablement operation supplies the required extension IDs.
    source: parameters/inputs/aio-instance.yaml
  - step: schema-registry-role
    input: aioExtensionPrincipalId
    description: The instance operation supplies the AIO extension identity's principal.
    source: parameters/outputs/aio-instance.yaml
prerequisites:
  - An existing resource group and a Kubernetes cluster connected to Azure Arc that meet the selected AIO release's requirements.
  - Azure CLI for ARM deployment. Source template preparation requires Bicep. Verified workspace packages contain compiled ARM JSON and need no local Bicep compiler for this manifest. This manifest contains no kubectl step.
  - Guided inputs derived from a resource ID require an explicit read by the selected Azure provider using the operator's already configured Azure identity. Source access and deployment authorization remain separate.
  - An authorized deployment identity, including the permissions required to create role assignments. Common guidance is Owner or User Access Administrator plus Contributor.
  - Enabling Secret Sync requires OIDC and workload identity to be ready on the cluster beforehand.
effects:
  - Creates or updates AIO extensions, instance resources, custom location, ADR namespace, Schema Registry storage and role assignments.
  - Secret Sync enablement in this same deployment creates or updates identity, federation, vault and Secret Provider Class resources. An Edge Site scoped to the subscription needs a Site at subscription level.
  - Deployment can incur Azure charges and leave partial changes after failure or interruption.
  - Use the upgrade manifest to change versions in place. Reapplying installation can overwrite settings that operators manage.
removal:
  - Remove created resources deliberately while preserving the existing cluster and other retained resources.
  - Removal is a manual step. Site Ops does not roll back or uninstall automatically.
coverage: Covers installation on an existing cluster through configured Sites or typed answers for one Site. After deployment, check AIO services before adding a workload.
