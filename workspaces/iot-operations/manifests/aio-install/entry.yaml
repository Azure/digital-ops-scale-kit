apiVersion: siteops/v1alpha1
kind: DeploymentEntry
role: standalone
category: core
tags: [aio, install, existing-cluster]
documentation: [README.md]
outcome: Install AIO platform fundamentals on an existing Arc-connected Kubernetes cluster.
inputs:
  - field: subscription
    type: string
    requirement: required
    description: Target subscription from a configured Site or typed single-Site answers.
    source: sites/catalog-basic.yaml
  - field: resourceGroup
    type: string
    requirement: required
    description: Existing resource group containing the intended cluster and installation.
    source: sites/catalog-basic.yaml
  - field: location
    type: string
    requirement: required
    description: Confirm the real target region. Shared configuration also uses it as cluster location.
    source: parameters/common/common.yaml
  - field: parameters.clusterName
    type: string
    requirement: required
    description: Existing Arc-connected Kubernetes cluster name, not the Site name. A declared cluster resource ID can supply this and the target subscription, resource group and location through an explicit Azure read.
    source: templates/aio/instance.bicep
  - field: properties.aioRelease
    type: string
    requirement: required
    sensitivity: non-sensitive
    description: The resolved Site needs an AIO release. The configured example inherits one, while the typed AIO route defaults to 2608.
    defaultBehavior: Review the effective release in the selected Site before deployment.
    source: sites/base-site.yaml
  - field: labels
    type: mapping
    requirement: required
    description: Installation tags need environment and country labels. Configured Sites carry them, while typed answers ask for each. Optional Edge Site addressing also uses city.
    source: parameters/common/common.yaml
  - field: parameters.aioInstanceName
    type: string
    requirement: optional
    sensitivity: non-sensitive
    description: Override the supported AIO instance naming convention when needed.
    defaultBehavior: The shared fallback derives the name from the Site name.
    source: parameters/common/common.yaml
  - field: parameters.customLocationName
    type: string
    requirement: optional
    sensitivity: non-sensitive
    description: Installation can accept a Site override of the shared custom-location name.
    defaultBehavior: The shared fallback derives the name from the Site name.
    source: templates/aio/instance.bicep
  - field: parameters.brokerConfig
    type: object
    requirement: optional
    description: Broker settings have inherited or template defaults. The typed route starts with the Medium memory profile. Review capacity and trust requirements.
    source: templates/aio/instance.bicep
  - field: properties.deployOptions
    type: mapping
    requirement: conditional
    description: Review cert-manager, Edge Site and optional Secret Sync settings. The typed defaults leave Secret Sync disabled. Guided enablement requires an observed cluster reporting OIDC and workload identity before writes. Host flags do not retrofit those features.
    source: sites/base-site.yaml
supplied:
  - step: aio-instance
    input: schemaRegistryId
    description: The Schema Registry operation supplies the created registry ID.
    source: parameters/inputs/aio-instance.yaml
  - step: aio-instance
    input: adrNamespaceId
    description: The ADR namespace operation supplies the namespace ID.
    source: parameters/inputs/aio-instance.yaml
  - step: aio-instance
    input: clExtensionIds
    description: The enablement operation supplies the required extension IDs.
    source: parameters/inputs/aio-instance.yaml
  - step: schema-registry-role
    input: aioExtensionPrincipalId
    description: The instance operation supplies the AIO extension identity's principal.
    source: parameters/outputs/aio-instance.yaml
prerequisites:
  - An existing resource group and Arc-connected Kubernetes cluster meeting the selected AIO release's requirements.
  - Azure CLI for ARM deployment. Source template preparation requires Bicep. Verified workspace packages contain compiled ARM JSON and need no local Bicep compiler for this entry. This manifest contains no kubectl step.
  - Resource-derived guided inputs require an explicit read by the selected Azure provider using the operator's already configured Azure identity. Source access and deployment authorization remain separate.
  - An authorized deployment identity, including the required role-assignment permissions. Common guidance is Owner or User Access Administrator plus Contributor.
  - Enabling Secret Sync requires pre-existing OIDC and workload-identity readiness on the cluster.
effects:
  - Creates or updates AIO extensions, instance resources, custom location, ADR namespace, Schema Registry storage and role assignments.
  - Secret Sync enablement in this same deployment creates or updates identity, federation, vault and Secret Provider Class resources. Subscription-scoped Edge Site work needs an applicable subscription target.
  - Deployment can incur Azure charges and leave partial changes after failure or interruption.
  - Use the upgrade entry for in-place version changes. Reapplying installation can overwrite operator-managed settings.
removal:
  - Remove created resources deliberately while preserving the existing cluster and other retained resources.
  - There is no automatic rollback or general uninstall entry.
coverage: Covers existing-cluster installation through configured Sites or typed single-Site answers. This is descriptive guidance, not the executable input contract or a target readiness assessment. Observe workload functionality separately.
