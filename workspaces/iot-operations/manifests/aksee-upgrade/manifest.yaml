apiVersion: siteops/v1
kind: Manifest
name: aksee-upgrade
description: |
  Upgrade an existing AKS Edge Essentials cluster with a single node in place,
  through Arc Run Command. Applies patch updates by default, or set
  `allowKubernetesMinorUpgrade` to advance Kubernetes minor versions up to
  `targetKubernetesVersion`.

  Follows the host bootstrap's pattern of a Run Command launcher and worker,
  because AKS EE has no upgrade channel driven from the cloud.

  Supports two modes via `site.properties.deployOptions.allowKubernetesMinorUpgrade`:
  - Patch mode (default, false): one hop within the current Kubernetes minor
    version. The worker changes nothing when no newer patch is available.
  - Minor mode (true): a sequential loop over several hops, each hop advancing
    one Kubernetes minor version. An optional `site.parameters.aksee.targetKubernetesVersion`
    stops the loop at a specific minor version. `AcceptUpgrade` is set true for
    the run. Successful finalization attempts to set it back to false. A failed
    run preserves the staged update cache for retry.

  The upgrade launcher registers a Scheduled Task, then the worker stages,
  applies, and verifies the update on the VM asynchronously. The inner node VM
  reboots during each apply, and workloads are down for that window. The wait
  step polls the `siteops.aksee.upgrade.state` tag. The wait checks only the
  state, not the current run identifier.

  The worker verifies the cluster after each hop and attempts to report the
  outcome through the completion tag:
    - The node VM update can intermittently fail to finalize, surfaced as the
      tag value `failed-needs-remediation`. The fix is a manual step in the VM
      console. See the README.
    - The worker rechecks node health and the Arc connection after each hop
      and fails the deploy if either regressed.

  Prerequisites for each VM (once):
    - An AKS EE cluster with a single node is already deployed and connected to Azure Arc.
    - The Arc machine's system-assigned managed identity can write tags on the Arc
      machine resource (`Microsoft.Resources/tags/write`, via `Tag Contributor`
      scoped to the machine or its resource group, or `Contributor`). The worker
      uses it only for the completion tag. The verification runs on the host. A VM
      bootstrapped by `host-bootstrap/aksee` already holds a broader grant.

# Max concurrent Sites. 0 = unlimited, 1 = serial.
parallel: 3

# Default selector. Override at the CLI with `-l <key>=<value>`.
selector: "environment=dev"

steps:
  - include: ../../templates/host-ops/aksee-upgrade/_partial.yaml

  # Gate completion on the worker reaching its terminal state. The worker writes
  # siteops.aksee.upgrade.state=succeeded on the Arc machine resource at the end
  # of Phase 99 (or failed-phase-N / failed-needs-remediation on failure).
  # The `running` tag update before the run is best effort, and this wait checks only
  # the state tag rather than the run identifier.
  - name: wait-for-upgrade
    type: wait
    condition:
      type: arm-tag
      resourceId: "/subscriptions/{{ site.subscription }}/resourceGroups/{{ site.resourceGroup }}/providers/Microsoft.HybridCompute/machines/{{ site.parameters.aksee.machineName }}"
      tagKey: "siteops.aksee.upgrade.state"
      expectedValue: "succeeded"
      failurePattern: "failed-*"
    timeoutMinutes: 240
    pollIntervalSeconds: 30
