apiVersion: siteops/v1
kind: Manifest
name: aio-resources
description: |
  Config-driven AIO workload resources for an existing instance. Each
  deployment family runs only when the site selects a resource area it serves,
  so one entry point serves every combination.

  A site composes ordered sets through `properties.resourceSets.<area>`, which
  resolves to `parameters/<area>/<set>.yaml`. Omitted areas and empty lists
  apply nothing. Devices and assets share one internally ordered Device
  Registry step. That step runs before dataflows so a dataflow naming an asset
  finds it already there.

  Prerequisites:
    - AIO instance must be deployed and running
    - The site's aioRelease must point to a parameters/aio-releases/<release>.yaml file

# Max concurrent sites. 0 = unlimited, 1 = serial.
parallel: 3

# Default selector. Override at the CLI with `-l <key>=<value>`.
selector: "environment=dev"

steps:
  - include: _aio-resources.yaml
