apiVersion: siteops.inputs/v1
kind: SiteInputContract
nameFromResource: cluster
inputs:
  - name: instance
    type: azureResourceId
    description: Existing AIO instance resource ID. Site Ops reads the instance, its custom location and that location's Arc cluster.
    resource:
      type: Microsoft.IoTOperations/instances
      apiVersion: "2026-07-01"
    derive:
      subscription: subscription
      resourceGroup: resourceGroup
      location: location
      name: aioInstanceName
  - name: siteName
    type: string
    description: Optional Site name. The default is the associated cluster's name in lowercase.
    sitePath: name
    format: dnsLabel
    maxLength: 59
  - name: subscription
    type: string
    description: Subscription derived from the existing instance.
    sitePath: subscription
  - name: resourceGroup
    type: string
    description: Resource group derived from the existing instance.
    sitePath: resourceGroup
  - name: location
    type: string
    description: Region read from the existing instance.
    sitePath: location
  - name: aioInstanceName
    type: string
    description: Actual instance name derived from its resource ID.
    sitePath: parameters.aioInstanceName
  - name: clusterName
    type: string
    description: Cluster name derived through the instance's custom location.
    sitePath: parameters.clusterName
  - name: customLocation
    type: azureResourceId
    description: Custom location referenced by the existing instance.
    fromResource: {input: instance, field: extendedLocation}
    resource:
      type: Microsoft.ExtendedLocation/customLocations
      apiVersion: "2021-08-31-preview"
  - name: cluster
    type: azureResourceId
    description: Existing Arc cluster referenced by the custom location.
    fromResource: {input: customLocation, field: customLocations.hostResourceId}
    resource:
      type: Microsoft.Kubernetes/connectedClusters
      apiVersion: "2024-07-15-preview"
    derive:
      name: clusterName
  - name: aioRelease
    type: string
    description: Target AIO release, such as 2609. Choose a supported transition from the instance's current release.
    sitePath: properties.aioRelease
  - name: enableCertManager
    type: boolean
    description: Include the existing cert-manager Arc extension in this upgrade? True updates its version and settings. False leaves it to its separate owner, with no read or write.
    sitePath: properties.deployOptions.enableCertManager
  - name: aioExtensionSettings
    type: stringMap
    required: false
    description: AIO Arc extension configuration settings. Each key replaces the existing or release value.
    sitePath: parameters.aioConfigurationOverrides
  - name: secretStoreExtensionSettings
    type: stringMap
    required: false
    description: Secret store Arc extension configuration settings. Each key replaces the existing or release value.
    sitePath: parameters.secretStoreConfigurationOverrides
  - name: certManagerExtensionSettings
    type: stringMap
    required: false
    when: {input: enableCertManager, equals: true}
    description: cert-manager Arc extension configuration settings. Each key replaces the existing or release value.
    sitePath: parameters.certManagerConfigurationOverrides
  - name: environment
    type: string
    required: false
    format: nonEmpty
    description: Optional environment label for the Site.
    sitePath: labels.environment
  - name: country
    type: string
    required: false
    format: nonEmpty
    description: Optional country label for the Site.
    sitePath: labels.country
