apiVersion: siteops/v1alpha1
kind: DeploymentEntry
role: standalone
category: core
tags: [aio, upgrade]
documentation: [README.md]
outcome: Upgrade the AIO extensions and the resources that the selected AIO release explicitly requires.
prerequisites:
  - An existing AIO installation and a supported upgrade transition.
  - A configured Site with the intended AIO release and permission for the selected updates.
effects:
  - Updates extensions and the resources the AIO release requires while preserving supported existing configuration.
  - Does not perform general migrations of instance child resources.
  - Avoid resource set deployments between changing the AIO release pin and completing the upgrade.
removal:
  - There is no general rollback. Review partial outcomes and recovery guidance before retrying.
coverage: Operational synopsis. Follow the guide for AIO release selection, supported paths and workload observations after the upgrade.
