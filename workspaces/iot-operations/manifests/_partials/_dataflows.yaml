apiVersion: siteops/v1
kind: Manifest
name: dataflow-steps
description: |
  Deploys the effective dataflow endpoint, profile, and dataflow composition
  for an existing AIO instance. Expects an upstream `resolve-aio` step. One
  API-versioned deployment creates endpoints and profiles before the dataflows
  that reference them.

  Internal partial. `aio-resources.yaml` and direct samples include it. See
  docs/dataflows.md for the resource shapes and docs/resource-catalog.md for
  set selection.

parameterCompositions:
  - contracts/aio-catalog.yaml

steps:
  - name: dataflow-resources
    template: templates/aio/dataflows/main.bicep
    scope: resourceGroup
    parameters:
      - parameters/inputs/catalog.yaml
