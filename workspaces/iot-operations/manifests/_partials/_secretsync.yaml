apiVersion: siteops/v1
kind: Manifest
name: secretsync-step
description: |
  Secret Sync, backed by workload identity, for an existing AIO instance.

  Internal partial (filename prefixed `_`). Not deployed directly. Composed
  by `secretsync` (the standalone manifest for existing instances) and by
  `aio-install` (gated by `enableSecretSync`).

  check-secretsync-prerequisites reads the cluster's OIDC issuer and workload
  identity, and stops before any Secret Sync write when one is missing.

steps:
  - name: check-secretsync-prerequisites
    template: templates/secretsync/check-prerequisites.bicep
    scope: resourceGroup
    parameters:
      - parameters/inputs/check-secretsync-prerequisites.yaml

  - name: secretsync
    template: templates/secretsync/enable-secretsync.bicep
    scope: resourceGroup
    parameters:
      - parameters/inputs/secretsync.yaml
