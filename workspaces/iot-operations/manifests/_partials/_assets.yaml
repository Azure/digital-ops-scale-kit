apiVersion: siteops/v1
kind: Manifest
name: asset-steps
description: |
  Deploys the effective Device Registry device and asset composition for an
  existing AIO instance. Expects an upstream `resolve-aio` step. One
  API-versioned deployment creates devices before the assets that bind to them.

  Internal partial. `aio-resources.yaml` and direct samples include it. See
  docs/assets.md for the resource shapes and docs/resource-catalog.md for set
  selection.

parameterCompositions:
  - contracts/aio-catalog.yaml

steps:
  - name: asset-resources
    template: templates/aio/assets/main.bicep
    scope: resourceGroup
    parameters:
      - parameters/inputs/catalog.yaml
