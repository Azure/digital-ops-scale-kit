apiVersion: siteops/v1
kind: Manifest
name: secretsync
description: |
  Enable Secret Sync on an existing Azure IoT Operations instance. Creates a
  managed identity, a Key Vault, role assignments and the default Secret
  Provider Class, or uses an existing Key Vault that you supply.

  This standalone manifest enables Secret Sync on instances that already run.
  For new deployments, use the aio-install manifest with
  deployOptions.enableSecretSync = true.

  Prerequisites:
    - AIO instance must be deployed and running
    - Connected cluster must have OIDC issuer and workload identity enabled

parallel: 3

# Default selector. Override at the CLI with `-l <key>=<value>`.
selector: "environment=dev"

parameters:
  - parameters/common/common.yaml
  - "parameters/aio-releases/{{ site.properties.aioRelease }}.yaml"

steps:
  - include: ../_partials/_resolve-aio.yaml
  - include: ../_partials/_secretsync.yaml
