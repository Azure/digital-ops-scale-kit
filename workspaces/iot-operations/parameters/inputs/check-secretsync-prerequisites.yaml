# Inputs to the check-secretsync-prerequisites step, pulled from the upstream resolve-aio step.
# See docs/parameter-resolution.md for the inputs/outputs convention.
# Consumed by: check-secretsync-prerequisites (in manifests/_partials/_secretsync.yaml)

# The cluster whose OIDC issuer and workload identity flags the guard reads,
# and the issuer that enablement federates with.
connectedClusterName: "{{ steps.resolve-aio.outputs.connectedClusterName }}"
oidcIssuerUrl: "{{ steps.resolve-aio.outputs.oidcIssuerUrl }}"
