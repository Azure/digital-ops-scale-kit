# Inputs to the resolve-extensions step of the aio-upgrade manifest.
# See docs/parameter-resolution.md for the inputs/outputs convention.
# Consumed by: resolve-extensions (in manifests/aio-upgrade/manifest.yaml)

# Cluster identity for direct existing lookup + the resource ID needed to
# derive the AIO Arc extension name through the shared deriver that is the source of truth.
connectedClusterName: "{{ steps.resolve-aio.outputs.connectedClusterName }}"
connectedClusterResourceId: "{{ steps.resolve-aio.outputs.connectedClusterResourceId }}"

# cert-manager ownership flag from Site config. False skips cert-manager
# resolution so cert-manager installs managed elsewhere are never touched.
enableCertManager: "{{ site.properties.deployOptions.enableCertManager }}"
