# Parameter inputs for the aksee-bootstrap step.
# Consumed by `templates/host-bootstrap/aksee/template.bicep`.
#
# The `aksee` fields machineName and customLocationsOid are required.
# `clusterName` comes from the shared `site.parameters.clusterName` at the top
# level (the name the AIO steps also use), so the two cannot diverge.
# aksEdgeMsiUrl is optional and defaults to the latest K3s build via
# base-site. `targetLocation` is mapped to `site.location` so the cluster
# shares a region with the AIO resources, which also derive their region from
# `site.location`. The template otherwise defaults it to the resource
# group's location.
#
# Override for each Site in `sites/<site>.yaml`. See
# `templates/host-bootstrap/aksee/README.md`.

machineName:        "{{ site.parameters.aksee.machineName }}"
clusterName:        "{{ site.parameters.clusterName }}"
customLocationsOid: "{{ site.parameters.aksee.customLocationsOid }}"

# AKS EE MSI to install. Defaults (via base-site) to the latest K3s build.
# Override for each Site with a versioned MSI URL to pin a specific AKS EE release.
aksEdgeMsiUrl:      "{{ site.parameters.aksee.aksEdgeMsiUrl }}"

# Region of the cluster and custom location. Tracks site.location to match AIO resources.
targetLocation:     "{{ site.location }}"

# OIDC issuer + workload identity (Phase 3). Bool from base-site deployOptions
# (default false), same pattern as enableCertManager.
enableWorkloadIdentity: "{{ site.properties.deployOptions.enableWorkloadIdentity }}"

