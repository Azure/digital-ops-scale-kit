# Fan-in inputs shared by every catalog step, pulled from the resolve-aio upstream.
# One file serves all families. Auto-filtering routes each key to the templates that
# declare it, so a family template receives only the keys it accepts and a key added
# here for one family does not reach the others.
# Chaining files attach at step level, where they are scoped to their consumers and
# cannot be overridden by a site. Definitions live in parameters/<area>/<set>.yaml
# and attach at manifest level.
# See docs/resource-catalog.md for the authoring contract.
# Consumed by: the family step in manifests/_<family>.yaml
#
# Each value is read back from the instance rather than derived from the site
# name. parameters/common/common.yaml supplies both names by convention, and a
# family reading that default instead would write to a resource the instance is
# not bound to on any site that departs from the convention.

customLocationName: "{{ steps.resolve-aio.outputs.customLocationName }}"
adrNamespaceName: "{{ steps.resolve-aio.outputs.adrNamespaceName }}"
