# Beginner resource set sample Site

apiVersion: siteops/v1
kind: Site
name: catalog-basic
inherits: base-site.yaml

subscription: "00000000-0000-0000-0000-000000000000"
resourceGroup: rg-iot-catalog-basic
location: westus2

# Sample labels only, so fleet selectors such as country=US skip this Site.
# managedBy overrides the siteops value inherited from base-site.yaml.
labels:
  environment: sample
  managedBy: siteops-sample
  sample: resource-set-basic

properties:
  resourceSets:
    dataflows:
      - basic-routing

parameters:
  clusterName: catalog-basic-arc
