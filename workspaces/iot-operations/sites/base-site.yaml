# Base site template for IoT Operations deployments
# All sites inherit from this to get consistent defaults

apiVersion: siteops/v1
kind: SiteTemplate
name: base-site

labels:
  managedBy: siteops

properties:
  # AIO version (release moniker) - determines extension versions
  # See: parameters/aio-releases/ for available releases
  aioRelease: "2608"

  # Deployment options - control which components are deployed
  deployOptions:
    enableGlobalSite: false      # Subscription-scoped edge site
    enableEdgeSite: false        # RG-scoped edge site
    enableSecretSync: false
    enableWorkloadIdentity: false # OIDC issuer + WLIF on the AKS EE host bootstrap (paired with enableSecretSync)
    enableCertManager: true      # cert-manager Arc extension on the cluster
    allowKubernetesMinorUpgrade: false # Minor Kubernetes version hops in the aksee-upgrade worker

parameters:
  # AIO broker configuration defaults
  brokerConfig:
    memoryProfile: Medium
  # Default dataflow instance count
  defaultDataflowInstanceCount: 1
  # AKS Edge Essentials host bootstrap defaults
  aksee:
    # MSI the bootstrap installs. Default is the latest K3s build. Override
    # per-site with a versioned MSI URL (Microsoft Download Center) to pin a
    # specific AKS Edge Essentials release.
    aksEdgeMsiUrl: "https://aka.ms/aks-edge/k3s-msi"
    # Optional target Kubernetes minor version for the aksee-upgrade worker
    # (e.g. "1.33"). Empty means no explicit target.
    targetKubernetesVersion: ""
