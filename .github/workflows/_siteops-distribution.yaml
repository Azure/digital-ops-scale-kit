# Reusable workflow that builds, attests, and qualifies the Site Ops release wheel,
# installation bundle, and both platform bootstrap scripts. The caller
# repository, ref, and commit identify the source being built. This workflow path
# and its commit identify the trusted builder.
#
# The build job executes repository source without signing capability. A separate
# attestation job receives the staged bytes, executes no repository source, and
# signs each published asset independently. Qualification verifies the same
# attested bytes with the runner's GitHub CLI before anything is extracted or
# installed, then exercises both platform scripts and both native uv paths.
#
# Callers reference this workflow locally as
# `./.github/workflows/_siteops-distribution.yaml`, which GitHub binds to the
# caller's own event commit. The certificate identity that qualification and
# promotion expect is therefore
# `https://github.com/<repository>/.github/workflows/_siteops-distribution.yaml@<source ref>`
# with a signer digest equal to the caller's commit. One real signed qualification
# run must confirm the emitted subject alternative name before any public release.
# Treat a mismatch as a policy question rather than a reason to relax the exact
# identity to a pattern.

name: _Site Ops Distribution

on:
  workflow_call:
    inputs:
      release-pool:
        description: "Dedicated 1ES pool admitted by the caller's release runner configuration."
        required: true
        type: string
      expected-source-sha:
        description: "Full 40 character commit the caller expects to build. Asserted against the event commit, never used to select what is checked out."
        required: true
        type: string
      version-mode:
        description: "build adds an identified build suffix. source preserves the declared package version."
        required: false
        type: string
        default: build
      report-summary:
        description: "Write the aggregate distribution report to the workflow summary."
        required: false
        type: boolean
        default: true
    outputs:
      package-version:
        description: "Exact package version in the qualified bundle."
        value: ${{ jobs.build.outputs.package-version }}
      build-number:
        description: "Build run ID recorded in the bundle."
        value: ${{ jobs.build.outputs.build-number }}
      build-attempt:
        description: "Build attempt recorded in the bundle."
        value: ${{ jobs.build.outputs.build-attempt }}
      archive-name:
        description: "File name of the installation archive inside every artifact."
        value: ${{ jobs.build.outputs.archive-name }}
      archive-sha256:
        description: "SHA-256 of the attested installation archive."
        value: ${{ jobs.build.outputs.archive-sha256 }}
      wheel-name:
        description: "File name of the standalone Site Ops wheel published beside the archive."
        value: ${{ jobs.build.outputs.wheel-name }}
      wheel-sha256:
        description: "SHA-256 of the attested standalone Site Ops wheel."
        value: ${{ jobs.build.outputs.wheel-sha256 }}
      staging-artifact-id:
        description: "Artifact ID holding the attested installation assets and their detached proofs."
        value: ${{ jobs.attest.outputs.staging-artifact-id }}
      staging-artifact-name:
        description: "Artifact name holding the attested installation assets and their detached proofs."
        value: ${{ jobs.attest.outputs.staging-artifact-name }}
      staging-artifact-url:
        description: "Download page for the attested installation assets and their detached proofs."
        value: ${{ jobs.attest.outputs.staging-artifact-url }}
      qualification-matrix:
        description: "Compact JSON results for each supported Python, Linux, and Windows qualification cell."
        value: ${{ jobs.summary.outputs.qualification-matrix }}

env:
  ARCHIVE_NAME: siteops-install.zip
  BOOTSTRAP_PS1: siteops-bootstrap.ps1
  BOOTSTRAP_SH: siteops-bootstrap.sh
  ATTESTATION_SUFFIX: .attestation.jsonl
  OIDC_ISSUER: https://token.actions.githubusercontent.com
  PREDICATE_TYPE: https://slsa.dev/provenance/v1
  # Package downloads use the configured feed with no public fallback.
  PACKAGE_INDEX_URL: https://packagefeedproxy.microsoft.io/pypi/simple/
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"
  # CI results and progress use publication-safe output.
  SITEOPS_REDACT_OUTPUT: "1"
  VERSION_MODE: ${{ inputs.version-mode }}

jobs:
  build:
    name: Build bundle
    if: >-
      inputs.release-pool != '' && inputs.release-pool == vars.SITEOPS_RELEASE_POOL &&
      inputs.expected-source-sha == github.sha &&
      vars.SITEOPS_RELEASE_PROVENANCE_READY == 'true' && vars.SITEOPS_RELEASE_RUNNER_MODE == 'scaleset' &&
      (github.workflow_ref == format('{0}/.github/workflows/ci.yaml@{1}', github.repository, github.ref) ||
       github.workflow_ref == format('{0}/.github/workflows/release.yaml@{1}', github.repository, github.ref)) &&
      (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on:
      - ${{ inputs.release-pool }}

    # The build job executes repository source. It holds no OIDC, attestation, or
    # release capability.
    permissions:
      contents: read

    outputs:
      package-version: ${{ steps.build.outputs.package-version }}
      build-number: ${{ steps.build.outputs.build-number }}
      build-attempt: ${{ steps.build.outputs.build-attempt }}
      archive-name: ${{ steps.build.outputs.archive-name }}
      archive-sha256: ${{ steps.build.outputs.archive-sha256 }}
      wheel-name: ${{ steps.build.outputs.wheel-name }}
      wheel-sha256: ${{ steps.build.outputs.wheel-sha256 }}
      bootstrap-ps1-sha256: ${{ steps.build.outputs.bootstrap-ps1-sha256 }}
      bootstrap-sh-sha256: ${{ steps.build.outputs.bootstrap-sh-sha256 }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}

    env:
      EXPECTED_SOURCE_SHA: ${{ inputs.expected-source-sha }}
      SOURCE_SHA: ${{ github.sha }}
      SOURCE_REF: ${{ github.ref }}
      SOURCE_REPOSITORY: ${{ github.repository }}
      BUILD_NUMBER: ${{ github.run_id }}
      BUILD_ATTEMPT: ${{ github.run_attempt }}

    steps:
      - name: Require the admitted runner class
        shell: python
        env:
          RUNNER_CLASS: ${{ runner.environment }}
        run: |
          import os
          import sys
          if sys.platform != "linux" or os.environ["RUNNER_CLASS"] != "self-hosted":
              raise SystemExit("::error::Release artifacts require the admitted Linux self-hosted runner.")

      - name: Assert the expected source commit
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::expected-source-sha must be a full 40 character lowercase commit SHA."
            exit 1
          fi
          if [[ "$EXPECTED_SOURCE_SHA" != "$SOURCE_SHA" ]]; then
            echo "::error::The dispatched ref resolves to a different commit than expected-source-sha."
            exit 1
          fi
          if [[ "$VERSION_MODE" != "build" && "$VERSION_MODE" != "source" ]]; then
            echo "::error::version-mode must be build or source."
            exit 1
          fi
          echo "Building the event commit asserted by the caller."

      - name: Checkout the event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          persist-credentials: false
          clean: true
          fetch-depth: 1

      - name: Confirm the checked out tree
        shell: bash
        run: |
          set -euo pipefail
          head="$(git rev-parse HEAD)"
          if [[ "$head" != "$SOURCE_SHA" ]]; then
            echo "::error::The checked out tree is not the event commit."
            exit 1
          fi
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "::error::The checked out tree carries uncommitted changes."
            exit 1
          fi

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install the pinned build requirements
        shell: bash
        env:
          PIP_INDEX_URL: ${{ env.PACKAGE_INDEX_URL }}
          PIP_NO_INPUT: "1"
          PIP_KEYRING_PROVIDER: disabled
          PIP_CONFIG_FILE: /dev/null
          PIP_EXTRA_INDEX_URL: ""
        run: |
          set -euo pipefail
          umask 077
          if ! python -m pip install \
            --require-hashes \
            --only-binary=:all: \
            --no-cache-dir \
            --requirement scripts/siteops-build-requirements.txt \
            > "$RUNNER_TEMP/siteops-build-tooling.log" 2>&1; then
            echo "::error::Pinned build tooling could not be installed from the configured feed."
            exit 1
          fi

      - name: Build the installation bundle
        id: build
        shell: bash
        env:
          PIP_INDEX_URL: ${{ env.PACKAGE_INDEX_URL }}
          PIP_NO_INPUT: "1"
          PIP_KEYRING_PROVIDER: disabled
          PIP_CONFIG_FILE: /dev/null
          PIP_EXTRA_INDEX_URL: ""
        run: |
          set -euo pipefail
          umask 077
          staging="$RUNNER_TEMP/siteops-build"
          rm -rf "$staging"
          mkdir -p "$staging"
          archive="$staging/$ARCHIVE_NAME"

          python scripts/build-siteops-bundle.py \
            --repository "$SOURCE_REPOSITORY" \
            --source-ref "$SOURCE_REF" \
            --expected-source-sha "$SOURCE_SHA" \
            --build-number "$BUILD_NUMBER" \
            --build-attempt "$BUILD_ATTEMPT" \
            --version-mode "$VERSION_MODE" \
            --output "$archive" \
            --download-dependencies

          for script in "$BOOTSTRAP_PS1" "$BOOTSTRAP_SH"; do
            git show "$SOURCE_SHA:scripts/bootstrap/$script" > "$staging/$script"
            if [[ ! -s "$staging/$script" ]] || [[ $(wc -c < "$staging/$script") -gt 131072 ]]; then
              echo "::error::The selected bootstrap script is missing or exceeds its byte limit."
              exit 1
            fi
          done

          shopt -s dotglob nullglob
          produced=("$staging"/*)
          wheel=""
          for path in "${produced[@]}"; do
            if [[ "$path" == "$staging"/siteops-*-py3-none-any.whl ]]; then
              wheel="$path"
            fi
          done
          wheel_name="${wheel##*/}"
          if [[ ${#produced[@]} -ne 4 || ! -f "$archive" || ! -f "$wheel" ]]; then
            echo "::error::The build produced content other than its declared installation assets."
            exit 1
          fi
          if [[ ! "$wheel_name" =~ ^siteops-[A-Za-z0-9._+!-]+-py3-none-any\.whl$ ]]; then
            echo "::error::The standalone wheel does not carry a supported Site Ops wheel name."
            exit 1
          fi

          # The wheel and bundle must carry one identical application build.
          python - "$archive" "$wheel" <<'PY'
          import json
          import sys
          import zipfile
          from pathlib import Path

          archive, wheel = Path(sys.argv[1]), Path(sys.argv[2])
          member = "wheels/" + wheel.name
          with zipfile.ZipFile(archive) as bundle:
              document = json.loads(bundle.read("bundle.json"))
              if member not in bundle.namelist():
                  print("::error::The archive does not contain the standalone wheel.")
                  raise SystemExit(1)
              packaged = bundle.read(member)
          if document["package"]["wheel"] != member:
              print("::error::The archive manifest names a different application wheel.")
              raise SystemExit(1)
          if packaged != wheel.read_bytes():
              print("::error::The standalone wheel is not the archive member byte for byte.")
              raise SystemExit(1)
          PY

          digest="$(sha256sum "$archive" | cut -d ' ' -f 1)"
          wheel_digest="$(sha256sum "$wheel" | cut -d ' ' -f 1)"
          version="$(python -c 'import json,sys,zipfile; print(json.loads(zipfile.ZipFile(sys.argv[1]).read("bundle.json"))["package"]["version"])' "$archive")"
          {
            echo "package-version=$version"
            echo "build-number=$BUILD_NUMBER"
            echo "build-attempt=$BUILD_ATTEMPT"
            echo "archive-name=$ARCHIVE_NAME"
            echo "archive-sha256=$digest"
            echo "wheel-name=$wheel_name"
            echo "wheel-sha256=$wheel_digest"
            echo "bootstrap-ps1-sha256=$(sha256sum "$staging/$BOOTSTRAP_PS1" | cut -d ' ' -f 1)"
            echo "bootstrap-sh-sha256=$(sha256sum "$staging/$BOOTSTRAP_SH" | cut -d ' ' -f 1)"
            echo "staging-path=$staging"
          } >> "$GITHUB_OUTPUT"
          echo "Built $ARCHIVE_NAME with digest $digest."
          echo "Built $wheel_name with digest $wheel_digest."

      - name: Upload the build artifacts
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: siteops-install-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.build.outputs.staging-path }}
          if-no-files-found: error
          overwrite: false
          include-hidden-files: false
          archive: true
          compression-level: 0
          retention-days: 7

  attest:
    name: Attest bundle
    needs: build
    runs-on:
      - ${{ inputs.release-pool }}

    # The signing job downloads staged bytes. It never checks out or executes
    # repository source.
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write

    outputs:
      staging-artifact-id: ${{ steps.stage.outputs.artifact-id }}
      staging-artifact-name: ${{ steps.names.outputs.staging-artifact-name }}
      staging-artifact-url: ${{ steps.stage.outputs.artifact-url }}

    env:
      EXPECTED_ARCHIVE_SHA256: ${{ needs.build.outputs.archive-sha256 }}
      EXPECTED_WHEEL_SHA256: ${{ needs.build.outputs.wheel-sha256 }}
      EXPECTED_BOOTSTRAP_PS1_SHA256: ${{ needs.build.outputs.bootstrap-ps1-sha256 }}
      EXPECTED_BOOTSTRAP_SH_SHA256: ${{ needs.build.outputs.bootstrap-sh-sha256 }}
      WHEEL_NAME: ${{ needs.build.outputs.wheel-name }}

    steps:
      - name: Require the admitted runner class
        shell: python
        env:
          RUNNER_CLASS: ${{ runner.environment }}
        run: |
          import os
          import sys
          if sys.platform != "linux" or os.environ["RUNNER_CLASS"] != "self-hosted":
              raise SystemExit("::error::Release artifacts require the admitted Linux self-hosted runner.")

      - name: Resolve the staging artifact name
        id: names
        shell: bash
        run: |
          set -euo pipefail
          echo "staging-artifact-name=siteops-install-staging-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Download the build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/siteops-subject
          merge-multiple: true
          digest-mismatch: error

      - name: Confirm the staged payload
        shell: bash
        run: |
          set -euo pipefail
          subject="$RUNNER_TEMP/siteops-subject"
          archive="$subject/$ARCHIVE_NAME"
          wheel="$subject/$WHEEL_NAME"
          shopt -s dotglob nullglob
          entries=("$subject"/*)
          if [[ ${#entries[@]} -ne 4 || ! -f "$archive" || ! -f "$wheel" || ! -f "$subject/$BOOTSTRAP_PS1" || ! -f "$subject/$BOOTSTRAP_SH" ]]; then
            echo "::error::The downloaded artifact holds content other than the declared installation assets."
            exit 1
          fi
          for subject_pair in "$archive|$EXPECTED_ARCHIVE_SHA256" "$wheel|$EXPECTED_WHEEL_SHA256" \
            "$subject/$BOOTSTRAP_PS1|$EXPECTED_BOOTSTRAP_PS1_SHA256" \
            "$subject/$BOOTSTRAP_SH|$EXPECTED_BOOTSTRAP_SH_SHA256"; do
            path="${subject_pair%|*}"
            expected="${subject_pair##*|}"
            digest="$(sha256sum "$path" | cut -d ' ' -f 1)"
            if [[ "$digest" != "$expected" ]]; then
              echo "::error::A downloaded asset does not match the digest recorded by the build job."
              exit 1
            fi
          done

      - name: Attest archive provenance
        id: attest-archive
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/siteops-subject/siteops-install.zip
          show-summary: false

      - name: Attest wheel provenance
        id: attest-wheel
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/siteops-subject/${{ needs.build.outputs.wheel-name }}
          show-summary: false

      - name: Attest PowerShell bootstrap provenance
        id: attest-ps1
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/siteops-subject/siteops-bootstrap.ps1
          show-summary: false

      - name: Attest Bash bootstrap provenance
        id: attest-sh
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/siteops-subject/siteops-bootstrap.sh
          show-summary: false

      - name: Stage the attested bytes
        shell: bash
        env:
          ARCHIVE_BUNDLE_PATH: ${{ steps.attest-archive.outputs.bundle-path }}
          WHEEL_BUNDLE_PATH: ${{ steps.attest-wheel.outputs.bundle-path }}
          PS1_BUNDLE_PATH: ${{ steps.attest-ps1.outputs.bundle-path }}
          SH_BUNDLE_PATH: ${{ steps.attest-sh.outputs.bundle-path }}
        run: |
          set -euo pipefail
          umask 077
          subject="$RUNNER_TEMP/siteops-subject"
          staging="$RUNNER_TEMP/siteops-staging"
          rm -rf "$staging"
          mkdir -p "$staging"
          cp "$subject/$ARCHIVE_NAME" "$staging/$ARCHIVE_NAME"
          cp "$ARCHIVE_BUNDLE_PATH" "$staging/${ARCHIVE_NAME}${ATTESTATION_SUFFIX}"
          cp "$subject/$WHEEL_NAME" "$staging/$WHEEL_NAME"
          cp "$WHEEL_BUNDLE_PATH" "$staging/${WHEEL_NAME}${ATTESTATION_SUFFIX}"
          cp "$subject/$BOOTSTRAP_PS1" "$staging/$BOOTSTRAP_PS1"
          cp "$PS1_BUNDLE_PATH" "$staging/${BOOTSTRAP_PS1}${ATTESTATION_SUFFIX}"
          cp "$subject/$BOOTSTRAP_SH" "$staging/$BOOTSTRAP_SH"
          cp "$SH_BUNDLE_PATH" "$staging/${BOOTSTRAP_SH}${ATTESTATION_SUFFIX}"

          for staged_pair in "$ARCHIVE_NAME|$EXPECTED_ARCHIVE_SHA256" "$WHEEL_NAME|$EXPECTED_WHEEL_SHA256" \
            "$BOOTSTRAP_PS1|$EXPECTED_BOOTSTRAP_PS1_SHA256" "$BOOTSTRAP_SH|$EXPECTED_BOOTSTRAP_SH_SHA256"; do
            name="${staged_pair%|*}"
            expected="${staged_pair##*|}"
            digest="$(sha256sum "$staging/$name" | cut -d ' ' -f 1)"
            if [[ "$digest" != "$expected" ]]; then
              echo "::error::Staging altered an attested asset."
              exit 1
            fi
            if [[ ! -s "$staging/${name}${ATTESTATION_SUFFIX}" ]]; then
              echo "::error::An attestation bundle is empty."
              exit 1
            fi
          done

          shopt -s dotglob nullglob
          staged=("$staging"/*)
          if [[ ${#staged[@]} -ne 8 ]]; then
            echo "::error::Staging holds content other than the four assets and their detached proofs."
            exit 1
          fi

      - name: Upload the attested assets
        id: stage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.names.outputs.staging-artifact-name }}
          path: ${{ runner.temp }}/siteops-staging
          if-no-files-found: error
          overwrite: false
          include-hidden-files: false
          archive: true
          compression-level: 0
          retention-days: 30

  qualify:
    name: Qualify bundle (${{ matrix.os }}, Python ${{ matrix.python }})
    needs: [build, attest]
    runs-on: ${{ matrix.os }}

    # Qualification consumes the attested bytes with the runner's own GitHub CLI.
    # It never signs and never publishes.
    permissions:
      contents: read
      actions: read

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    defaults:
      run:
        shell: bash

    env:
      SOURCE_REPOSITORY: ${{ github.repository }}
      SOURCE_SHA: ${{ github.sha }}
      SOURCE_REF: ${{ github.ref }}
      SIGNER_DIGEST: ${{ github.sha }}
      SIGNER_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/_siteops-distribution.yaml@${{ github.ref }}
      BUILDER_IDENTITY: https://github.com/${{ github.workflow_ref }}
      BUILD_NUMBER: ${{ github.run_id }}
      BUILD_ATTEMPT: ${{ github.run_attempt }}
      WHEEL_NAME: ${{ needs.build.outputs.wheel-name }}
      PACKAGE_VERSION: ${{ needs.build.outputs.package-version }}
      MATRIX_PYTHON: ${{ matrix.python }}

    steps:
      - name: Confirm the GitHub CLI verification capabilities
        run: |
          set -euo pipefail
          if ! command -v gh > /dev/null 2>&1; then
            echo "::error::The runner does not provide the GitHub CLI required for verification."
            exit 1
          fi
          gh --version
          help_text="$(gh attestation verify --help 2>&1)"
          for flag in --bundle --repo --cert-identity --signer-digest --source-digest \
            --source-ref --cert-oidc-issuer --predicate-type --format; do
            if ! printf '%s' "$help_text" | grep -q -- "$flag"; then
              echo "::error::The runner GitHub CLI does not support $flag, which this policy requires."
              exit 1
            fi
          done

      - name: Setup Python
        id: python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Download the attested assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.attest.outputs.staging-artifact-id }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/siteops-download
          merge-multiple: true
          digest-mismatch: error

      - name: Verify installation assets before use
        run: |
          set -euo pipefail
          # The Windows runner reports a backslash temporary path.
          temp="${RUNNER_TEMP//\\//}"
          download="$temp/siteops-download"
          archive="$download/$ARCHIVE_NAME"
          wheel="$download/$WHEEL_NAME"
          for asset in "$archive" "$wheel" "$download/$BOOTSTRAP_PS1" "$download/$BOOTSTRAP_SH"; do
            if [[ ! -f "$asset" || ! -f "${asset}${ATTESTATION_SUFFIX}" ]]; then
              echo "::error::The staged artifact lacks an installation asset or its detached proof."
              exit 1
            fi
          done

          for asset in "$archive" "$wheel" "$download/$BOOTSTRAP_PS1" "$download/$BOOTSTRAP_SH"; do
            if ! timeout --kill-after=5 120 gh attestation verify "$asset" \
              --bundle "${asset}${ATTESTATION_SUFFIX}" \
              --repo "$SOURCE_REPOSITORY" \
              --cert-identity "$SIGNER_IDENTITY" \
              --signer-digest "$SIGNER_DIGEST" \
              --source-digest "$SOURCE_SHA" \
              --source-ref "$SOURCE_REF" \
              --cert-oidc-issuer "$OIDC_ISSUER" \
              --predicate-type "$PREDICATE_TYPE" \
              --hostname github.com --digest-alg sha256 --format json 2>/dev/null \
              | head -c 8388609 > "$temp/siteops-verification.json"; then
              echo "::error::An installation asset did not pass signature verification."
              exit 1
            fi
            python -c '
          import json, os, sys
          from pathlib import Path
          raw = Path(sys.argv[1]).read_bytes()
          if len(raw) > 8388608:
              raise SystemExit("::error::Verification evidence exceeds its byte limit.")
          expected = {
              "subjectAlternativeName": os.environ["SIGNER_IDENTITY"],
              "issuer": os.environ["OIDC_ISSUER"],
              "sourceRepositoryURI": "https://github.com/" + os.environ["SOURCE_REPOSITORY"],
              "sourceRepositoryDigest": os.environ["SOURCE_SHA"],
              "sourceRepositoryRef": os.environ["SOURCE_REF"],
              "buildSignerDigest": os.environ["SIGNER_DIGEST"],
              "buildConfigURI": os.environ["BUILDER_IDENTITY"],
              "buildConfigDigest": os.environ["SOURCE_SHA"], "runnerEnvironment": "self-hosted",
          }
          try:
              results = json.loads(raw.decode("utf-8"))
              if not isinstance(results, list) or not 1 <= len(results) <= 128:
                  raise ValueError()
              for result in results:
                  verified = result["verificationResult"]
                  certificate = verified["signature"]["certificate"]
                  if (
                      verified["mediaType"] != "application/vnd.dev.sigstore.verificationresult+json;version=0.1"
                      or any(certificate.get(key) != value for key, value in expected.items())
                  ):
                      raise ValueError()
          except (ValueError, KeyError, TypeError, AttributeError, RecursionError):
              raise SystemExit("::error::The verified installation certificate does not match release policy.") from None
          ' "$temp/siteops-verification.json"
          done

          echo "The attested installation assets satisfy the exact source and signer policy."

      - name: Extract the verified bundle
        env:
          PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          set -euo pipefail
          umask 077
          temp="${RUNNER_TEMP//\\//}"
          archive="$temp/siteops-download/$ARCHIVE_NAME"
          extract="$temp/siteops-verified"
          if [[ -e "$extract" ]]; then
            echo "::error::The extraction directory must be fresh."
            exit 1
          fi
          mkdir "$extract"
          shopt -s dotglob nullglob
          existing=("$extract"/*)
          if [[ ${#existing[@]} -ne 0 ]]; then
            echo "::error::The extraction directory is not empty."
            exit 1
          fi
          "$PYTHON" -m zipfile -e "$archive" "$extract"

      - name: Confirm the bundle describes this build
        env:
          PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          set -euo pipefail
          temp="${RUNNER_TEMP//\\//}"
          "$PYTHON" -c '
          import json
          import os
          import sys

          with open(os.path.join(sys.argv[1], "bundle.json"), encoding="utf-8") as stream:
              document = json.load(stream)

          source = document.get("source", {})
          build = document.get("build", {})
          package = document.get("package", {})
          commit = os.environ["SOURCE_SHA"]
          number = int(os.environ["BUILD_NUMBER"])
          attempt = int(os.environ["BUILD_ATTEMPT"])
          base = package.get("baseVersion", "")
          mode = os.environ["VERSION_MODE"]
          expected = base if mode == "source" else base + "+build." + str(number) + "." + str(attempt) + ".g" + commit[:12]
          wheel = "wheels/" + os.environ["WHEEL_NAME"]

          failures = []
          if mode not in ("build", "source"):
              failures.append("version mode")
          if document.get("apiVersion") != "siteops.install/v1":
              failures.append("apiVersion")
          if document.get("kind") != "SiteOpsBundle":
              failures.append("kind")
          if source.get("repository") != os.environ["SOURCE_REPOSITORY"]:
              failures.append("source.repository")
          if source.get("commit") != commit:
              failures.append("source.commit")
          if source.get("ref") != os.environ["SOURCE_REF"]:
              failures.append("source.ref")
          if build.get("number") != number or build.get("attempt") != attempt:
              failures.append("build")
          if package.get("version") != expected or package.get("version") != os.environ["PACKAGE_VERSION"]:
              failures.append("package.version")
          if package.get("wheel") != wheel:
              failures.append("package.wheel")
          with open(os.path.join(sys.argv[1], *wheel.split("/")), "rb") as stream:
              packaged = stream.read()
          with open(sys.argv[2], "rb") as stream:
              standalone = stream.read()
          if packaged != standalone:
              failures.append("standalone wheel bytes")
          if not os.path.isfile(os.path.join(sys.argv[1], "pylock.toml")):
              failures.append("pylock.toml")
          if failures:
              print("::error::The verified assets describe a different build: " + ", ".join(failures))
              raise SystemExit(1)
          ' "$temp/siteops-verified" "$temp/siteops-download/$WHEEL_NAME"
          echo "The verified archive and standalone wheel carry one identical application build."

      - name: Install the external qualification tooling
        env:
          PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          set -euo pipefail
          temp="${RUNNER_TEMP//\\//}"
          unset PYTHONPATH PYTHONHOME
          umask 077
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            native_root="$(powershell.exe -NoProfile -NonInteractive -Command '
              $ErrorActionPreference = "Stop"
              function Reject([string]$code) {
                  throw "The qualification profile root was not admitted ($code)."
              }
              $profileHome = [Environment]::GetFolderPath("UserProfile")
              if ($profileHome -cnotmatch "^[A-Za-z]:\\" -or
                  [IO.Path]::GetFullPath($profileHome) -cne $profileHome -or
                  $env:GITHUB_RUN_ID -cnotmatch "^[0-9]{1,20}$" -or
                  $env:GITHUB_RUN_ATTEMPT -cnotmatch "^[0-9]{1,5}$") {
                  Reject "ROOT_PATH"
              }
              $root = Join-Path $profileHome (
                  "siteops-qualification-{0}-{1}" -f $env:GITHUB_RUN_ID, $env:GITHUB_RUN_ATTEMPT
              )
              if ($root.Length -gt 192 -or (Test-Path -LiteralPath $root)) {
                  Reject "ROOT_PATH"
              }
              $sid = [Security.Principal.WindowsIdentity]::GetCurrent().User.Value
              $trusted = @($sid, "S-1-5-18", "S-1-5-32-544", "S-1-3-4")
              $owners = $trusted + "S-1-5-80-956008885-3418522649-1831038044-1853292631-2271478464"
              $ancestors = [Collections.Generic.List[string]]::new()
              $current = $profileHome
              while ($current) {
                  $ancestors.Add($current)
                  $parent = Split-Path -Parent $current
                  if (-not $parent -or $parent -eq $current) { break }
                  $current = $parent
              }
              $ancestors.Reverse()
              foreach ($path in $ancestors) {
                  $node = Get-Item -LiteralPath $path -Force -ErrorAction Stop
                  if (-not $node.PSIsContainer -or
                      ($node.Attributes -band [IO.FileAttributes]::ReparsePoint)) {
                      Reject "ROOT_ANCESTOR_TYPE"
                  }
                  $acl = [IO.Directory]::GetAccessControl($path)
                  if ($acl.GetOwner([Security.Principal.SecurityIdentifier]).Value -notin $owners) {
                      Reject "ROOT_ANCESTOR_OWNER"
                  }
                  foreach ($rule in $acl.GetAccessRules(
                      $true, $true, [Security.Principal.SecurityIdentifier]
                  )) {
                      if ($rule.AccessControlType -eq "Allow" -and
                          $rule.IdentityReference.Value -notin $trusted -and
                          -not ($rule.PropagationFlags -band
                              [Security.AccessControl.PropagationFlags]::InheritOnly) -and
                          ([int]$rule.FileSystemRights -band 0x500D0140)) {
                          Reject "ROOT_ANCESTOR_ACL"
                      }
                  }
              }
              New-Item -ItemType Directory -Path $root -ErrorAction Stop | Out-Null
              $previousPreference = $ErrorActionPreference
              try {
                  $ErrorActionPreference = "Continue"
                  & icacls.exe $root /setowner "*$sid" *> $null
                  $ownedByUser = $LASTEXITCODE -eq 0
                  if ($ownedByUser) {
                      & icacls.exe $root /inheritance:r /grant:r "*${sid}:(OI)(CI)F" *> $null
                      $protected = $LASTEXITCODE -eq 0
                  }
              } finally {
                  $ErrorActionPreference = $previousPreference
              }
              if (-not $ownedByUser -or -not $protected) { Reject "ROOT_DATA_ACL" }
              $acl = [IO.Directory]::GetAccessControl($root)
              if ($acl.GetOwner([Security.Principal.SecurityIdentifier]).Value -cne $sid) {
                  Reject "ROOT_DATA_OWNER"
              }
              foreach ($rule in $acl.GetAccessRules(
                  $true, $true, [Security.Principal.SecurityIdentifier]
              )) {
                  if ($rule.AccessControlType -eq "Allow" -and
                      $rule.IdentityReference.Value -notin $trusted) {
                      Reject "ROOT_DATA_ACL"
                  }
              }
              [Console]::Out.WriteLine($root)
            ' 2> /dev/null)" ||
              { echo "::error::The qualification profile root could not be admitted."; exit 1; }
            native_root="${native_root%$'\r'}"
            if [[ -z "$native_root" || "$native_root" == *$'\r'* ||
                  "$native_root" == *$'\n'* || ${#native_root} -gt 192 ]]; then
              echo "::error::The qualification profile root is invalid."
              exit 1
            fi
            owned="${native_root//\\//}"
          else
            owned="$temp/siteops-qualification"
            if [[ -e "$owned" ]]; then
              echo "::error::The qualification state must be fresh."
              exit 1
            fi
            mkdir -m 700 "$owned"
            native_root="$owned"
          fi
          mkdir "$owned/logs" "$owned/home" "$owned/tooling" "$owned/python" \
            "$owned/cache" "$owned/verified-tools" "$owned/verified-bin" \
            "$owned/online-tools" "$owned/online-bin"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            mkdir "$owned/temp"
            export TEMP="$owned/temp" TMP="$owned/temp" TMPDIR="$owned/temp"
            export LOCALAPPDATA="$owned/home"
          fi
          for name in UV_INSECURE_HOST UV_PYTHON_DOWNLOADS_JSON_URL UV_PYTHON_INSTALL_MIRROR; do
            if [[ -n "${!name:-}" ]]; then
              echo "::error::The managed Python source is not admitted."
              exit 1
            fi
          done
          if [[ -n "${UV_INSECURE_NO_ZIP_VALIDATION:-}" &&
                "${UV_INSECURE_NO_ZIP_VALIDATION}" != "0" &&
                "${UV_INSECURE_NO_ZIP_VALIDATION}" != "false" ]]; then
            echo "::error::The managed Python source is not admitted."
            exit 1
          fi
          while IFS= read -r name; do
            case "$name" in UV_*|PIP_*|PYTHONPATH|PYTHONHOME) unset "$name" ;; esac
          done < <(compgen -e)
          export HOME="$owned/home" XDG_DATA_HOME="$owned/home" XDG_CONFIG_HOME="$owned/home"
          export UV_TOOL_DIR="$owned/verified-tools" UV_TOOL_BIN_DIR="$owned/verified-bin"
          export UV_PYTHON_INSTALL_DIR="$owned/python" UV_CACHE_DIR="$owned/cache"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            name=uv-windows.zip
            url=https://github.com/astral-sh/uv/releases/download/0.12.20/uv-x86_64-pc-windows-msvc.zip
            size=18039150
            digest=95f9bc30fbb3574d276e28ac4a6de932d25153645853d13da8c21eec3bc88d06
            uv="$owned/tooling/uv.exe"
          else
            name=uv-linux.tar.gz
            url=https://github.com/astral-sh/uv/releases/download/0.12.20/uv-x86_64-unknown-linux-gnu.tar.gz
            size=19827214
            digest=6590717592ace991ff83a63fef799e3ad9d33ecc8f96c5d6bdd732496e79337f
            uv="$owned/tooling/uv"
          fi
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            --tlsv1.2 --max-redirs 3 --max-time 180 --max-filesize "$size" \
            --output "$owned/$name" "$url" > "$owned/logs/uv-download.log" 2>&1 ||
            { echo "::error::The pinned native uv archive could not be acquired."; exit 1; }
          "$PYTHON" -I -S -B - "$owned/$name" "$uv" "$size" "$digest" "$RUNNER_OS" <<'PY'
          import hashlib
          import os
          import sys
          import tarfile
          import zipfile
          from pathlib import Path

          archive, output = map(Path, sys.argv[1:3])
          if (archive.stat().st_size != int(sys.argv[3])
                  or hashlib.sha256(archive.read_bytes()).hexdigest() != sys.argv[4]):
              raise SystemExit("::error::The native uv archive differs from the selected release.")
          if sys.argv[5] == "Windows":
              expected = {"uv.exe": 42547504, "uvx.exe": 348976, "uvw.exe": 348976}
              with zipfile.ZipFile(archive) as source:
                  members = source.infolist()
                  if len(members) != 3 or {m.filename: m.file_size for m in members} != expected:
                      raise SystemExit("::error::The native uv archive inventory is invalid.")
                  with source.open("uv.exe") as stream, output.open("xb") as target:
                      target.write(stream.read(42547505))
              size, digest = 42547504, "a0d2742d49564a32488753b02e76276e7b5ef1b1ea8cf30bcbf06ee28f60cd73"
          else:
              with tarfile.open(archive, "r:gz") as source:
                  member = source.getmember("uv-x86_64-unknown-linux-gnu/uv")
                  if not member.isfile() or member.size != 50437584:
                      raise SystemExit("::error::The native uv archive inventory is invalid.")
                  with source.extractfile(member) as stream, output.open("xb") as target:
                      target.write(stream.read(50437585))
              size, digest = 50437584, "b8299463da6fa7da3b94464444d252d0afca8ac6c96cb229f1baf4012f365246"
          if output.stat().st_size != size or hashlib.sha256(output.read_bytes()).hexdigest() != digest:
              raise SystemExit("::error::The native uv executable differs from the selected release.")
          output.chmod(0o700)
          PY
          if ! "$uv" python install "$MATRIX_PYTHON" --no-bin --no-registry \
            --no-config --no-progress --system-certs > "$owned/logs/python-install.log" 2>&1; then
            echo "::error::The matrix-managed Python could not be provisioned."
            exit 1
          fi
          app_python="$("$PYTHON" -I -S -B - "$owned" "$MATRIX_PYTHON" "$RUNNER_OS" <<'PY'
          import os
          import re
          import stat
          import subprocess
          import sys
          from pathlib import Path

          owned, minor, platform = Path(sys.argv[1]), sys.argv[2], sys.argv[3]
          root = owned / "python"
          if not re.fullmatch(r"3\.(10|11|12|13|14)", minor):
              raise SystemExit("::error::The qualification cell has an invalid Python version.")
          pattern = re.compile(
              r"cpython-" + re.escape(minor) + r"\.[0-9]+-"
              + ("windows-x86_64-none" if platform == "Windows" else "linux-x86_64-gnu")
          )
          candidates = [entry for entry in root.iterdir() if pattern.fullmatch(entry.name)]
          if len(candidates) != 1 or candidates[0].is_symlink():
              raise SystemExit("::error::The matrix-managed runtime inventory is ambiguous.")
          concrete = candidates[0]
          count = 0
          for directory, folders, files in os.walk(concrete, followlinks=False):
              for name in folders + files:
                  count += 1
                  path = Path(directory) / name
                  info = path.lstat()
                  if (count > 16384 or (platform == "Windows" and
                          info.st_file_attributes & stat.FILE_ATTRIBUTE_REPARSE_POINT)
                          or (platform != "Windows" and (
                              not stat.S_ISLNK(info.st_mode) and
                              (info.st_uid not in {0, os.getuid()} or info.st_mode & 0o022)
                              or stat.S_ISLNK(info.st_mode) and
                              not path.resolve(strict=True).is_relative_to(concrete)))):
                      raise SystemExit("::error::The matrix-managed runtime is not admitted.")
          executable = concrete / (
              "python.exe" if platform == "Windows" else f"bin/python{minor}"
          )
          if not executable.is_file() or executable.is_symlink():
              raise SystemExit("::error::The matrix-managed runtime is incomplete.")
          try:
              identity = subprocess.run(
                  [str(executable), "-I", "-S", "-B", "-c",
                   "import sys;print(sys.implementation.name, *sys.version_info[:3], "
                   "sys.maxsize > 2**32, sys._base_executable)"],
                  capture_output=True, text=True, timeout=20, check=False,
              )
          except (OSError, subprocess.TimeoutExpired):
              raise SystemExit("::error::The matrix-managed runtime could not be inspected.") from None
          patch = concrete.name.split("-")[1].split(".")[2]
          if identity.returncode or identity.stdout.strip() != (
              f"cpython {minor.replace('.', ' ')} {patch} True {executable}"
          ):
              raise SystemExit("::error::The matrix-managed runtime has another identity.")
          print(executable)
          PY
          )"
          {
            echo "SITEOPS_QUALIFICATION_ROOT=$native_root"
            echo "SITEOPS_UV=$uv"
            echo "APP_PYTHON=$app_python"
            echo "UV_TOOL_DIR=$UV_TOOL_DIR"
            echo "UV_TOOL_BIN_DIR=$UV_TOOL_BIN_DIR"
            echo "UV_PYTHON_INSTALL_DIR=$UV_PYTHON_INSTALL_DIR"
            echo "UV_CACHE_DIR=$UV_CACHE_DIR"
          } >> "$GITHUB_ENV"
          echo "Admitted pinned uv and managed Python $MATRIX_PYTHON for this qualification cell."

      - name: Install with the signed Bash bootstrap
        if: matrix.os == 'ubuntu-24.04'
        run: |
          set -euo pipefail
          umask 077
          unset PYTHONPATH PYTHONHOME GH_TOKEN GITHUB_TOKEN GH_ENTERPRISE_TOKEN GITHUB_ENTERPRISE_TOKEN
          temp="${RUNNER_TEMP//\\//}"
          owned="${SITEOPS_QUALIFICATION_ROOT//\\//}"
          download="$temp/siteops-download"
          export HOME="$owned/home"
          export XDG_DATA_HOME="$owned/bootstrap-data"
          export XDG_CONFIG_HOME="$owned/bootstrap-config"
          export TMPDIR="$owned/tmp"
          export GH_CONFIG_DIR="$owned/gh-config"
          export UV_TOOL_DIR="$owned/bootstrap-tools"
          export UV_TOOL_BIN_DIR="$owned/bootstrap-bin"
          export UV_PYTHON_INSTALL_DIR="$owned/python"
          export UV_CACHE_DIR="$owned/cache"
          export PATH="$owned/tooling:$PATH"
          mkdir -p "$XDG_DATA_HOME" "$XDG_CONFIG_HOME" "$TMPDIR" "$GH_CONFIG_DIR" \
            "$UV_TOOL_DIR" "$UV_TOOL_BIN_DIR"
          caller="${BUILDER_IDENTITY#*/.github/workflows/}"
          caller="${caller%%@*}"
          [[ "$caller" == ci.yaml || "$caller" == release.yaml ]] ||
            { echo "::error::The attested caller is not supported by the bootstrap."; exit 1; }
          release=siteops/v0.0.0-ci
          selection="$(printf '%s\0' "$SOURCE_REPOSITORY" "$release" "$SOURCE_SHA" "$SOURCE_REF" "$caller" |
            sha256sum | cut -d ' ' -f 1)"
          cache="$XDG_DATA_HOME/siteops/install-downloads/$selection"
          mkdir -p "$cache"
          cp "$download/$ARCHIVE_NAME" "$cache/$ARCHIVE_NAME"
          cp "$download/${ARCHIVE_NAME}${ATTESTATION_SUFFIX}" \
            "$cache/${ARCHIVE_NAME}${ATTESTATION_SUFFIX}"
          if ! bash "$download/$BOOTSTRAP_SH" --release "$release" \
            --source-commit "$SOURCE_SHA" --repository "$SOURCE_REPOSITORY" \
            --source-ref "$SOURCE_REF" --caller "$caller" --yes \
            > "$owned/logs/bootstrap-sh.log" 2>&1; then
            echo "::error::The signed Bash bootstrap did not install the verified build."
            exit 1
          fi
          if ! grep -Fq 'Rechecking the retained release without downloading' \
            "$owned/logs/bootstrap-sh.log"; then
            echo "::error::The signed Bash bootstrap did not consume the private verified cache."
            exit 1
          fi
          "$APP_PYTHON" -I -S -B - "$UV_TOOL_DIR/siteops/pyvenv.cfg" \
            "$APP_PYTHON" "$MATRIX_PYTHON" <<'PY'
          import sys
          from pathlib import Path

          configuration = Path(sys.argv[1]).read_text(encoding="utf-8")
          settings = dict(line.split(" = ", 1) for line in configuration.splitlines())
          if (settings.get("home") != str(Path(sys.argv[2]).parent)
                  or not settings.get("version_info", "").startswith(sys.argv[3] + ".")):
              raise SystemExit("::error::The signed Bash bootstrap used another matrix runtime.")
          PY
          if [[ "$("$UV_TOOL_BIN_DIR/siteops" --version)" != "siteops $PACKAGE_VERSION" ]]; then
            echo "::error::The signed Bash bootstrap exposed another Site Ops build."
            exit 1
          fi
          echo "The attested Bash bootstrap installed the verified bundle without a release download."

      - name: Install with the signed PowerShell bootstrap
        if: matrix.os == 'windows-2025'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $owned = $env:SITEOPS_QUALIFICATION_ROOT
          $download = Join-Path $env:RUNNER_TEMP 'siteops-download'
          foreach ($name in @('GH_TOKEN', 'GITHUB_TOKEN', 'GH_ENTERPRISE_TOKEN', 'GITHUB_ENTERPRISE_TOKEN',
                              'PYTHONPATH', 'PYTHONHOME')) {
              [Environment]::SetEnvironmentVariable($name, $null, 'Process')
          }
          $env:HOME = Join-Path $owned 'home'
          $env:LOCALAPPDATA = Join-Path $owned 'bootstrap-profile'
          $env:TEMP = Join-Path $owned 'bootstrap-temp'
          $env:TMP = $env:TEMP
          $env:TMPDIR = $env:TEMP
          $env:GH_CONFIG_DIR = Join-Path $owned 'gh-config'
          $env:UV_TOOL_DIR = Join-Path $owned 'bootstrap-tools'
          $env:UV_TOOL_BIN_DIR = Join-Path $owned 'bootstrap-bin'
          $env:UV_PYTHON_INSTALL_DIR = Join-Path $owned 'python'
          $env:UV_CACHE_DIR = Join-Path $owned 'cache'
          $env:PATH = (Join-Path $owned 'tooling') + ';' + $env:PATH
          if (Test-Path -LiteralPath $env:LOCALAPPDATA) {
              throw 'The Windows qualification data root was not fresh.'
          }
          $bootstrapData = Join-Path $env:LOCALAPPDATA 'siteops'
          $sid = [Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          foreach ($directory in @($env:LOCALAPPDATA, $bootstrapData)) {
              try {
                  New-Item -ItemType Directory -Path $directory -ErrorAction Stop | Out-Null
              } catch {
                  throw 'The Windows qualification data root could not be created.'
              }
              $previousPreference = $ErrorActionPreference
              try {
                  $ErrorActionPreference = 'Continue'
                  & icacls.exe $directory /setowner "*$sid" *> $null
                  $ownedByUser = $LASTEXITCODE -eq 0
                  if ($ownedByUser) {
                      & icacls.exe $directory /inheritance:r /grant:r "*${sid}:(OI)(CI)F" *> $null
                      $protected = $LASTEXITCODE -eq 0
                  } else {
                      $protected = $false
                  }
              } finally {
                  $ErrorActionPreference = $previousPreference
              }
              if (-not $protected) {
                  throw 'The Windows qualification data root could not be protected.'
              }
          }
          foreach ($directory in @($env:TEMP, $env:GH_CONFIG_DIR,
                                  $env:UV_TOOL_DIR, $env:UV_TOOL_BIN_DIR)) {
              New-Item -ItemType Directory -Path $directory -Force | Out-Null
          }
          if ($env:BUILDER_IDENTITY -notmatch '/(ci|release)\.yaml@') {
              throw 'The attested caller is not supported by the bootstrap.'
          }
          $caller = $Matches[1] + '.yaml'
          $release = 'siteops/v0.0.0-ci'
          $selection = (@($env:SOURCE_REPOSITORY, $release, $env:SOURCE_SHA,
                          $env:SOURCE_REF, $caller) -join [char]0) + [char]0
          $hasher = [Security.Cryptography.SHA256]::Create()
          try {
              $selectionId = [BitConverter]::ToString(
                  $hasher.ComputeHash([Text.Encoding]::UTF8.GetBytes($selection))
              ).Replace('-', '').ToLowerInvariant()
          } finally { $hasher.Dispose() }
          $cache = Join-Path $env:LOCALAPPDATA "siteops\install-downloads\$selectionId"
          $cacheRoot = Split-Path -Parent $cache
          # Elevated runners assign new directories to Administrators. The bootstrap requires the user.
          foreach ($directory in @($cacheRoot, $cache)) {
              try {
                  New-Item -ItemType Directory -Path $directory -ErrorAction Stop | Out-Null
              } catch {
                  throw 'The Windows qualification cache could not be created.'
              }
              $previousPreference = $ErrorActionPreference
              try {
                  $ErrorActionPreference = 'Continue'
                  & icacls.exe $directory /setowner "*$sid" *> $null
                  $cacheOwned = $LASTEXITCODE -eq 0
              } finally {
                  $ErrorActionPreference = $previousPreference
              }
              if (-not $cacheOwned) {
                  throw 'The Windows qualification cache could not be owned by the runner user.'
              }
          }
          Copy-Item -LiteralPath (Join-Path $download $env:ARCHIVE_NAME) -Destination $cache
          Copy-Item -LiteralPath (Join-Path $download ($env:ARCHIVE_NAME + $env:ATTESTATION_SUFFIX)) `
              -Destination $cache
          $script = Join-Path $download $env:BOOTSTRAP_PS1
          $log = Join-Path $owned 'logs\bootstrap-ps1.log'
          $previousPreference = $ErrorActionPreference
          try {
              $ErrorActionPreference = 'Continue'
              & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $script `
                  -Release $release -SourceCommit $env:SOURCE_SHA -Repository $env:SOURCE_REPOSITORY `
                  -SourceRef $env:SOURCE_REF -Caller $caller -Yes *> $log
              $bootstrapStatus = $LASTEXITCODE
          } finally {
              $ErrorActionPreference = $previousPreference
          }
          if ($bootstrapStatus -ne 0) {
              if ((Get-Item -LiteralPath $log).Length -le 65536) {
                  $privateLog = Get-Content -LiteralPath $log -Raw
                  foreach ($code in @('ROOT_PATH', 'ROOT_ANCESTOR_TYPE', 'ROOT_ANCESTOR_OWNER',
                                      'ROOT_ANCESTOR_ACL', 'ROOT_DATA_CREATE', 'ROOT_DATA_TYPE',
                                      'ROOT_DATA_OWNER', 'ROOT_DATA_ACL')) {
                      if ($privateLog -and $privateLog.Contains(
                          "Configure a private Site Ops data root. $code"
                      )) {
                          throw "The signed PowerShell bootstrap rejected the isolated data root ($code)."
                      }
                  }
                  if ($privateLog -and $privateLog.Contains('Configure a private Site Ops data root')) {
                      throw 'The signed PowerShell bootstrap rejected the isolated data root.'
                  }
              }
              throw 'The signed PowerShell bootstrap did not install the verified build.'
          }
          if ((Get-Content -LiteralPath $log -Raw) -notmatch
              'Rechecking the retained release without downloading') {
              throw 'The signed PowerShell bootstrap did not consume the private verified cache.'
          }
          $configuration = Join-Path $env:UV_TOOL_DIR 'siteops\pyvenv.cfg'
          if ((Get-Item -LiteralPath $configuration).Length -gt 65536) {
              throw 'The signed PowerShell bootstrap has an invalid matrix runtime.'
          }
          $settings = Get-Content -LiteralPath $configuration -Raw
          $version = [regex]::Escape($env:MATRIX_PYTHON)
          $runtimeHome = [regex]::Escape((Split-Path -Parent $env:APP_PYTHON))
          if ($settings -cnotmatch "(?m)^version_info = $version\.[0-9]+\r?$" -or
              $settings -notmatch "(?m)^home = $runtimeHome\r?$") {
              throw 'The signed PowerShell bootstrap used another matrix runtime.'
          }
          $command = Join-Path $env:UV_TOOL_BIN_DIR 'siteops.exe'
          if ((& $command --version) -cne "siteops $env:PACKAGE_VERSION") {
              throw 'The signed PowerShell bootstrap exposed another Site Ops build.'
          }
          Write-Host 'The attested PowerShell bootstrap installed the verified bundle without a release download.'

      - name: Install Site Ops from the verified lock
        env:
          PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          set -euo pipefail
          umask 077
          unset PYTHONPATH PYTHONHOME
          temp="${RUNNER_TEMP//\\//}"
          extract="$temp/siteops-verified"
          owned="${SITEOPS_QUALIFICATION_ROOT//\\//}"
          logs="$owned/logs"
          archive="$temp/siteops-download/$ARCHIVE_NAME"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            if [[ -e "$owned/verified-bundle" ]]; then
              echo "::error::The retained qualification bundle must be fresh."
              exit 1
            fi
            if ! cp -R "$extract" "$owned/verified-bundle" \
              > "$logs/bundle-copy.log" 2>&1; then
              echo "::error::The verified bundle could not be retained in protected storage."
              exit 1
            fi
            extract="$owned/verified-bundle"
            export TEMP="$owned/temp" TMP="$owned/temp" TMPDIR="$owned/temp"
            export LOCALAPPDATA="$owned/home"
          fi
          mkdir "$owned/helper"
          "$PYTHON" -I -S -B - "$archive" "$owned/helper" <<'PY'
          import stat
          import sys
          import zipfile
          from pathlib import Path

          with zipfile.ZipFile(sys.argv[1]) as archive:
              entries = [member for member in archive.infolist()
                         if member.filename.casefold() == "siteops-install.py"]
              if (len(entries) != 1 or entries[0].filename != "siteops-install.py"
                      or not 0 < entries[0].file_size <= 1048576
                      or stat.S_IFMT(entries[0].external_attr >> 16) not in (0, stat.S_IFREG)):
                  raise SystemExit("::error::The authenticated bundle has no valid installer helper.")
              with archive.open(entries[0]) as stream:
                  content = stream.read(1048577)
              if len(content) != entries[0].file_size:
                  raise SystemExit("::error::The authenticated installer helper is incomplete.")
          with (Path(sys.argv[2]) / "siteops-install.py").open("xb") as output:
              output.write(content)
          PY
          helper="$owned/helper/siteops-install.py"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            command_name="siteops.exe"
          else
            command_name="siteops"
          fi
          export HOME="$owned/home"
          export UV_TOOL_DIR="$owned/verified-tools"
          export UV_TOOL_BIN_DIR="$owned/verified-bin"
          export UV_PYTHON_INSTALL_DIR="$owned/python"
          export UV_CACHE_DIR="$owned/cache"
          export UV_PYTHON_DOWNLOADS=never
          command_bin="$UV_TOOL_BIN_DIR"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            command_bin="$(cygpath -u "$command_bin")"
          fi
          export PATH="$command_bin:$PATH"
          cd "$owned"

          install_locked() {
            label="$1"
            mode="$2"
            bundle="$3"
            "$APP_PYTHON" -I -S -B "$helper" "$mode" "$archive" "$bundle" \
              "$SOURCE_REPOSITORY" "$SOURCE_SHA" "$SOURCE_REF" \
              "$SITEOPS_UV" "$UV_TOOL_DIR" "$UV_TOOL_BIN_DIR" \
              > "$logs/$label.json" 2> "$logs/$label.log"
          }

          expect_working_command() {
            resolved="$(command -v siteops || true)"
            if [[ "$resolved" != "$command_bin/siteops"* ]]; then
              echo "::error::The exposed command does not resolve inside this run's command directory."
              exit 1
            fi
            if ! observed="$("$command_bin/$command_name" --version 2> "$logs/version-$1.log")"; then
              echo "::error::The exposed command could not be executed after $1. Inspect the private version log."
              exit 1
            fi
            if [[ "$observed" != "siteops $PACKAGE_VERSION" ]]; then
              echo "::error::The exposed command reported an unexpected version after $1."
              exit 1
            fi
          }

          if ! install_locked install install "$extract"; then
            echo "::error::The authenticated verified bundle could not be installed with native uv."
            exit 1
          fi
          expect_working_command "installation"

          if ! install_locked repeat install "$extract"; then
            echo "::error::Repeating the same verified installation request failed."
            exit 1
          fi
          expect_working_command "a repeated request"

          if ! install_locked repair replace "$extract"; then
            echo "::error::The guarded replacement of the selected build failed."
            exit 1
          fi
          expect_working_command "a replacement"

          cp -R "$extract" "$owned/tampered"
          printf 'changed after the producer recorded this wheel' >> "$owned/tampered/wheels/$WHEEL_NAME"
          if install_locked tampered replace "$owned/tampered"; then
            echo "::error::A tampered wheel was accepted by the verified installation policy."
            exit 1
          fi
          expect_working_command "a rejected replacement"

          if ! "$SITEOPS_UV" tool uninstall siteops --no-config --offline \
            --no-python-downloads --no-progress > "$logs/uninstall.log" 2>&1; then
            echo "::error::Removal of the installed application failed."
            exit 1
          fi
          hash -r
          remaining="$(command -v siteops || true)"
          if [[ -e "$UV_TOOL_BIN_DIR/$command_name" || "$remaining" == "$command_bin/siteops"* ]]; then
            echo "::error::Removal left the exposed Site Ops command in place."
            exit 1
          fi
          echo "The authenticated bundle installed, repeated, replaced, rejected tampering, and removed cleanly."

      - name: Install Site Ops from the standalone wheel
        env:
          UV_DEFAULT_INDEX: ${{ env.PACKAGE_INDEX_URL }}
        run: |
          set -euo pipefail
          umask 077
          unset PYTHONPATH PYTHONHOME
          temp="${RUNNER_TEMP//\\//}"
          owned="${SITEOPS_QUALIFICATION_ROOT//\\//}"
          logs="$owned/logs"
          wheel="$temp/siteops-download/$WHEEL_NAME"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            export TEMP="$owned/temp" TMP="$owned/temp" TMPDIR="$owned/temp"
            export LOCALAPPDATA="$owned/home"
            command_name="siteops.exe"
          else
            command_name="siteops"
          fi

          # Only this independent wheel path may contact the approved index.
          index="$UV_DEFAULT_INDEX"
          while IFS= read -r name; do
            case "$name" in UV_*) unset "$name" ;; esac
          done < <(compgen -e)
          export HOME="$owned/home"
          export UV_TOOL_DIR="$owned/online-tools"
          export UV_TOOL_BIN_DIR="$owned/online-bin"
          export UV_PYTHON_INSTALL_DIR="$owned/python"
          export UV_CACHE_DIR="$owned/cache"
          export UV_PYTHON_DOWNLOADS=never
          command_bin="$UV_TOOL_BIN_DIR"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            command_bin="$(cygpath -u "$command_bin")"
          fi
          export PATH="$command_bin:$PATH"
          cd "$owned"

          if ! "$SITEOPS_UV" tool install "$wheel" --python "$APP_PYTHON" \
            --default-index "$index" --no-config --no-build --no-cache \
            --no-python-downloads --link-mode copy --no-progress --system-certs \
            > "$logs/online-install.log" 2>&1; then
            echo "::error::The standalone wheel could not be installed from the configured feed."
            exit 1
          fi

          "$APP_PYTHON" -I -S -B - "$UV_TOOL_DIR/siteops/pyvenv.cfg" \
            "$APP_PYTHON" "$MATRIX_PYTHON" <<'PY'
          import sys
          from pathlib import Path

          configuration = Path(sys.argv[1]).read_text(encoding="utf-8")
          settings = dict(line.split(" = ", 1) for line in configuration.splitlines())
          if (Path(settings.get("home", "")) != Path(sys.argv[2]).parent
                  or not settings.get("version_info", "").startswith(sys.argv[3] + ".")):
              raise SystemExit("::error::The standalone wheel used another matrix runtime.")
          PY
          resolved="$(command -v siteops || true)"
          if [[ "$resolved" != "$command_bin/siteops"* ]]; then
            echo "::error::The online command does not resolve inside this run's command directory."
            exit 1
          fi
          if ! observed="$("$command_bin/$command_name" --version 2> "$logs/online-version.log")"; then
            echo "::error::The online command could not be executed. Inspect the private version log."
            exit 1
          fi
          if [[ "$observed" != "siteops $PACKAGE_VERSION" ]]; then
            echo "::error::The online installation exposed an unexpected version."
            exit 1
          fi

          if ! "$SITEOPS_UV" tool uninstall siteops --no-config --offline \
            --no-python-downloads --no-progress > "$logs/online-uninstall.log" 2>&1; then
            echo "::error::Removal of the online installation failed."
            exit 1
          fi
          hash -r
          remaining="$(command -v siteops || true)"
          if [[ -e "$UV_TOOL_BIN_DIR/$command_name" || "$remaining" == "$command_bin/siteops"* ]]; then
            echo "::error::Removal left the exposed Site Ops command in place."
            exit 1
          fi
          echo "The standalone wheel installed with feed dependencies, exposed the expected version, and removed cleanly."

  summary:
    name: Distribution summary
    needs: [build, attest, qualify]
    if: always()
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      actions: read

    outputs:
      qualification-matrix: ${{ steps.report.outputs.qualification-matrix }}

    steps:
      - name: Aggregate the distribution result
        id: report
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT_SUMMARY: ${{ inputs.report-summary }}
          BUILD_RESULT: ${{ needs.build.result }}
          ATTEST_RESULT: ${{ needs.attest.result }}
          QUALIFY_RESULT: ${{ needs.qualify.result }}
          PACKAGE_VERSION: ${{ needs.build.outputs.package-version }}
          ARCHIVE_NAME_VALUE: ${{ needs.build.outputs.archive-name }}
          ARCHIVE_SHA256: ${{ needs.build.outputs.archive-sha256 }}
          WHEEL_NAME_VALUE: ${{ needs.build.outputs.wheel-name }}
          WHEEL_SHA256: ${{ needs.build.outputs.wheel-sha256 }}
          STAGING_ARTIFACT_ID: ${{ needs.attest.outputs.staging-artifact-id }}
          STAGING_ARTIFACT_NAME: ${{ needs.attest.outputs.staging-artifact-name }}
          STAGING_ARTIFACT_URL: ${{ needs.attest.outputs.staging-artifact-url }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          umask 077
          jobs_file="$RUNNER_TEMP/siteops-distribution-jobs.json"
          jobs_error="$RUNNER_TEMP/siteops-distribution-jobs.err"
          set +e
          gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" \
            > "$jobs_file" 2> "$jobs_error"
          jobs_api_status=$?
          set -e
          export JOBS_API_STATUS="$jobs_api_status"

          python3 - "$jobs_file" <<'PY'
          import html
          import json
          import os
          import sys


          cells = [
              (python, runner, column)
              for python in ("3.10", "3.11", "3.12", "3.13", "3.14")
              for runner, column in (
                  ("ubuntu-24.04", "linux"),
                  ("windows-2025", "windows"),
              )
          ]
          pythons = list(dict.fromkeys(python for python, _, _ in cells))
          expected = {
              f"Qualify bundle ({runner}, Python {python})": (python, column)
              for python, runner, column in cells
          }
          matches = {(python, column): [] for python, _, column in cells}
          problem = None

          if os.environ["JOBS_API_STATUS"] != "0":
              problem = "GitHub job conclusions could not be read."
              jobs = None
          else:
              try:
                  document = json.loads(open(sys.argv[1], encoding="utf-8").read())
                  jobs = document.get("jobs")
                  if not isinstance(jobs, list):
                      raise ValueError("jobs is not a list")
              except (OSError, ValueError, TypeError, json.JSONDecodeError):
                  problem = "GitHub returned an invalid job response."
                  jobs = None

          if jobs is not None:
              for job in jobs:
                  if not isinstance(job, dict) or not isinstance(job.get("name"), str):
                      continue
                  cell = expected.get(job["name"].rsplit(" / ", 1)[-1])
                  if cell is None:
                      continue
                  matches[cell].append(job)

          conclusions = {
              "success": "passed",
              "failure": "failed",
              "timed_out": "failed",
              "startup_failure": "failed",
              "cancelled": "cancelled",
              "skipped": "skipped",
          }

          def cell_status(python, column):
              if jobs is None:
                  return "unknown"
              candidates = matches[(python, column)]
              if not candidates:
                  return "not-run"
              if len(candidates) != 1:
                  return "unknown"
              job = candidates[0]
              if job.get("status") != "completed":
                  return "unknown"
              return conclusions.get(job.get("conclusion"), "unknown")


          matrix = [
              {
                  "python": python,
                  "linux": cell_status(python, "linux"),
                  "windows": cell_status(python, "windows"),
              }
              for python in pythons
          ]
          encoded = json.dumps(matrix, separators=(",", ":"))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("qualification-matrix=" + encoded + "\n")

          if os.environ["REPORT_SUMMARY"].lower() == "true" and problem is None:
              build = os.environ["BUILD_RESULT"]
              attest = os.environ["ATTEST_RESULT"]
              qualify = os.environ["QUALIFY_RESULT"]
              all_passed = all(
                  row["linux"] == "passed" and row["windows"] == "passed"
                  for row in matrix
              )

              if build != "success":
                  outcome = (
                      "The bundle build did not succeed. Review the Build bundle job, "
                      "correct the failure, and rerun this workflow."
                  )
              elif attest != "success":
                  outcome = (
                      "The bundle was built, but signing did not succeed. Review the "
                      "Attest bundle job and rerun after signing succeeds."
                  )
              elif qualify != "success" or not all_passed:
                  outcome = (
                      "One or more qualification cells did not pass. Open the corresponding "
                      "Qualify bundle job, correct the failure, and rerun this workflow."
                  )
              else:
                  outcome = (
                      "All Linux and Windows installation checks passed. The four "
                      "attested assets are ready for inspection."
                  )

              def code(value):
                  return "<code>" + html.escape(value or "not available") + "</code>"


              run_url = (
                  "https://github.com/"
                  + os.environ["GITHUB_REPOSITORY"]
                  + "/actions/runs/"
                  + os.environ["GITHUB_RUN_ID"]
                  + "/attempts/"
                  + os.environ["GITHUB_RUN_ATTEMPT"]
              )
              lines = [
                  "## Site Ops installer check",
                  "",
                  "Version: " + code(os.environ["PACKAGE_VERSION"]),
                  "",
                  outcome + " [Review this run](" + run_url + ").",
                  "",
              ]
              artifact_url = os.environ["STAGING_ARTIFACT_URL"]
              if artifact_url:
                  lines.extend(
                      [
                          "[Download the attested installation assets]("
                          + artifact_url
                          + ").",
                          "",
                          "The Actions download contains four attested assets: the installation ZIP, "
                          "the standalone Site Ops wheel, siteops-bootstrap.sh, and "
                          "siteops-bootstrap.ps1. Each has its own detached proof. "
                          "Verify an asset before extracting or installing it.",
                          "",
                      ]
                  )
              else:
                  lines.extend(
                      ["The attested installation assets are not available for download.", ""]
                  )

              lines.extend(
                  [
                      "### Installation checks",
                      "",
                      "| Python | Linux | Windows |",
                      "|---|---|---|",
                  ]
              )
              lines.extend(
                  "| " + row["python"] + " | " + row["linux"] + " | " + row["windows"] + " |"
                  for row in matrix
              )
              if any(
                  status in {"not-run", "unknown"}
                  for row in matrix
                  for status in (row["linux"], row["windows"])
              ):
                  lines.extend(
                      [
                          "",
                          "`not-run` means no matching qualification job was returned. "
                          "`unknown` means the job data was incomplete or ambiguous.",
                      ]
                  )

              lines.extend(
                  [
                      "",
                      "<details>",
                      "<summary>Source and artifact details</summary>",
                      "",
                      "| Detail | Value |",
                      "|---|---|",
                      "| Source SHA | " + code(os.environ["SOURCE_SHA"]) + " |",
                      "| Source ref | " + code(os.environ["SOURCE_REF"]) + " |",
                      "| Archive | " + code(os.environ["ARCHIVE_NAME_VALUE"]) + " |",
                      "| Archive SHA-256 | " + code(os.environ["ARCHIVE_SHA256"]) + " |",
                      "| Wheel | " + code(os.environ["WHEEL_NAME_VALUE"]) + " |",
                      "| Wheel SHA-256 | " + code(os.environ["WHEEL_SHA256"]) + " |",
                      "| Run attempt | " + code(os.environ["GITHUB_RUN_ATTEMPT"]) + " |",
                      "| Artifact ID | " + code(os.environ["STAGING_ARTIFACT_ID"]) + " |",
                      "| Artifact name | " + code(os.environ["STAGING_ARTIFACT_NAME"]) + " |",
                      "",
                      "</details>",
                      "",
                  ]
              )
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as output:
                  output.write("\n".join(lines))

          if problem is not None:
              print("::error::" + problem)
              raise SystemExit(1)
          if os.environ["QUALIFY_RESULT"] == "success" and any(
              row["linux"] != "passed" or row["windows"] != "passed" for row in matrix
          ):
              raise SystemExit("::error::GitHub did not return a complete successful qualification matrix.")
          PY
