# Reusable workflow for Site Ops deployments
# Called by deploy.yaml with specific parameters

name: _Site Ops Deploy

on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to checkout"
        required: false
        type: string
        default: ""
      workspace:
        description: "Workspace directory"
        required: false
        type: string
        default: "workspaces/iot-operations"
      manifest:
        description: "Path to manifest file (relative to workspace)"
        required: true
        type: string
      environment:
        description: "GitHub environment for protection rules"
        required: false
        type: string
        default: ""
      dry-run:
        description: "Prepare the executable plan without deployment"
        required: false
        type: boolean
        default: false
      siteops-source:
        description: "siteops install source (empty = local editable install)"
        required: false
        type: string
        default: ""
    secrets:
      AZURE_CLIENT_ID:
        description: "Azure AD application client ID"
        required: true
      AZURE_TENANT_ID:
        description: "Azure AD tenant ID"
        required: true
      AZURE_SUBSCRIPTION_ID:
        description: "Azure subscription ID (for OIDC)"
        required: true
      SITE_OVERRIDES:
        description: "JSON object with site overrides"
        required: false
      SITE_SELECTOR:
        description: "Site selector used for targeting (for example environment=prod). Passed as a secret because it may contain site names or private label values."
        required: false

env:
  PYTHONUNBUFFERED: "1"
  # Engine output reaches this workflow's logs and artifacts, which are public.
  # Set here rather than inherited, since a reusable workflow does not receive
  # the caller's env.
  SITEOPS_REDACT_OUTPUT: "1"
  # Suppress az result payloads. A command needing output passes an explicit `-o`.
  AZURE_CORE_OUTPUT: none

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || null }}

    permissions:
      id-token: write
      contents: read

    env:
      INPUT_WORKSPACE: ${{ inputs.workspace }}
      INPUT_MANIFEST: ${{ inputs.manifest }}
      INPUT_SELECTOR: ${{ secrets.SITE_SELECTOR }}
      INPUT_DRY_RUN: ${{ inputs.dry-run }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Setup Site Ops
        uses: ./.github/actions/setup-siteops
        with:
          siteops-source: ${{ inputs.siteops-source }}

      - name: Validate inputs
        shell: bash
        run: |
          # The workspace is relative to the checkout, and the manifest to the workspace.
          # Neither may be absolute, a drive path or contain "..".
          for value in "$INPUT_WORKSPACE" "$INPUT_MANIFEST"; do
            if [[ "$value" == *".."* || "$value" == /* || "$value" == \\* || "$value" =~ ^[A-Za-z]: ]]; then
              echo "::error::Use relative paths without '..': the workspace from the checkout, the manifest from the workspace."
              exit 1
            fi
          done

          if [[ -n "$INPUT_SELECTOR" && ! "$INPUT_SELECTOR" =~ ^[a-zA-Z0-9_=,./:-]+$ ]]; then
            echo "::error::Invalid selector format"
            exit 1
          fi

          if [[ ! -d "$INPUT_WORKSPACE" ]]; then
            echo "::error::Workspace directory not found: $INPUT_WORKSPACE"
            exit 1
          fi

          echo "✓ Inputs validated"

      - name: Setup site overrides
        env:
          SITE_OVERRIDES: ${{ secrets.SITE_OVERRIDES }}
        shell: bash
        run: |
          if [[ -z "$SITE_OVERRIDES" ]]; then
            echo "No site overrides configured, using committed sites"
            exit 0
          fi

          python3 scripts/mask-site-overrides.py github
          printf '%s' "$SITE_OVERRIDES" | python3 scripts/generate-site-overrides.py "$INPUT_WORKSPACE"

      - name: Azure Login (OIDC)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Start OIDC token refresh service
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: |
          # Background service that refreshes OIDC authentication every 4
          # minutes for long-running deployments.
          # PID is written to disk so the Azure Logout step can kill the
          # loop before clearing credentials. Otherwise the loop could
          # tick once more between logout and runner cleanup, briefly
          # re-establishing auth.
          (
            while true; do
              sleep 240
              token=$(curl -sH "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
                "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=api://AzureADTokenExchange" | jq -r .value)
              if [[ -z "$token" || "$token" == "null" ]]; then
                echo "::warning::OIDC token refresh failed: could not obtain token"
                continue
              fi
              if az login --service-principal -u "$AZURE_CLIENT_ID" -t "$AZURE_TENANT_ID" \
                --federated-token "$token" --output none 2>&1; then
                echo "OIDC token refreshed successfully"
              else
                echo "::warning::OIDC token refresh failed: az login returned error"
              fi
            done
          ) &
          echo $! > "$RUNNER_TEMP/oidc-refresh.pid"
          echo "OIDC token refresh service started (PID: $!)"

      - name: Prepare executable deployment plan
        shell: bash
        run: |
          # Bicep compiler acquisition and module restore run inside the
          # authenticated boundary. Only publishable JSON reaches the summary.
          umask 077
          CMD_ARGS=(
            -w "$INPUT_WORKSPACE"
            plan "$INPUT_MANIFEST"
            --output json
            --projection publishable
          )
          [[ -n "$INPUT_SELECTOR" ]] && CMD_ARGS+=(-l "$INPUT_SELECTOR")

          PLAN_STDOUT="$RUNNER_TEMP/siteops-plan.json"
          PLAN_STDERR="$RUNNER_TEMP/siteops-plan.stderr"
          cleanup_plan_files() {
            local status=$?
            if [[ ${PLAN_EXIT_CODE:-0} -ne 0 ]]; then status=$PLAN_EXIT_CODE; fi
            if rm -f "$PLAN_STDOUT" "$PLAN_STDERR" 2>/dev/null; then
              :
            else
              local cleanup_status=$?
              echo "::error::Private plan files could not be removed."
              if [[ $status -eq 0 ]]; then status=$cleanup_status; fi
            fi
            exit "$status"
          }
          trap cleanup_plan_files EXIT

          if siteops "${CMD_ARGS[@]}" >"$PLAN_STDOUT" 2>"$PLAN_STDERR"; then
            PLAN_EXIT_CODE=0
          else
            PLAN_EXIT_CODE=$?
          fi

          echo "### Deployment Plan" >> "$GITHUB_STEP_SUMMARY"
          PLAN_DOCUMENT_VALID=0
          PLAN_REPORT_EXIT_CODE=1
          if [[ -f "$GITHUB_WORKSPACE/scripts/render-siteops-output.py" ]]; then
            if python3 -I -S -B "$GITHUB_WORKSPACE/scripts/render-siteops-output.py" "$PLAN_STDOUT" \
                --kind DeploymentPlan --exit-code "$PLAN_EXIT_CODE" --platform github \
                --summary "$GITHUB_STEP_SUMMARY" --require-executable; then
              PLAN_DOCUMENT_VALID=1
            else
              PLAN_REPORT_EXIT_CODE=$?
            fi
          else
            message="Diagnostic details are unavailable."
            if [[ $PLAN_EXIT_CODE -eq 2 ]]; then message="Site Ops engine and template releases do not match. Use matching engine, setup, templates and helpers."; fi
            echo "::error::$message"
            echo "$message" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [[ $PLAN_EXIT_CODE -ne 0 ]]; then
            if [[ $PLAN_EXIT_CODE -ne 2 ]]; then
              echo "::error::Executable plan preparation failed. Run the plan locally for private diagnostics."
            fi
            exit "$PLAN_EXIT_CODE"
          fi
          if [[ $PLAN_DOCUMENT_VALID -ne 1 ]]; then
            echo "::error::Site Ops returned an unsupported plan document."
            exit "$PLAN_REPORT_EXIT_CODE"
          fi

      - name: Deploy
        id: deploy
        if: inputs.dry-run != true
        shell: bash
        run: |
          umask 077
          CMD_ARGS=(
            -w "$INPUT_WORKSPACE"
            deploy "$INPUT_MANIFEST"
            --yes
            --output json
            --projection publishable
          )
          [[ -n "$INPUT_SELECTOR" ]] && CMD_ARGS+=(-l "$INPUT_SELECTOR")

          RUN_STDOUT="$RUNNER_TEMP/siteops-run.json"
          RUN_STDERR="$RUNNER_TEMP/siteops-run.stderr"
          cleanup_run_files() {
            local status=$?
            if [[ ${DEPLOY_EXIT_CODE:-0} -ne 0 ]]; then status=$DEPLOY_EXIT_CODE; fi
            if rm -f "$RUN_STDOUT" "$RUN_STDERR" 2>/dev/null; then
              :
            else
              local cleanup_status=$?
              echo "::error::Private deployment files could not be removed."
              if [[ $status -eq 0 ]]; then status=$cleanup_status; fi
            fi
            exit "$status"
          }
          trap cleanup_run_files EXIT

          echo "Executing Site Ops deployment"
          if siteops "${CMD_ARGS[@]}" >"$RUN_STDOUT" 2>"$RUN_STDERR"; then
            DEPLOY_EXIT_CODE=0
          else
            DEPLOY_EXIT_CODE=$?
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Deployment Result" >> "$GITHUB_STEP_SUMMARY"
          RUN_DOCUMENT_VALID=0
          RUN_REPORT_EXIT_CODE=1
          if [[ -f "$GITHUB_WORKSPACE/scripts/render-siteops-output.py" ]]; then
            if python3 -I -S -B "$GITHUB_WORKSPACE/scripts/render-siteops-output.py" "$RUN_STDOUT" \
                --kind DeploymentRun --exit-code "$DEPLOY_EXIT_CODE" --platform github \
                --summary "$GITHUB_STEP_SUMMARY"; then
              RUN_DOCUMENT_VALID=1
            else
              RUN_REPORT_EXIT_CODE=$?
            fi
          else
            message="Diagnostic details are unavailable."
            if [[ $DEPLOY_EXIT_CODE -eq 2 ]]; then message="Site Ops engine and template releases do not match. Use matching engine, setup, templates and helpers."; fi
            echo "::error::$message"
            echo "$message" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [[ $DEPLOY_EXIT_CODE -eq 130 ]]; then
            echo "::error::Deployment stopped before every operation finished. Work already accepted by Azure was not cancelled."
            exit "$DEPLOY_EXIT_CODE"
          fi
          if [[ $DEPLOY_EXIT_CODE -ne 0 ]]; then
            if [[ $DEPLOY_EXIT_CODE -ne 2 ]]; then
              echo "::error::Deployment did not complete successfully. Review the result summary."
            fi
            exit "$DEPLOY_EXIT_CODE"
          fi
          if [[ $RUN_DOCUMENT_VALID -ne 1 ]]; then
            echo "::error::Site Ops returned an unsupported deployment result."
            exit "$RUN_REPORT_EXIT_CODE"
          fi

      - name: Azure Logout
        if: always()
        shell: bash
        run: |
          # Stop the OIDC refresh first so it cannot re-auth post-logout.
          # `kill <subshell-pid>` does not interrupt the loop's blocking
          # `sleep`. Kill the subshell's children too via pkill -P.
          if [[ -f "$RUNNER_TEMP/oidc-refresh.pid" ]]; then
            pid="$(cat "$RUNNER_TEMP/oidc-refresh.pid")"
            pkill -TERM -P "$pid" 2>/dev/null || true
            kill -TERM "$pid" 2>/dev/null || true
          fi
          az logout || true
