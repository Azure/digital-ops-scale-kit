# Validates manifests and runs unit tests on push and pull requests

name: CI
run-name: "CI: ${{ github.event_name == 'workflow_dispatch' && inputs.run-mode || 'ci-only' }} (${{ github.ref_name }})"

on:
  push:
    branches: [main]
    paths:
      - "siteops/**"
      - "workspaces/**"
      - "tests/**"
      - "scripts/**"
      - "pyproject.toml"
      - "releases/**/release.json"
      - "releases/**/notes.md"
      - ".github/workflows/**"
      - ".github/actions/**"
      - ".github/release-examples/**"
      - ".pipelines/**"
  pull_request:
    branches: [main]
    paths:
      - "siteops/**"
      - "workspaces/**"
      - "tests/**"
      - "scripts/**"
      - "pyproject.toml"
      - "releases/**/release.json"
      - "releases/**/notes.md"
      - ".github/workflows/**"
      - ".github/actions/**"
      - ".github/release-examples/**"
      - ".pipelines/**"
  workflow_dispatch:
    inputs:
      run-mode:
        description: "CI always runs. attestation-check creates a permanent public signing record. No mode publishes a release."
        type: choice
        required: false
        options: [ci-only, runner-check, attestation-check, installer-check, release-preview]
        default: ci-only
      expected-source-sha:
        description: "Required for any mode except ci-only: full commit SHA of the selected branch."
        type: string
        required: false
        default: ""
      release-file:
        description: "Release preview only. Keep the example or choose a committed releases/<name>/release.json."
        type: string
        required: false
        default: .github/release-examples/workspace-preview/release.json

permissions:
  contents: read

jobs:
  release-runner:
    name: Runner
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.run-mode == 'runner-check' || inputs.run-mode == 'installer-check' || inputs.run-mode == 'release-preview') }}
    uses: ./.github/workflows/_release-runner.yaml
    with:
      expected-source-sha: ${{ inputs.expected-source-sha }}
      mode: ${{ inputs.run-mode == 'runner-check' && 'check' || 'preview' }}
    permissions:
      contents: read

  installer-check:
    name: Installer
    needs: release-runner
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run-mode == 'installer-check' }}
    uses: ./.github/workflows/_siteops-distribution.yaml
    with:
      expected-source-sha: ${{ inputs.expected-source-sha }}
      release-pool: ${{ needs.release-runner.outputs.pool }}
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write

  release-preview:
    name: Preview
    needs: [lint, test, validate, release-runner]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run-mode == 'release-preview' }}
    uses: ./.github/workflows/_release-candidate.yaml
    with:
      expected-source-sha: ${{ inputs.expected-source-sha }}
      intent: ${{ inputs.release-file }}
      dry-run: true
      release-pool: ${{ needs.release-runner.outputs.pool }}
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write

  attestation-check:
    name: Attestation
    needs: [lint, test, validate]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run-mode == 'attestation-check' }}
    uses: ./.github/workflows/_attestation-check.yaml
    with:
      expected-source-sha: ${{ inputs.expected-source-sha }}
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write

  lint:
    name: Lint
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Site Ops
        uses: ./.github/actions/setup-siteops
        with:
          install-dev: "true"

      - name: Run ruff
        run: ruff check siteops tests scripts

      - name: Check changed release declarations
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.pull_request.base.sha }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python -B scripts/prepare-siteops-release.py \
            --repository "$SOURCE_REPOSITORY" --source-sha "$SOURCE_SHA" \
            --source-ref refs/heads/main --before-sha "$BEFORE_SHA" \
            --dry-run --output-dir "$RUNNER_TEMP/release-file-check"

  test:
    name: Unit Tests
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Site Ops
        uses: ./.github/actions/setup-siteops
        with:
          install-dev: "true"

      - name: Prepare native Linux uv fixtures
        shell: bash
        run: |
          set -euo pipefail
          fixtures="$RUNNER_TEMP/siteops-uv-fixtures"
          bash tests/fixtures/prepare-native-uv.sh "$fixtures"
          {
            echo "SITEOPS_TEST_UV=$fixtures/native/uv"
            echo "SITEOPS_TEST_UV_ARCHIVE=$fixtures/uv.tar.gz"
            echo "SITEOPS_TEST_UV_PYTHON_ARCHIVE=$fixtures/cpython.tar.gz"
            echo "SITEOPS_REQUIRE_LINUX_UV=1"
          } >> "$GITHUB_ENV"

      - name: Run unit tests
        # Includes bounded executable-plan coverage in tests/workspace/
        # test_executable_plans.py, using real catalog sites and Bicep schemas.
        # Compiler acquisition and module restore may use the network. The
        # tests block Azure deployment and cluster commands.
        run: pytest tests/ -m "not integration" -v --cov=siteops --cov-report=term-missing --cov-report=xml:coverage.xml --junitxml=test-results.xml

      - name: Test Summary
        if: always()
        shell: python
        run: |
          import xml.etree.ElementTree as ET
          import os

          if not os.path.exists("test-results.xml"):
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
                  f.write("## \u274c Test Results\n\nNo test results found.\n")
              raise SystemExit(0)

          tree = ET.parse("test-results.xml")
          root = tree.getroot()

          # Handle both <testsuites> (wrapper) and <testsuite> (direct) root elements
          suites = root.findall("testsuite") if root.tag == "testsuites" else [root]

          tests = sum(int(s.attrib.get("tests", 0)) for s in suites)
          failures = sum(int(s.attrib.get("failures", 0)) for s in suites)
          errors = sum(int(s.attrib.get("errors", 0)) for s in suites)
          skipped = sum(int(s.attrib.get("skipped", 0)) for s in suites)
          passed = tests - failures - errors - skipped
          time_taken = sum(float(s.attrib.get("time", 0)) for s in suites)

          icon = "\u2705" if failures == 0 and errors == 0 else "\u274c"
          summary = f"## {icon} Test Results\n\n"
          summary += "| Passed | Failed | Errors | Skipped | Total | Time |\n"
          summary += "|--------|--------|--------|---------|-------|------|\n"
          summary += f"| {passed} | {failures} | {errors} | {skipped} | {tests} | {time_taken:.1f}s |\n"

          if failures > 0 or errors > 0:
              summary += "\n### Failed Tests\n\n"
              for suite in root.iter("testsuite"):
                  for case in suite.iter("testcase"):
                      failure = case.find("failure")
                      error = case.find("error")
                      if failure is not None or error is not None:
                          name = case.attrib.get("name", "unknown")
                          classname = case.attrib.get("classname", "")
                          diagnostic = failure if failure is not None else error
                          msg = diagnostic.attrib.get("message", "")
                          summary += f"- `{classname}::{name}`: {msg}\n"

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write(summary + "\n")

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7

  linux-bootstrap:
    name: Linux Bootstrap (Ubuntu 26.04)
    if: github.event_name != 'workflow_dispatch' || inputs.run-mode == 'ci-only'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Site Ops
        uses: ./.github/actions/setup-siteops
        with:
          install-dev: "true"

      - name: Prepare native Linux uv fixtures
        shell: bash
        run: |
          set -euo pipefail
          fixtures="$RUNNER_TEMP/siteops-uv-fixtures"
          bash tests/fixtures/prepare-native-uv.sh "$fixtures"
          {
            echo "SITEOPS_TEST_UV=$fixtures/native/uv"
            echo "SITEOPS_TEST_UV_ARCHIVE=$fixtures/uv.tar.gz"
            echo "SITEOPS_TEST_UV_PYTHON_ARCHIVE=$fixtures/cpython.tar.gz"
            echo "SITEOPS_REQUIRE_LINUX_UV=1"
          } >> "$GITHUB_ENV"

      # The next ubuntu-latest image replaces most GNU core utilities with uutils.
      - name: Run Linux bootstrap and filesystem trust tests
        run: pytest tests/test_uv_bootstrap_linux.py tests/test_bootstrap_scripts.py tests/test_filesystem_trust.py -v

  windows-bootstrap:
    name: Windows Bootstrap
    if: github.event_name != 'workflow_dispatch' || inputs.run-mode == 'ci-only'
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      PIP_INDEX_URL: https://packagefeedproxy.microsoft.io/pypi/simple/
      PIP_CONFIG_FILE: NUL
      PIP_EXTRA_INDEX_URL: ""
      PIP_FIND_LINKS: ""
      PIP_TRUSTED_HOST: ""
      PIP_NO_INPUT: "1"
      PIP_KEYRING_PROVIDER: disabled
      SITEOPS_REQUIRE_WINDOWS_SYMLINK_REJECTION: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install test dependencies
        shell: powershell
        run: |
          python -m pip install --no-cache-dir -e '.[dev]'
          if ($LASTEXITCODE -ne 0) { throw 'Windows test dependencies could not be installed.' }

      - name: Prepare private test state
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $profileHome = [Environment]::GetFolderPath('UserProfile')
          if (-not [IO.Path]::IsPathRooted($profileHome) -or
              $env:GITHUB_RUN_ID -notmatch '^[0-9]+$' -or
              $env:GITHUB_RUN_ATTEMPT -notmatch '^[0-9]+$') {
              throw 'The Windows runner needs a bounded private test location.'
          }
          $private = Join-Path $profileHome (
              "siteops-windows-tests-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          )
          if (Test-Path -LiteralPath $private) {
              throw 'The Windows test area must be fresh.'
          }
          New-Item -ItemType Directory -Path $private -ErrorAction Stop | Out-Null
          $sid = [Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          $previousPreference = $ErrorActionPreference
          try {
              $ErrorActionPreference = 'Continue'
              & icacls.exe $private /setowner "*$sid" *> $null
              $owned = $LASTEXITCODE -eq 0
              if ($owned) {
                  & icacls.exe $private /inheritance:r /grant:r "*${sid}:(OI)(CI)F" *> $null
                  $protected = $LASTEXITCODE -eq 0
              }
          } finally {
              $ErrorActionPreference = $previousPreference
          }
          if (-not $owned -or -not $protected) {
              throw 'The Windows test area could not be protected.'
          }
          [IO.File]::AppendAllText(
              $env:GITHUB_ENV,
              "SITEOPS_WINDOWS_TEST_TEMP=$(Join-Path $private 'pytest')`n",
              [Text.UTF8Encoding]::new($false)
          )

      - name: Prepare native uv fixtures
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $parent = Split-Path -Parent $env:SITEOPS_WINDOWS_TEST_TEMP
          $fixtures = Join-Path $parent 'uv-fixtures'
          if (Test-Path -LiteralPath $fixtures) { throw 'The uv fixture area must be fresh.' }
          New-Item -ItemType Directory -Path $fixtures -ErrorAction Stop | Out-Null
          $archive = Join-Path $fixtures 'uv-windows.zip'
          & curl.exe --fail --silent --show-error --location --proto '=https' --proto-redir '=https' `
              --tlsv1.2 --max-redirs 3 --max-time 180 --max-filesize 18039150 `
              --output $archive 'https://github.com/astral-sh/uv/releases/download/0.12.20/uv-x86_64-pc-windows-msvc.zip'
          if ($LASTEXITCODE -ne 0 -or
              (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -cne
                  '95f9bc30fbb3574d276e28ac4a6de932d25153645853d13da8c21eec3bc88d06') {
              throw 'The native uv fixture archive could not be verified.'
          }
          $native = Join-Path $fixtures 'native'
          Expand-Archive -LiteralPath $archive -DestinationPath $native
          $uv = Join-Path $native 'uv.exe'
          Get-ChildItem Env: | Where-Object { $_.Name -like 'UV_*' -or $_.Name -like 'PYTHON*' } |
              ForEach-Object { [Environment]::SetEnvironmentVariable($_.Name, $null) }
          $env:UV_PYTHON_INSTALL_DIR = Join-Path $fixtures 'python'
          $env:UV_TOOL_DIR = Join-Path $fixtures 'tools'
          $env:UV_TOOL_BIN_DIR = Join-Path $fixtures 'bin'
          $env:UV_CACHE_DIR = Join-Path $fixtures 'cache'
          $previousPreference = $ErrorActionPreference
          try {
              $ErrorActionPreference = 'Continue'
              & $uv python install 3.11.16 --no-bin --no-registry --no-config --system-certs --no-progress `
                  > (Join-Path $fixtures 'runtime.log') 2>&1
              $runtimeExit = $LASTEXITCODE
          } finally { $ErrorActionPreference = $previousPreference }
          if ($runtimeExit -ne 0 -or -not (Test-Path -LiteralPath (
              Join-Path $env:UV_PYTHON_INSTALL_DIR 'cpython-3.11.16-windows-x86_64-none\python.exe'
          ) -PathType Leaf)) { throw 'The qualified uv-managed runtime fixture is unavailable.' }
          $settings = @(
              "SITEOPS_TEST_UV=$uv",
              "SITEOPS_TEST_UV_ARCHIVE=$archive",
              "SITEOPS_TEST_UV_PYTHON_DIR=$env:UV_PYTHON_INSTALL_DIR",
              'SITEOPS_REQUIRE_WINDOWS_UV=1'
          )
          [IO.File]::AppendAllText(
              $env:GITHUB_ENV, ($settings -join "`n") + "`n", [Text.UTF8Encoding]::new($false)
          )

      - name: Windows bootstrap tests
        shell: powershell
        run: |
          python -B -m pytest tests\test_bootstrap_scripts.py tests\test_uv_bootstrap_windows.py `
              -k 'windows_bootstrap or test_uv_bootstrap_windows' -q `
              --basetemp="$env:SITEOPS_WINDOWS_TEST_TEMP"
          if ($LASTEXITCODE -ne 0) { throw 'Native Windows bootstrap tests failed.' }

      - name: Windows installation consumers
        shell: powershell
        run: |
          python -B -m pytest tests\test_uv_installation.py tests\test_distribution_workflows.py `
              tests\test_release_workflow.py `
              -k 'test_uv_installation or native_qualification or matrix_runtime_admission or native_verified_installation_step or native_online_installation_step or native_installation_steps or generated_powershell_bootstrap or required_native_consumer_fixtures or windows_qualification' -q `
              --basetemp="$env:SITEOPS_WINDOWS_TEST_TEMP-consumers"
          if ($LASTEXITCODE -ne 0) { throw 'Native Windows installation consumer tests failed.' }

  validate:
    name: Validate Manifests
    runs-on: ubuntu-latest
    env:
      SITEOPS_REDACT_OUTPUT: "1"

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Site Ops
        uses: ./.github/actions/setup-siteops

      - name: Validate Bicep templates
        shell: pwsh
        run: ./scripts/validate-bicep.ps1

      - name: Verify generated host launchers
        shell: pwsh
        run: |
          ./workspaces/iot-operations/templates/host-bootstrap/aksee/scripts/Build-Launcher.ps1
          ./workspaces/iot-operations/templates/host-ops/aksee-upgrade/scripts/Build-Launcher.ps1
          git diff --exit-code -- `
            workspaces/iot-operations/templates/host-bootstrap/aksee/scripts/Install-AksEeBootstrap.ps1 `
            workspaces/iot-operations/templates/host-bootstrap/aksee/scripts/Install-AksEeBootstrap.min.ps1 `
            workspaces/iot-operations/templates/host-ops/aksee-upgrade/scripts/Install-AksEeUpgrade.ps1 `
            workspaces/iot-operations/templates/host-ops/aksee-upgrade/scripts/Install-AksEeUpgrade.min.ps1
          if ($LASTEXITCODE -ne 0) {
            throw "Generated host launchers are stale. Run each Build-Launcher.ps1 and commit the outputs."
          }

      - name: Find manifests
        id: find
        shell: bash
        env:
          WORKSPACE_DIR: workspaces/iot-operations
        # Discover every standalone Manifest YAML across the standard top-level
        # dirs so CI validates standalone manifests (manifests/) and sample
        # entry points (samples/<name>/manifest.yaml) consistently. Excludes:
        #   - partials (filename prefixed `_`), which fail standalone validation
        #     by design when they reference outputs from a parent's earlier steps.
        #   - parameters files in samples (inputs.yaml, outputs.yaml, etc.),
        #     which are not manifests.
        run: |
          if MANIFESTS=$(
            find "$WORKSPACE_DIR/manifests" "$WORKSPACE_DIR/samples" -mindepth 2 -maxdepth 2 \
              \( -name "manifest.yaml" -o -name "manifest.yml" \) 2>/dev/null | tr '\n' ' '
          ); then
            :
          else
            code=$?
            echo "::error::Manifest discovery failed."
            exit "$code"
          fi

          if [[ -z "$MANIFESTS" ]]; then
            echo "::error::The workspace has no standalone manifests to validate."
            exit 1
          fi
          echo "manifests=$MANIFESTS" >> "$GITHUB_OUTPUT"
          echo "Found manifests: $MANIFESTS"

      - name: Validate manifest structure
        if: steps.find.outputs.manifests != ''
        shell: bash
        env:
          MANIFESTS: ${{ steps.find.outputs.manifests }}
          WORKSPACE_DIR: workspaces/iot-operations
        run: |
          echo "## Manifest Validation" >> $GITHUB_STEP_SUMMARY
          EXIT_CODE=0

          for manifest in $MANIFESTS; do
            manifest_rel="${manifest#$WORKSPACE_DIR/}"
            echo "::group::Validating $manifest"
            echo "### $manifest_rel" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY

            # Libraries without targets remain structurally valid. Executable
            # catalog coverage runs in the workspace tests, not this sweep.
            if siteops -w "$WORKSPACE_DIR" validate "$manifest_rel" 2>&1 | tee -a $GITHUB_STEP_SUMMARY; then
              echo "✓ Valid"
            else
              EXIT_CODE=1
            fi

            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "::endgroup::"
          done

          exit $EXIT_CODE

  overview:
    name: Overview
    needs: [lint, test, linux-bootstrap, windows-bootstrap, validate, release-runner, installer-check, release-preview, attestation-check]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Summarize the selected CI mode
        shell: python
        env:
          CI_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.run-mode || 'ci-only' }}
          SOURCE_SHA: ${{ github.sha }}
          LINT_RESULT: ${{ needs.lint.result }}
          TEST_RESULT: ${{ needs.test.result }}
          LINUX_RESULT: ${{ needs.linux-bootstrap.result }}
          WINDOWS_RESULT: ${{ needs.windows-bootstrap.result }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
          RUNNER_RESULT: ${{ needs.release-runner.result }}
          INSTALLER_RESULT: ${{ needs.installer-check.result }}
          PREVIEW_RESULT: ${{ needs.release-preview.result }}
          ATTESTATION_RESULT: ${{ needs.attestation-check.result }}
        run: |
          import os
          import re

          modes = {
              "ci-only": ("Checks", (), "No release artifact work was requested."),
              "runner-check": (
                  "Runner check", (("Runner admission and diagnostics", "RUNNER_RESULT"),),
                  "This mode does not build, sign or publish release artifacts.",
              ),
              "attestation-check": (
                  "Attestation check", (("Non-release attestation", "ATTESTATION_RESULT"),),
                  "This mode signs public, non-release evidence and creates a permanent public signing record. It does not publish a release.",
              ),
              "installer-check": (
                  "Installer check", (("Runner admission", "RUNNER_RESULT"), ("Installer", "INSTALLER_RESULT")),
                  "This mode does not publish a release.",
              ),
              "release-preview": (
                  "Release preview", (("Runner admission", "RUNNER_RESULT"), ("Preview", "PREVIEW_RESULT")),
                  "This mode does not publish a release.",
              ),
          }
          mode = modes.get(os.environ["CI_MODE"])
          source = os.environ["SOURCE_SHA"]
          if mode is None or not re.fullmatch("[0-9a-f]{40}", source):
              raise SystemExit("::error::The CI summary requires a supported mode and source commit.")
          title, extra, scope = mode
          platforms = (
              (("Linux bootstrap (Ubuntu 26.04)", "LINUX_RESULT"), ("Windows bootstrap", "WINDOWS_RESULT"))
              if os.environ["CI_MODE"] == "ci-only" else ()
          )
          rows = (("Lint", "LINT_RESULT"), ("Unit tests", "TEST_RESULT"), *platforms,
                  ("Manifests", "VALIDATE_RESULT"), *extra)
          results = {"success": "Passed", "failure": "Failed", "cancelled": "Cancelled", "skipped": "Skipped"}
          lines = ["## CI: " + title, "", "Source: `" + source + "`", "", "| Check | Result |", "|---|---|"]
          for label, key in rows:
              value = os.environ[key]
              if value not in results:
                  raise SystemExit("::error::A CI job returned an unsupported completion result.")
              lines.append("| " + label + " | " + results[value] + " |")
          lines.extend(["", scope, "", "Open the relevant job for its detailed output.", ""])
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as output:
              output.write("\n".join(lines))
