name: _Reconcile owned fleet resources
on:
  workflow_call:
    inputs:
      candidate:
        description: The original exact FleetCandidate selection.
        required: true
        type: string
      original-run:
        description: Original fleet acceptance workflow run ID.
        required: true
        type: string
      original-attempt:
        description: Original fleet acceptance attempt.
        required: true
        type: string
      environment:
        description: Approved environment with the original Azure subscription and scoped identity.
        required: true
        type: string
    secrets:
      AZURE_CLIENT_ID:
        required: false
      AZURE_TENANT_ID:
        required: false
      AZURE_SUBSCRIPTION_ID:
        required: false
permissions:
  contents: read
  actions: read
  id-token: write
jobs:
  reconcile:
    name: Reconcile original fleet
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: ${{ inputs.environment }}
    env:
      FLEET_CANDIDATE: ${{ inputs.candidate }}
      FLEET_RUN_ID: ${{ inputs.original-run }}
      FLEET_RUN_ATTEMPT: ${{ inputs.original-attempt }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_CORE_OUTPUT: none
      SITEOPS_REDACT_OUTPUT: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-fleet-tools
        id: tools
      - name: Select original candidate
        id: select
        shell: bash
        env:
          PYTHON: ${{ steps.tools.outputs.python }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          mkdir "$RUNNER_TEMP/fleet"
          "$PYTHON" -B scripts/coordinate-release-fleet.py select --root "$RUNNER_TEMP/fleet"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.select.outputs.admission-id }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.select.outputs.producer-run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/fleet/admission
          merge-multiple: true
          digest-mismatch: error
      - name: Recover original ownership
        id: ownership
        shell: bash
        env:
          PYTHON: ${{ steps.tools.outputs.python }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          "$PYTHON" -B scripts/coordinate-release-fleet.py ownership --root "$RUNNER_TEMP/fleet"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.ownership.outputs.ownership-id }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.original-run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/fleet/ownership
          merge-multiple: true
          digest-mismatch: error
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Reconcile original owned groups
        shell: bash
        env:
          PYTHON: ${{ steps.tools.outputs.python }}
          ADMISSION_SHA: ${{ steps.select.outputs.admission-sha }}
        run: |
          set -euo pipefail
          umask 077
          # The preceding download verifies the selected original artifact's digest.
          OWNERSHIP_SHA="$(sha256sum "$RUNNER_TEMP/fleet/ownership/ownership.json" | cut -d ' ' -f 1)"
          "$PYTHON" -B scripts/manage-release-fleet.py cleanup --execute \
            --admission "$RUNNER_TEMP/fleet/admission/receipt.json" --expected-admission-sha "$ADMISSION_SHA" \
            --ownership "$RUNNER_TEMP/fleet/ownership/ownership.json" --expected-ownership-sha "$OWNERSHIP_SHA" \
            --private-logs "$RUNNER_TEMP/fleet/reconcile-private" --output "$RUNNER_TEMP/fleet/reconciled.json"
      - name: Retain reconciliation outcome
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fleet-reconciliation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fleet/reconciled.json
          if-no-files-found: error
          overwrite: false
          retention-days: 30
