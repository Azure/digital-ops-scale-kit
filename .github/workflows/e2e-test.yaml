# End-to-end test workflow.
#
# Runs the full scalekit stack (k3s cluster, Arc registration, siteops deploy,
# integration tests) against a real Azure subscription. This is the primary
# live-subscription validation for every AIO version we target.
#
# Modes (determined by whether `resource-group` input is set):
#   - ephemeral (default):  Workflow creates a fresh RG per matrix entry and
#                           deletes it at the end. Requires subscription-level
#                           Owner on the service principal.
#   - persistent:           Operator supplies a pre-existing RG via the
#                           `resource-group` input. The RG is preserved. Only
#                           resources created during this run (delta vs. the
#                           pre-run RG snapshot) are deleted. Requires
#                           RG-level Owner on the SP.
#
# The E2E site itself is rendered at runtime via scripts/render-e2e-site.py
# into $RUNNER_TEMP/e2e-sites/ and picked up by the orchestrator through
# SITEOPS_EXTRA_SITES_DIRS, so we never commit an Azure-specific site file.

name: E2E Tests

on:
  workflow_dispatch:
    inputs:
      aio-releases:
        description: Comma-separated AIO releases to fan out over (e.g. "2607,2608").
        type: string
        default: "2608"
      environment:
        description: GitHub Environment whose secrets/approvers apply.
        type: string
        default: "dev"
      location:
        description: Azure region for ephemeral mode. Ignored in persistent mode (derived from the RG).
        type: string
        default: "eastus2"
      resource-group:
        description: Pre-existing RG (persistent mode). Empty = ephemeral mode.
        type: string
        default: ""
      cluster-name:
        description: Arc cluster name to register. Empty = auto-generated.
        type: string
        default: ""
      custom-locations-oid:
        description: Custom Locations RP object ID in the tenant. Empty uses the CUSTOM_LOCATIONS_OID environment secret.
        type: string
        default: ""
      skip-teardown:
        description: Preserve the deployment for inspection. Use sparingly.
        type: boolean
        default: false
      keep-cluster-alive-minutes:
        description: Minutes to keep the runner (and k3s cluster) alive after tests, before teardown. 0 = skip. Clamped to what is left of the job budget so teardown still runs.
        type: number
        default: 0
      upgrade-to:
        description: Optional AIO release to upgrade to after the install-phase tests pass. Empty = skip the upgrade phase. Each matrix cell whose `aio-releases` value differs from this re-renders the site at the upgrade-to release and runs aio-upgrade.yaml + the upgrade-only integration tests.
        type: string
        default: ""
      secret-sync-modes:
        description: "Comma-separated modes: enabled,disabled. Disabled mode omits Secret Sync, OIDC issuer, and workload identity. Use both modes with tests=aio-upgrade to qualify optionality."
        type: string
        default: "enabled"
      tests:
        description: "Subset of integration test files to run, comma-separated. Each value maps to one tests/integration/test_<value>_manifest.py file and narrows which manifest gets deployed onto the cluster. Empty = run all. Valid values: aio-install, enable-secretsync, sync-secrets, opc-ua-solution, dataflow-sample, aio-resources, resource-set-samples, aio-upgrade. Useful for demos and focused debugging when paired with keep-cluster-alive-minutes."
        type: string
        default: ""
      published-release:
        description: "Published release tag to exercise through verified engine installation and project pin. Empty keeps the checkout-source E2E path."
        type: string
        default: ""
      published-source-sha:
        description: "Full main-branch commit expected for published-release. Required with published-release."
        type: string
        default: ""
      published-journey:
        description: "Published package scenario: configured Site control or guided single Site. Guided supports Secret Sync enabled and disabled."
        type: choice
        options: [configured, guided]
        default: configured

permissions:
  id-token: write
  contents: read

# Engine output reaches this workflow's logs and artifacts, which are public.
# `GITHUB_ACTIONS` already turns redaction on, so this is here to make the
# intent visible and to cover a step that does not inherit that variable.
env:
  SITEOPS_REDACT_OUTPUT: "1"
  # Suppress az result payloads. A command needing output passes an explicit `-o`.
  AZURE_CORE_OUTPUT: none

jobs:
  prep:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.v.outputs.versions }}
      persistent: ${{ steps.v.outputs.persistent }}
      rg-key: ${{ steps.v.outputs.rg_key }}
      upgrade-to: ${{ steps.v.outputs.upgrade_to }}
      pytest-paths: ${{ steps.v.outputs.pytest_paths }}
      isolate-dataflow-sample: ${{ steps.v.outputs.isolate_dataflow_sample }}
      secret-sync-modes: ${{ steps.v.outputs.secret_sync_modes }}
      max-parallel: ${{ steps.v.outputs.max_parallel }}
      published-mode: ${{ steps.v.outputs.published_mode }}
      published-release: ${{ steps.v.outputs.published_release }}
      published-source-sha: ${{ steps.v.outputs.published_source_sha }}
      published-journey: ${{ steps.v.outputs.published_journey }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A template that does not compile fails every deploy that reaches it, so
      # this runs before the matrix provisions a cluster. Warnings are fatal
      # here, which is what catches an unknown resource type or API version.
      - name: Validate Bicep templates
        if: inputs.published-release == ''
        shell: pwsh
        run: ./scripts/validate-bicep.ps1

      - name: Parse inputs
        id: v
        shell: bash
        env:
          INPUT_RELEASES: "${{ inputs.aio-releases }}"
          INPUT_UPGRADE_TO: "${{ inputs.upgrade-to }}"
          INPUT_SECRET_SYNC_MODES: "${{ inputs.secret-sync-modes }}"
          INPUT_TESTS: "${{ inputs.tests }}"
          INPUT_PUBLISHED_RELEASE: "${{ inputs.published-release }}"
          INPUT_PUBLISHED_SOURCE_SHA: "${{ inputs.published-source-sha }}"
          INPUT_PUBLISHED_JOURNEY: "${{ inputs.published-journey }}"
          INPUT_SKIP_TEARDOWN: "${{ inputs.skip-teardown }}"
          INPUT_KEEP_ALIVE: "${{ inputs.keep-cluster-alive-minutes }}"
          RUN_ID: "${{ github.run_id }}"
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import hashlib, json, os, re, sys, unicodedata
          from pathlib import Path

          def output_token(value, label, maximum=256):
              if value and (
                  len(value) > maximum
                  or any(
                      character.isspace()
                      or unicodedata.category(character).startswith("C")
                      for character in value
                  )
              ):
                  sys.exit(f"{label} must be bounded text without whitespace or controls.")
              return value

          rs = [r.strip() for r in os.environ["INPUT_RELEASES"].split(",") if r.strip()]
          if not rs:
              sys.exit("aio-releases must be non-empty")
          for release in rs:
              output_token(release, "aio-releases entry", maximum=64)
          published_release = output_token(
              os.environ["INPUT_PUBLISHED_RELEASE"].strip(),
              "published-release",
              maximum=128,
          )
          published_source_sha = os.environ["INPUT_PUBLISHED_SOURCE_SHA"].strip()
          published_mode = bool(published_release)
          published_journey = output_token(
              os.environ["INPUT_PUBLISHED_JOURNEY"].strip(),
              "published-journey",
              maximum=16,
          )
          if published_journey not in {"configured", "guided"}:
              sys.exit("published-journey must be configured or guided.")
          if not published_mode and published_journey != "configured":
              sys.exit("published-journey requires published-release.")
          if bool(published_source_sha) != published_mode:
              sys.exit(
                  "published-release and published-source-sha must be supplied together."
              )
          if published_mode and not re.fullmatch(r"[0-9a-f]{40}", published_source_sha):
              sys.exit("published-source-sha must be a full lowercase commit.")
          # Fail fast if any requested release lacks a shipped config YAML.
          # Without this, a release without a matching config file
          # proceeds through k3s bring-up + Arc registration and only errors
          # out at siteops deploy time.
          releases_dir = Path("workspaces/iot-operations/parameters/aio-releases")
          if not published_mode:
              missing = [r for r in rs if not (releases_dir / f"{r}.yaml").is_file()]
              if missing:
                  available = sorted(p.stem for p in releases_dir.glob("*.yaml"))
                  sys.exit(
                      f"aio-releases entries without a matching "
                      f"{releases_dir}/<release>.yaml: {missing}. "
                      f"Available: {available}."
                  )
          target_inputs = json.loads(
              Path(os.environ["GITHUB_EVENT_PATH"]).read_text(encoding="utf-8")
          ).get("inputs")
          if not isinstance(target_inputs, dict):
              sys.exit("Workflow target inputs are unavailable.")
          rg_in = target_inputs.get("resource-group", "")
          cl_in = target_inputs.get("cluster-name", "")
          if not isinstance(rg_in, str) or not isinstance(cl_in, str):
              sys.exit("Workflow target inputs must be text.")
          rg_in = output_token(rg_in.strip(), "resource-group")
          cl_in = output_token(cl_in.strip(), "cluster-name")
          upgrade_to = output_token(
              os.environ["INPUT_UPGRADE_TO"].strip(), "upgrade-to", maximum=64,
          )
          if published_mode and upgrade_to:
              sys.exit("Published E2E does not support the upgrade phase.")
          secret_sync_modes = [
              mode.strip()
              for mode in os.environ["INPUT_SECRET_SYNC_MODES"].split(",")
              if mode.strip()
          ]
          if not secret_sync_modes:
              sys.exit("secret-sync-modes must be non-empty")
          secret_sync_modes = list(dict.fromkeys(secret_sync_modes))
          invalid_secret_sync_modes = [
              mode for mode in secret_sync_modes
              if mode not in {"enabled", "disabled"}
          ]
          if invalid_secret_sync_modes:
              sys.exit(
                  "secret-sync-modes entries not recognized: "
                  f"{invalid_secret_sync_modes}. Valid: ['disabled', 'enabled']."
              )
          persistent = bool(rg_in)
          if cl_in and (len(rs) > 1 or len(secret_sync_modes) > 1):
              sys.exit(
                  "cluster-name cannot be combined with a matrix that has "
                  "multiple AIO releases or Secret Sync modes. Each matrix "
                  "cell registers its own cluster."
              )
          # Validate upgrade-to against shipped versions. Same-version cells
          # are NOT a hard error here: a matrix like `aio-releases=2607,2608`
          # with `upgrade-to=2608` is a legitimate "test 2607->2608 plus
          # exercise 2608 install" shape. Each cell decides per-cell whether
          # to skip the upgrade phase based on `matrix.aio-release == upgrade-to`.
          if upgrade_to and not (releases_dir / f"{upgrade_to}.yaml").is_file():
              available = sorted(p.stem for p in releases_dir.glob("*.yaml"))
              sys.exit(
                  f"upgrade-to '{upgrade_to}' has no matching "
                  f"{releases_dir}/{upgrade_to}.yaml. Available: {available}."
              )
          if upgrade_to and all(r == upgrade_to for r in rs):
              sys.exit(
                  f"upgrade-to '{upgrade_to}' equals every entry in aio-releases "
                  f"({rs}); the upgrade phase would be vacuous on every cell. "
                  f"Same-version round-trip is already covered by the install-phase "
                  f"test_aio_upgrade_manifest tests."
              )
          # Resolve the tests input into a pytest path list. Empty = the
          # full integration suite (preserves prior behavior). A non-empty
          # subset narrows pytest collection to just those test files, which
          # also narrows fixture chains so only the requested manifests get
          # deployed onto the cluster (e.g. `aio-install,secretsync` keeps
          # OPC UA off the cluster for a focused demo session).
          tests_in = [s.strip() for s in os.environ["INPUT_TESTS"].split(",") if s.strip()]
          # Map of test phase -> integration test file. The convention
          # `<phase>` -> `tests/integration/test_<phase_underscored>_manifest.py`
          # is enforced by the integration suite layout. Keep this list in
          # sync if a new test phase file is added.
          test_map = {
              "aio-install": "tests/integration/test_aio_install_manifest.py",
              "enable-secretsync": "tests/integration/test_enable_secretsync_manifest.py",
              "sync-secrets": "tests/integration/test_sync_secrets_manifest.py",
              "opc-ua-solution": "tests/integration/test_opc_ua_solution_manifest.py",
              "dataflow-sample": "tests/integration/test_dataflow_sample_manifest.py",
              "aio-resources": "tests/integration/test_aio_resources_manifest.py",
              "resource-set-samples": "tests/integration/test_resource_set_samples_manifest.py",
              "aio-upgrade": "tests/integration/test_aio_upgrade_manifest.py",
          }
          profile_heavy = {
              "dataflow-sample",
              "resource-set-samples",
          }
          ordered = []
          if tests_in:
              # Dedupe while preserving order so the surfaced "Available" list
              # in error messages matches what the operator typed.
              seen = set()
              ordered = []
              for s in tests_in:
                  if s not in seen:
                      seen.add(s)
                      ordered.append(s)
              unknown = [s for s in ordered if s not in test_map]
              if unknown:
                  sys.exit(
                      f"tests entries not recognized: {unknown}. "
                      f"Valid: {sorted(test_map)}."
                  )
              if upgrade_to and not published_mode and "aio-upgrade" not in ordered:
                  sys.exit(
                      f"upgrade-to '{upgrade_to}' is set but `tests` "
                      f"({ordered}) does not include 'aio-upgrade'. The "
                      f"upgrade-phase pytest step would collect zero tests. "
                      f"Either add 'aio-upgrade' to "
                      f"tests or unset upgrade-to."
                  )
              if profile_heavy.issubset(ordered):
                  first_profile_phase = min(
                      ordered.index(phase)
                      for phase in profile_heavy
                  )
                  ordered = [
                      phase
                      for phase in ordered
                      if phase not in profile_heavy
                  ]
                  ordered[first_profile_phase:first_profile_phase] = [
                      "dataflow-sample",
                      "resource-set-samples",
                  ]
              pytest_paths = " ".join(test_map[s] for s in ordered)
          else:
              pytest_paths = "tests/integration/"
          selected_tests = set(tests_in) if tests_in else set(test_map)
          isolate_dataflow_sample = profile_heavy.issubset(selected_tests)
          if "disabled" in secret_sync_modes and not published_mode:
              secret_sync_tests = {"enable-secretsync", "sync-secrets"}
              if not tests_in or secret_sync_tests.intersection(tests_in):
                  sys.exit(
                      "secret-sync-modes includes 'disabled', but the selected "
                      "tests include Secret Sync coverage. Set tests=aio-upgrade "
                      "or choose only phases that do not deploy Secret Sync."
                  )
          if published_mode:
              if len(rs) != 1:
                  sys.exit("Published E2E requires exactly one aio-releases entry.")
              if published_journey == "guided" and rs != ["2608"]:
                  sys.exit("Published guided E2E currently requires aio-releases=2608.")
              if not persistent or cl_in:
                  sys.exit(
                      "Published E2E requires an existing resource group and an "
                      "auto-generated cluster name."
                  )
              if published_journey == "configured" and secret_sync_modes != ["disabled"]:
                  sys.exit("Published E2E requires secret-sync-modes=disabled.")
              if ordered != ["aio-install"]:
                  sys.exit("Published E2E requires tests=aio-install.")
              if os.environ["INPUT_SKIP_TEARDOWN"].lower() == "true":
                  sys.exit("Published E2E cannot skip teardown.")
              if float(os.environ["INPUT_KEEP_ALIVE"] or 0) != 0:
                  sys.exit("Published E2E cannot keep the cluster alive.")
          print(f"versions={json.dumps(rs)}")
          print(f"secret_sync_modes={json.dumps(secret_sync_modes)}")
          print(f"max_parallel={1 if persistent or published_mode else 20}")
          print(f"upgrade_to={upgrade_to}")
          print(f"persistent={'true' if persistent else 'false'}")
          print(f"published_mode={'true' if published_mode else 'false'}")
          print(f"published_journey={published_journey}")
          print(f"published_release={published_release}")
          print(f"published_source_sha={published_source_sha}")
          print(f"pytest_paths={pytest_paths}")
          print(
              "isolate_dataflow_sample="
              f"{'true' if isolate_dataflow_sample else 'false'}"
          )
          # Concurrency key:
          #  - persistent: shared across all dispatches against the same RG
          #    (regardless of operator-supplied cluster-name), so concurrent
          #    persistent runs on one RG serialize. Prevents races where two
          #    runs' delta snapshots each see the other's in-flight resources.
          #  - ephemeral:  per-run key. Matrix cells parallelize via the
          #    matrix.aio-release suffix applied at the job level.
          rg_key = (
              "persistent-" + hashlib.sha256(rg_in.casefold().encode("utf-8")).hexdigest()
              if persistent else f"ephemeral-{os.environ['RUN_ID']}"
          )
          print(f"rg_key={rg_key}")
          PY

  e2e:
    needs: prep
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    # Ephemeral runs remove their resource group. Persistent runs remove only
    # resources created during the run. The timeout leaves room for the
    # `always()` teardown step, since cancellation can skip cleanup.
    timeout-minutes: ${{ (inputs.keep-cluster-alive-minutes > 0 || inputs.upgrade-to != '') && 360 || 180 }}
    concurrency:
      # Persistent: matrix cells share rg_key and omit the release suffix, so
      # they serialize (same RG can only host one AIO deploy at a time).
      # Ephemeral: rg_key is per-run and the release suffix distinguishes
      # cells, so matrix fan-out runs in parallel.
      group: e2e-${{ needs.prep.outputs.rg-key }}${{ needs.prep.outputs.persistent == 'true' && '-persistent' || format('-{0}-secretsync-{1}', matrix.aio-release, matrix.secret-sync-mode) }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.prep.outputs.max-parallel) }}
      matrix:
        aio-release: ${{ fromJSON(needs.prep.outputs.versions) }}
        secret-sync-mode: ${{ fromJSON(needs.prep.outputs.secret-sync-modes) }}
    env:
      PERSISTENT_RG: ${{ needs.prep.outputs.persistent }}
      PUBLISHED_JOURNEY: ${{ needs.prep.outputs.published-journey }}
      DEBUG_USER_OID: ${{ secrets.DEBUG_USER_OID }}
    steps:
      # Step headers show env values before shell commands can mask them.
      - name: Mask operator target inputs
        id: target-inputs
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          import unicodedata
          from pathlib import Path

          event = json.loads(
              Path(os.environ["GITHUB_EVENT_PATH"]).read_text(encoding="utf-8")
          )
          inputs = event.get("inputs")
          if not isinstance(inputs, dict):
              raise SystemExit("Workflow target inputs are unavailable.")
          values = {}
          for name, output_name in (
              ("resource-group", "rg_in"),
              ("cluster-name", "cluster_in"),
          ):
              value = inputs.get(name, "")
              if not isinstance(value, str):
                  raise SystemExit(f"{name} must be text.")
              value = value.strip()
              if value and (
                  len(value) > 256
                  or any(
                      character.isspace()
                      or unicodedata.category(character).startswith("C")
                      for character in value
                  )
              ):
                  raise SystemExit(f"{name} must be bounded text without whitespace or controls.")
              if value:
                  # Workflow commands decode percent sequences before registering masks.
                  print(f"::add-mask::{value.replace('%', '%25')}", flush=True)
              values[output_name] = value
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              for name, value in values.items():
                  print(f"{name}={value}", file=output)
          PY

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compute names
        id: names
        shell: bash
        env:
          RG_IN: "${{ steps.target-inputs.outputs.rg_in }}"
          CL_IN: "${{ steps.target-inputs.outputs.cluster_in }}"
          RELEASE: "${{ matrix.aio-release }}"
          SECRET_SYNC_MODE: "${{ matrix.secret-sync-mode }}"
          RUN_ID: "${{ github.run_id }}"
          RUN_ATTEMPT: "${{ github.run_attempt }}"
        # Some AIO release strings may contain dots. Arc clusters
        # and several AIO-derived resource names reject dots, so we derive a
        # name-safe form (non-alphanumerics → `-`, trailing `-` trimmed) when
        # generating RG / cluster / site names. E2E_AIO_RELEASE still carries
        # the original string so release pinning inside the site is unaffected.
        #
        # site_name is runtime-unique even in persistent mode so parallel
        # runs against the same RG cannot merge their generated sites.
        run: |
          set -euo pipefail
          SAFE_VER=$(printf '%s' "$RELEASE" | tr -c 'a-zA-Z0-9' '-' | sed 's/-*$//')
          case "$SECRET_SYNC_MODE" in
            enabled) SYNC_SUFFIX="sync-on" ;;
            disabled) SYNC_SUFFIX="sync-off" ;;
            *) echo "::error::Unexpected Secret Sync mode '$SECRET_SYNC_MODE'"; exit 1 ;;
          esac
          LONG_SUFFIX="${RUN_ID}-${RUN_ATTEMPT}-${SAFE_VER}-secretsync-${SECRET_SYNC_MODE}"
          SHORT_RUN="${RUN_ID: -8}-${RUN_ATTEMPT}"
          RESOURCE_SUFFIX="${SHORT_RUN}-${SAFE_VER}-${SYNC_SUFFIX}"
          RG="${RG_IN:-rg-e2e-$LONG_SUFFIX}"
          CL="${CL_IN:-e2e-$RESOURCE_SUFFIX}"
          SN="e2e-$RESOURCE_SUFFIX"
          echo "::add-mask::$SN"
          echo "rg=$RG" >> "$GITHUB_OUTPUT"
          echo "cluster=$CL" >> "$GITHUB_OUTPUT"
          echo "site_name=$SN" >> "$GITHUB_OUTPUT"
          echo "job_start_epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/setup-published-siteops
        if: needs.prep.outputs.published-mode == 'true'
        with:
          repository: ${{ github.repository }}
          release: ${{ needs.prep.outputs.published-release }}
          source-sha: ${{ needs.prep.outputs.published-source-sha }}
          github-token: ${{ github.token }}
          state: ${{ runner.temp }}/published-siteops

      - name: Prepare the published workspace project
        if: needs.prep.outputs.published-mode == 'true'
        shell: bash
        env:
          RELEASE: ${{ needs.prep.outputs.published-release }}
          SOURCE_SHA: ${{ needs.prep.outputs.published-source-sha }}
          PUBLISHED_JOURNEY: ${{ needs.prep.outputs.published-journey }}
        run: |
          set -euo pipefail
          umask 077
          project="$RUNNER_TEMP/published-project"
          cache="$RUNNER_TEMP/published-cache"
          gh_config="$RUNNER_TEMP/published-gh"
          mkdir "$project" "$gh_config"
          unset GH_TOKEN GITHUB_TOKEN GH_ENTERPRISE_TOKEN GITHUB_ENTERPRISE_TOKEN
          export SITEOPS_CACHE_DIR="$cache"
          export GH_CONFIG_DIR="$gh_config"
          trust_args=(--trust-policy "$SITEOPS_E2E_POLICY" --trusted-root "$SITEOPS_E2E_TRUSTED_ROOT")
          if [[ "$PUBLISHED_JOURNEY" == "guided" ]]; then
            export XDG_CONFIG_HOME="$RUNNER_TEMP/published-source-config"
            echo "XDG_CONFIG_HOME=$XDG_CONFIG_HOME" >> "$GITHUB_ENV"
            if ! siteops \
              --trust-policy "$SITEOPS_E2E_POLICY" \
              --trusted-root "$SITEOPS_E2E_TRUSTED_ROOT" \
              source enroll guided --source "github:$GITHUB_REPOSITORY" \
              > "$RUNNER_TEMP/published-source-enroll.log" \
              2> "$RUNNER_TEMP/published-source-enroll.err"; then
              echo "::error::The approved published source could not be enrolled."
              exit 1
            fi
            trust_args=(--approved-source guided)
          fi
          if ! SITEOPS_REDACT_OUTPUT=0 siteops \
            "${trust_args[@]}" \
            project pin "$project" \
            --source "github:$GITHUB_REPOSITORY" \
            --release "$RELEASE" \
            --release-workspace workspaces/iot-operations \
            > "$RUNNER_TEMP/published-project-pin.log" \
            2> "$RUNNER_TEMP/published-project-pin.err"; then
            echo "::error::The published workspace could not be pinned."
            exit 1
          fi
          if [[ -e "$project/sites" ]]; then
            echo "::error::Project pin created operator Site content."
            exit 1
          fi
          if ! SITEOPS_REDACT_OUTPUT=0 siteops project show "$project" --output json \
            > "$RUNNER_TEMP/published-project.json" \
            2> "$RUNNER_TEMP/published-project-show.err"; then
            echo "::error::The published workspace pin could not be inspected."
            exit 1
          fi
          python - "$RUNNER_TEMP/published-project.json" \
            "$RELEASE" "$SOURCE_SHA" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          pin = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          source = pin.get("source", {})
          content = pin.get("content", {})
          if (
              pin.get("kind") != "WorkspacePin"
              or source.get("provider") != "github-release/v1"
              or source.get("reference") != "github:" + os.environ["GITHUB_REPOSITORY"]
              or source.get("release") != sys.argv[2]
              or source.get("revision") != sys.argv[3]
              or content.get("workspace") != "workspaces/iot-operations"
              or content.get("package", {}).get("name") != "iot-operations.zip"
              or content.get("proof", {}).get("name")
              != "iot-operations.zip.attestation.jsonl"
          ):
              raise SystemExit("The project pin does not match the selected release.")
          PY
          {
            echo "SITEOPS_E2E_PROJECT=$project"
            echo "SITEOPS_CACHE_DIR=$cache"
            echo "GH_CONFIG_DIR=$gh_config"
          } >> "$GITHUB_ENV"

      - uses: ./.github/actions/create-k3s-cluster

      - uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Start OIDC token refresh service
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        # Background re-auth every 4 minutes keeps Azure CLI authenticated
        # during upgrade, inspection holds, and teardown. Same shape as the
        # loop in _siteops-deploy.yaml, but
        # the PID is not persisted because this runner is single-use: the loop
        # dies with the job and no explicit teardown is needed.
        run: |
          (
            while true; do
              sleep 240
              token=$(curl -sH "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
                "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=api://AzureADTokenExchange" | jq -r .value)
              if [[ -z "$token" || "$token" == "null" ]]; then
                echo "::warning::OIDC token refresh failed: could not obtain token"
                continue
              fi
              if az login --service-principal -u "$AZURE_CLIENT_ID" -t "$AZURE_TENANT_ID" \
                --federated-token "$token" --output none 2>&1; then
                echo "OIDC token refreshed successfully"
              else
                echo "::warning::OIDC token refresh failed: az login returned error"
              fi
            done
          ) &
          echo "OIDC token refresh service started (PID: $!)"

      - name: Validate Custom Locations RP object ID
        shell: bash
        env:
          CUSTOM_LOCATIONS_OID: ${{ inputs.custom-locations-oid != '' && inputs.custom-locations-oid || secrets.CUSTOM_LOCATIONS_OID }}
        run: |
          if [[ -z "$CUSTOM_LOCATIONS_OID" ]]; then
            echo "::error::Set the CUSTOM_LOCATIONS_OID environment secret or pass the custom-locations-oid workflow input."
            exit 1
          fi

      - name: Snapshot RG resources (persistent mode)
        if: env.PERSISTENT_RG == 'true'
        shell: bash
        env:
          RG: "${{ steps.names.outputs.rg }}"
        # Snapshot BEFORE any Azure-side creation (connect-arc, AIO deploy,
        # etc.) so every resource this run creates is in the teardown delta.
        # This keeps resources created by the run inside the teardown delta.
        # Atomic write guards against a truncated snapshot.
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/e2e-teardown"
          TMP="$RUNNER_TEMP/e2e-teardown/pre-ids.txt.partial"
          if ! az resource list -g "$RG" --query "[].id" -o tsv \
            > "$TMP" 2> "$RUNNER_TEMP/e2e-teardown/snapshot.err"; then
            echo "::error::The selected resource group snapshot could not be captured."
            exit 1
          fi
          mv "$TMP" "$RUNNER_TEMP/e2e-teardown/pre-ids.txt"
          count=$(wc -l < "$RUNNER_TEMP/e2e-teardown/pre-ids.txt")
          echo "Snapshot: $count pre-existing resource(s) will be preserved."

      - name: Create resource group (ephemeral mode)
        id: create-rg
        if: env.PERSISTENT_RG != 'true'
        shell: bash
        env:
          RG: ${{ steps.names.outputs.rg }}
          LOCATION: ${{ inputs.location }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        # Ownership tags are what the teardown guard verifies before
        # `az group delete`. run_id + run_attempt bind the tag set to THIS
        # specific workflow run so a pre-existing RG that happens to match
        # the name pattern cannot be deleted. Only an RG this run just
        # created can pass the guard.
        # Inputs are routed through env (not ${{ }} interpolated into the
        # shell line) so a workflow_dispatch input containing shell metachars
        # cannot break out of the command.
        run: |
          az group create \
            --name "$RG" \
            --location "$LOCATION" \
            -o none \
            --tags \
              managedBy=siteops-e2e \
              ephemeral=true \
              run_id="$RUN_ID" \
              run_attempt="$RUN_ATTEMPT"

      - name: Resolve E2E_LOCATION
        id: loc
        shell: bash
        env:
          AUTO_LOC: ${{ inputs.location }}
          RG: ${{ steps.names.outputs.rg }}
        # Persistent mode: the RG already has a region. Using the operator
        # input would create site/cluster/RG-region mismatches. Derive from
        # `az group show` to keep them aligned.
        run: |
          set -euo pipefail
          if [[ "$PERSISTENT_RG" == "true" ]]; then
            LOC=$(az group show --name "$RG" --query location -o tsv)
          else
            LOC="$AUTO_LOC"
          fi
          echo "location=$LOC" >> "$GITHUB_OUTPUT"

      - name: Render and plan the published-package operator Site
        if: needs.prep.outputs.published-mode == 'true' && needs.prep.outputs.published-journey == 'configured'
        shell: bash
        env:
          E2E_SITE_NAME: ${{ steps.names.outputs.site_name }}
          E2E_SUBSCRIPTION: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          E2E_RESOURCE_GROUP: ${{ steps.names.outputs.rg }}
          E2E_LOCATION: ${{ steps.loc.outputs.location }}
          E2E_CLUSTER_NAME: ${{ steps.names.outputs.cluster }}
          E2E_AIO_RELEASE: ${{ matrix.aio-release }}
          E2E_ENABLE_SECRET_SYNC: ${{ matrix.secret-sync-mode == 'enabled' && 'true' || 'false' }}
        run: |
          set -euo pipefail
          mkdir "$SITEOPS_E2E_PROJECT/sites"
          python scripts/render-e2e-site.py \
            --template tests/e2e/sites/e2e-published.yaml.tmpl \
            --output-dir "$SITEOPS_E2E_PROJECT/sites"
          site="$SITEOPS_E2E_PROJECT/sites/$E2E_SITE_NAME.yaml"
          site_before="$(sha256sum "$site" | cut -d ' ' -f 1)"
          if ! siteops \
            --project "$SITEOPS_E2E_PROJECT" \
            --trust-policy "$SITEOPS_E2E_POLICY" \
            --trusted-root "$SITEOPS_E2E_TRUSTED_ROOT" \
            validate aio-install \
            --plan \
            --offline \
            -l "name=$E2E_SITE_NAME" \
            --output json \
            > "$RUNNER_TEMP/published-plan-output.txt" \
            2> "$RUNNER_TEMP/published-plan.err"; then
            echo "::error::The published package cannot prepare the selected AIO install."
            cat "$RUNNER_TEMP/published-plan.err"
            exit 1
          fi
          site_after="$(sha256sum "$site" | cut -d ' ' -f 1)"
          if [[ "$site_before" != "$site_after" ]]; then
            echo "::error::Published package planning changed the operator Site."
            exit 1
          fi
          python - "$RUNNER_TEMP/published-plan-output.txt" \
            "$SITEOPS_E2E_ENGINE_VERSION" <<'PY'
          import json
          import sys
          from pathlib import Path

          raw = Path(sys.argv[1]).read_text(encoding="utf-8")
          start = raw.find("{")
          if start < 0:
              raise SystemExit("The published package returned no plan result.")
          result = json.loads(raw[start:])
          summary = result.get("summary", {})
          if (
              result.get("apiVersion") != "siteops/v1alpha1"
              or result.get("kind") != "DeploymentPlan"
              or result.get("status") != "planned"
              or result.get("executable") is not False
              or result.get("engine", {}).get("version") != sys.argv[2]
              or summary.get("targetCount") != 1
              or summary.get("operationCount") != 9
          ):
              raise SystemExit("The published package plan is incomplete.")
          PY

      - name: Preflight Arc cluster name is unused (persistent mode)
        if: env.PERSISTENT_RG == 'true'
        shell: bash
        env:
          RG: ${{ steps.names.outputs.rg }}
          CLUSTER: ${{ steps.names.outputs.cluster }}
        # Persistent mode still uses a fresh k3s on this runner. `connect-arc`
        # registers it as a NEW Arc resource. An existing connectedClusters
        # record cannot be reused (it's bound to a different k8s instance),
        # so fail fast here with an actionable message instead of letting
        # `az connectedk8s connect` error out opaquely.
        run: |
          set -euo pipefail
          umask 077
          az extension add --name connectedk8s --upgrade --yes --only-show-errors
          if ! COUNT=$(az connectedk8s list -g "$RG" \
            --query "length([?name=='$CLUSTER'])" -o tsv \
            2> "$RUNNER_TEMP/published-arc-preflight.err"); then
            echo "::error::The Arc cluster registration could not be checked."
            exit 1
          fi
          if [[ "$COUNT" != "0" ]]; then
            echo "::error::An Arc cluster registration already exists under the selected name. This workflow requires a new registration. Choose an unused cluster name."
            exit 1
          fi

      - uses: ./.github/actions/connect-arc
        with:
          cluster-name: ${{ steps.names.outputs.cluster }}
          resource-group: ${{ steps.names.outputs.rg }}
          location: ${{ steps.loc.outputs.location }}
          custom-locations-oid: ${{ inputs.custom-locations-oid != '' && inputs.custom-locations-oid || secrets.CUSTOM_LOCATIONS_OID }}
          private-provider-errors: ${{ needs.prep.outputs.published-mode }}
          # Secret Sync requires OIDC issuer and workload identity, so one
          # matrix axis intentionally controls all three settings.
          enable-workload-identity: ${{ matrix.secret-sync-mode == 'enabled' && 'true' || 'false' }}

      - name: Prepare guided AIO answers and plan
        if: needs.prep.outputs.published-mode == 'true' && needs.prep.outputs.published-journey == 'guided'
        shell: bash
        env:
          E2E_SITE_NAME: ${{ steps.names.outputs.site_name }}
          E2E_SUBSCRIPTION: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          E2E_RESOURCE_GROUP: ${{ steps.names.outputs.rg }}
          E2E_CLUSTER_NAME: ${{ steps.names.outputs.cluster }}
          E2E_AIO_RELEASE: ${{ matrix.aio-release }}
          E2E_ENABLE_SECRET_SYNC: ${{ matrix.secret-sync-mode == 'enabled' && 'true' || 'false' }}
        run: |
          set -euo pipefail
          umask 077
          if [[ -e "$SITEOPS_E2E_PROJECT/sites" ]]; then
            echo "::error::Guided package use must not require configured Sites."
            exit 1
          fi
          cluster_id="/subscriptions/$E2E_SUBSCRIPTION/resourceGroups/$E2E_RESOURCE_GROUP/providers/Microsoft.Kubernetes/connectedClusters/$E2E_CLUSTER_NAME"
          for value in "$E2E_SUBSCRIPTION" "$E2E_RESOURCE_GROUP" "$E2E_CLUSTER_NAME" "$cluster_id"; do
            echo "::add-mask::$value"
          done
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          answer_file = Path(os.environ["RUNNER_TEMP"]) / "published-answers.json"
          values = {
              "siteName": os.environ["E2E_SITE_NAME"],
              "subscription": None, "resourceGroup": None, "location": None,
              "clusterName": None,
              "environment": "e2e", "country": "US",
              "aioRelease": os.environ["E2E_AIO_RELEASE"],
              "enableSecretSync": os.environ["E2E_ENABLE_SECRET_SYNC"] == "true",
              "brokerMemoryProfile": "Low",
              "cluster": (
                  "/subscriptions/" + os.environ["E2E_SUBSCRIPTION"] +
                  "/resourceGroups/" + os.environ["E2E_RESOURCE_GROUP"] +
                  "/providers/Microsoft.Kubernetes/connectedClusters/" +
                  os.environ["E2E_CLUSTER_NAME"]
              ),
          }
          document = {
              "apiVersion": "siteops.inputs/v1", "kind": "SiteInputValues",
              "values": values,
          }
          fd = os.open(answer_file, os.O_CREAT | os.O_EXCL | os.O_WRONLY, 0o600)
          with os.fdopen(fd, "w", encoding="utf-8") as stream:
              json.dump(document, stream, sort_keys=True)
          PY
          if ! siteops \
            --project "$SITEOPS_E2E_PROJECT" \
            --approved-source guided \
            inputs aio-install --offline --example "$RUNNER_TEMP/published-example.yaml" \
            --output json > "$RUNNER_TEMP/published-inspection.json" \
            2> "$RUNNER_TEMP/published-inspection.err"; then
            echo "::error::Guided input inspection failed."
            exit 1
          fi
          if siteops \
            --project "$SITEOPS_E2E_PROJECT" \
            --approved-source guided \
            plan aio-install --offline --input-file "$RUNNER_TEMP/published-answers.json" \
            --output json > "$RUNNER_TEMP/published-no-read.json" \
            2> "$RUNNER_TEMP/published-no-read.err"; then
            echo "::error::A resource ID was accepted without --read-resources."
            exit 1
          fi
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"])
          inspection = json.loads((root / "published-inspection.json").read_text(encoding="utf-8"))
          example = (root / "published-example.yaml").read_text(encoding="utf-8")
          rejected = json.loads((root / "published-no-read.json").read_text(encoding="utf-8"))
          fields = {row["name"]: row for row in inspection["inputs"]}
          if (
              inspection.get("kind") != "SiteInputContract"
              or fields.get("cluster", {}).get("type") != "azureResourceId"
              or fields.get("location", {}).get("derivableFrom") != ["cluster"]
              or "siteName: null" not in example
              or rejected.get("status") != "invalid"
              or rejected.get("diagnostics", [{}])[0].get("code") != "inputs.resource.read-required"
          ):
              raise SystemExit("Guided input inspection or no-read admission failed.")
          PY
          if [[ "$E2E_ENABLE_SECRET_SYNC" == "false" ]]; then
            python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          document = json.loads((root / "published-answers.json").read_text(encoding="utf-8"))
          document["values"]["enableSecretSync"] = True
          destination = root / "published-unready-answers.json"
          fd = os.open(destination, os.O_CREAT | os.O_EXCL | os.O_WRONLY, 0o600)
          with os.fdopen(fd, "w", encoding="utf-8") as stream:
              json.dump(document, stream, sort_keys=True)
          PY
            az deployment group list -g "$E2E_RESOURCE_GROUP" --query '[].name' -o json \
              > "$RUNNER_TEMP/published-before-negative.json"
            if siteops \
              --project "$SITEOPS_E2E_PROJECT" \
              --approved-source guided \
              deploy aio-install --offline \
              --input-file "$RUNNER_TEMP/published-unready-answers.json" \
              --read-resources --output json \
              > "$RUNNER_TEMP/published-unready-run.json" \
              2> "$RUNNER_TEMP/published-unready-run.err"; then
              echo "::error::Guided Secret Sync ran without the cluster prerequisites."
              exit 1
            fi
            az deployment group list -g "$E2E_RESOURCE_GROUP" --query '[].name' -o json \
              > "$RUNNER_TEMP/published-after-negative.json"
            python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          failed = json.loads((root / "published-unready-run.json").read_text(encoding="utf-8"))
          before = json.loads((root / "published-before-negative.json").read_text(encoding="utf-8"))
          after = json.loads((root / "published-after-negative.json").read_text(encoding="utf-8"))
          if (
              failed.get("diagnostics", [{}])[0].get("code") != "inputs.resource.requirement-unmet"
              or sorted(before) != sorted(after)
          ):
              raise SystemExit("Guided Secret Sync prerequisite failure changed Azure deployments.")
          PY
          fi
          if ! SITEOPS_REDACT_OUTPUT=0 siteops \
            --project "$SITEOPS_E2E_PROJECT" \
            --approved-source guided \
            plan aio-install --offline \
            --input-file "$RUNNER_TEMP/published-answers.json" \
            --read-resources --output json --projection local-private \
            > "$RUNNER_TEMP/published-guided-plan.json" \
            2> "$RUNNER_TEMP/published-guided-plan.err"; then
            echo "::error::The installed engine could not prepare guided AIO."
            exit 1
          fi
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          raw = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "published-guided-plan.json").read_text(
                  encoding="utf-8"
              )
          )
          enabled = os.environ["E2E_ENABLE_SECRET_SYNC"] == "true"
          plan = raw.get("plan") or {}
          targets = plan.get("targets", [])
          expected_steps = {
              "global-edge-site": "skip", "edge-site": "skip",
              "schema-registry": "execute", "adr-ns": "execute",
              "aio-enablement": "execute", "aio-instance": "execute",
              "schema-registry-role": "execute",
              "resolve-aio": "execute" if enabled else "skip",
              "secretsync": "execute" if enabled else "skip",
          }
          actual = (
              {item["identity"]["step"]: item["disposition"]
               for item in targets[0]["operations"]}
              if len(targets) == 1 else {}
          )
          if (
              raw.get("status") != "planned"
              or raw.get("executable") is not True
              or raw.get("engine", {}).get("version") != os.environ["SITEOPS_E2E_ENGINE_VERSION"]
              or plan.get("manifest", {}).get("targetSelection") != "explicit-site"
              or plan.get("submission", {}).get("mode") != "arm-json"
              or plan.get("submission", {}).get("compilationBinding") != "package-artifact"
              or actual != expected_steps
          ):
              raise SystemExit("Guided installed AIO plan has unexpected operations.")
          PY

      - name: Check published guided disabled Site routes
        if: needs.prep.outputs.published-mode == 'true' && needs.prep.outputs.published-journey == 'guided' && matrix.secret-sync-mode == 'disabled'
        shell: bash
        env:
          E2E_SITE_NAME: ${{ steps.names.outputs.site_name }}
          E2E_SUBSCRIPTION: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          E2E_RESOURCE_GROUP: ${{ steps.names.outputs.rg }}
          E2E_LOCATION: ${{ steps.loc.outputs.location }}
          E2E_CLUSTER_NAME: ${{ steps.names.outputs.cluster }}
          E2E_AIO_RELEASE: ${{ matrix.aio-release }}
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"])
          source = json.loads((root / "published-answers.json").read_text(encoding="utf-8"))
          values = source.get("values")
          if (
              source.get("apiVersion") != "siteops.inputs/v1"
              or source.get("kind") != "SiteInputValues"
              or not isinstance(values, dict)
              or values.get("enableSecretSync") is not False
              or not values.get("cluster")
          ):
              raise SystemExit("Guided disabled answers are invalid.")
          manual = {
              **values,
              "subscription": os.environ["E2E_SUBSCRIPTION"],
              "resourceGroup": os.environ["E2E_RESOURCE_GROUP"],
              "location": os.environ["E2E_LOCATION"],
              "clusterName": os.environ["E2E_CLUSTER_NAME"],
              "cluster": None,
          }
          destination = root / "published-manual-answers.json"
          fd = os.open(destination, os.O_CREAT | os.O_EXCL | os.O_WRONLY, 0o600)
          with os.fdopen(fd, "w", encoding="utf-8") as stream:
              json.dump({**source, "values": manual}, stream, sort_keys=True)
          PY
          if ! SITEOPS_REDACT_OUTPUT=0 siteops \
            --project "$SITEOPS_E2E_PROJECT" --approved-source guided \
            plan aio-install --offline \
            --input-file "$RUNNER_TEMP/published-manual-answers.json" \
            --output json --projection local-private \
            > "$RUNNER_TEMP/published-manual-plan.json" \
            2> "$RUNNER_TEMP/published-manual-plan.err"; then
            echo "::error::The published guided manual plan failed."
            exit 1
          fi
          if ! SITEOPS_REDACT_OUTPUT=0 siteops \
            --project "$SITEOPS_E2E_PROJECT" --approved-source guided \
            plan aio-install --offline \
            --input "siteName=$E2E_SITE_NAME" \
            --input "subscription=$E2E_SUBSCRIPTION" \
            --input "resourceGroup=$E2E_RESOURCE_GROUP" \
            --input "location=$E2E_LOCATION" \
            --input "clusterName=$E2E_CLUSTER_NAME" \
            --input environment=e2e --input country=US \
            --input "aioRelease=$E2E_AIO_RELEASE" \
            --input brokerMemoryProfile=Low --input enableSecretSync=false \
            --output json --projection local-private \
            > "$RUNNER_TEMP/published-inline-plan.json" \
            2> "$RUNNER_TEMP/published-inline-plan.err"; then
            echo "::error::The published guided inline plan failed."
            exit 1
          fi
          mkdir "$SITEOPS_E2E_PROJECT/sites"
          site="$SITEOPS_E2E_PROJECT/sites/$E2E_SITE_NAME.yaml"
          if ! siteops \
            --project "$SITEOPS_E2E_PROJECT" --approved-source guided \
            inputs aio-install --offline \
            --input-file "$RUNNER_TEMP/published-manual-answers.json" \
            --save-site "$site" \
            > "$RUNNER_TEMP/published-saved-site.txt" \
            2> "$RUNNER_TEMP/published-saved-site.err"; then
            echo "::error::The published guided Site could not be saved."
            exit 1
          fi
          site_before="$(sha256sum "$site" | cut -d ' ' -f 1)"
          if ! SITEOPS_REDACT_OUTPUT=0 siteops \
            --project "$SITEOPS_E2E_PROJECT" --approved-source guided \
            plan aio-install --offline -l "name=$E2E_SITE_NAME" \
            --output json --projection local-private \
            > "$RUNNER_TEMP/published-configured-plan.json" \
            2> "$RUNNER_TEMP/published-configured-plan.err"; then
            echo "::error::The published configured Site plan failed."
            exit 1
          fi
          site_after="$(sha256sum "$site" | cut -d ' ' -f 1)"
          if [[ "$site_before" != "$site_after" ]]; then
            echo "::error::Published planning changed the configured Site."
            exit 1
          fi
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"])
          site = os.environ["E2E_SITE_NAME"]
          version = os.environ["SITEOPS_E2E_ENGINE_VERSION"]

          def shape(filename, *, configured=False):
              raw = json.loads((root / filename).read_text(encoding="utf-8"))
              plan = raw["plan"]
              manifest = plan["manifest"]
              targets = plan["targets"]
              if configured:
                  selection_matches = (
                      manifest.get("cliSelector") == f"name={site}"
                      and manifest.get("targetSelection") is None
                  )
              else:
                  selection_matches = (
                      manifest.get("cliSelector") is None
                      and manifest.get("targetSelection") == "explicit-site"
                  )
              if (
                  raw.get("apiVersion") != "siteops/v1alpha1"
                  or raw.get("kind") != "DeploymentPlan"
                  or raw.get("status") != "planned"
                  or raw.get("executable") is not True
                  or raw.get("engine", {}).get("version") != version
                  or raw.get("summary", {}).get("targetCount") != 1
                  or len(targets) != 1
                  or targets[0]["name"] != site
                  or plan["submission"] != {
                      "mode": "arm-json", "compilationBinding": "package-artifact"
                  }
                  or not selection_matches
              ):
                  raise ValueError("Plan shape differs.")
              operations = targets[0]["operations"]
              if len(operations) != 9 or raw["summary"]["operationCount"] != len(operations):
                  raise ValueError("Operation count differs.")
              target = targets[0]
              identity = tuple(
                  target[key] for key in (
                      "name", "kind", "subscription", "resourceGroup", "location"
                  )
              )
              steps = tuple(
                  (
                      item["identity"]["target"], item["identity"]["step"],
                      item["kind"], item["scope"], item["disposition"]
                  )
                  for item in operations
              )
              if any(not isinstance(value, str) or not value for value in identity):
                  raise ValueError("Target identity is incomplete.")
              return identity, steps

          try:
              expected_target, expected_operations = shape("published-guided-plan.json")
              for filename, configured in (
                  ("published-manual-plan.json", False),
                  ("published-inline-plan.json", False),
                  ("published-configured-plan.json", True),
              ):
                  target, operations = shape(filename, configured=configured)
                  if target != expected_target or operations != expected_operations:
                      raise ValueError("Selected operations differ.")
          except (OSError, ValueError, KeyError, TypeError, IndexError):
              raise SystemExit("Published guided disabled Site controls differ.") from None
          PY

      - name: Check for kubectl manifest steps
        id: rbac-check
        if: needs.prep.outputs.published-mode != 'true'
        shell: bash
        # Any `type: kubectl` step in the workspace will dispatch through the
        # Arc proxy and need namespace RBAC for the workflow SP. Skip the
        # binding when no such step exists. Walks manifests/ and samples/
        # since either can declare kubectl steps.
        run: |
          set -euo pipefail
          if grep -rqE '^\s*type:\s*kubectl\s*$' workspaces/*/manifests/ workspaces/*/samples/ 2>/dev/null; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "needed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Grant SP namespace-admin on azure-iot-operations (e2e bootstrap)
        if: steps.rbac-check.outputs.needed == 'true'
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_OID: ${{ secrets.AZURE_CLIENT_OID }}
        # kubectl steps that go through the Arc proxy authenticate as the
        # workflow SP. k3s has no record of that identity, so bind it to
        # namespace-admin on azure-iot-operations via the runner's local
        # kubeconfig before siteops runs. Provide AZURE_CLIENT_OID as a
        # secret to skip the Graph lookup (some SPs lack Directory.Read).
        # Idempotent across reruns.
        run: |
          set -euo pipefail
          if [[ -n "$AZURE_CLIENT_OID" ]]; then
            SP_OID="$AZURE_CLIENT_OID"
          else
            echo "AZURE_CLIENT_OID not set, falling back to Graph lookup."
            SP_OID=$(az ad sp show --id "$AZURE_CLIENT_ID" --query id -o tsv 2>/dev/null || true)
            if [[ -z "$SP_OID" ]]; then
              echo "::error::Could not resolve SP object ID. Set AZURE_CLIENT_OID secret to the SP's object ID, or grant the SP Directory.Read.All on Microsoft Graph."
              exit 1
            fi
          fi
          # Mask the SP object id so every later step prints it as ***.
          echo "::add-mask::$SP_OID"
          kubectl create namespace azure-iot-operations \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl create rolebinding e2e-sp-admin \
            --clusterrole=admin \
            --user="$SP_OID" \
            --namespace=azure-iot-operations \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Grant debug user cluster-admin on k3s (Arc proxy access)
        if: env.DEBUG_USER_OID != ''
        shell: bash
        # Bind a human user (or group) to cluster-admin so they can inspect
        # the k3s cluster via `az connectedk8s proxy`. Cluster-admin is
        # appropriate for live debugging because the cluster is ephemeral. Set the
        # DEBUG_USER_OID secret to enable.
        run: |
          set -euo pipefail
          kubectl create clusterrolebinding e2e-debug-admin \
            --clusterrole=cluster-admin \
            --user="$DEBUG_USER_OID" \
            --dry-run=client -o yaml | kubectl apply -f -

      - uses: ./.github/actions/setup-siteops
        if: needs.prep.outputs.published-mode != 'true'
        with:
          install-dev: "true"

      - name: Render E2E site
        if: needs.prep.outputs.published-mode != 'true'
        shell: bash
        env:
          E2E_SITE_NAME: ${{ steps.names.outputs.site_name }}
          E2E_SUBSCRIPTION: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          E2E_RESOURCE_GROUP: ${{ steps.names.outputs.rg }}
          E2E_LOCATION: ${{ steps.loc.outputs.location }}
          E2E_CLUSTER_NAME: ${{ steps.names.outputs.cluster }}
          E2E_AIO_RELEASE: ${{ matrix.aio-release }}
          E2E_ENABLE_SECRET_SYNC: ${{ matrix.secret-sync-mode == 'enabled' && 'true' || 'false' }}
        run: |
          set -euo pipefail
          python scripts/render-e2e-site.py \
            --template tests/e2e/sites/e2e-test.yaml.tmpl \
            --output-dir "$RUNNER_TEMP/e2e-sites"
          # Job logs are public. The structure is what makes a render debuggable
          # (inherits resolution, deployOptions, resourceSets), so the four
          # fields the template fills from the environment are masked and the
          # rest is printed as-is.
          echo "::group::Rendered site (identifying values masked)"
          sed -E 's/^([[:space:]]*(subscription|resourceGroup|location|clusterName)):.*/\1: <masked>/' \
            "$RUNNER_TEMP/e2e-sites/${E2E_SITE_NAME}.yaml"
          echo "::endgroup::"

      - name: Run E2E integration tests
        if: needs.prep.outputs.published-mode != 'true'
        shell: bash
        env:
          SITEOPS_EXTRA_SITES_DIRS: ${{ runner.temp }}/e2e-sites
          INTEGRATION_SELECTOR: name=${{ steps.names.outputs.site_name }}
          AIO_RELEASE: ${{ matrix.aio-release }}
          SECRET_SYNC_MODE: ${{ matrix.secret-sync-mode }}
          PYTEST_PATHS: ${{ needs.prep.outputs.pytest-paths }}
          SITEOPS_E2E_ISOLATE_DATAFLOW_SAMPLE: ${{ needs.prep.outputs.isolate-dataflow-sample }}
          # Test helpers (tests/integration/helpers/kube.py) read this env
          # var and pass --kubeconfig=<path> to every kubectl invocation.
          # This isolates direct-kubectl reads from siteops's writable
          # ~/.kube/config, which the orchestrator's `arc:` kubectl steps
          # mutate via `az connectedk8s proxy`. Without this, every
          # cluster-touching test would hit the dead proxy URL left in
          # ~/.kube/config after each deploy step exits. The k3s admin
          # file is created with mode 0644 by create-k3s-cluster.
          SITEOPS_TEST_KUBECONFIG: /etc/rancher/k3s/k3s.yaml
        # AIO_RELEASE is routed through env (not ${{ }} interpolated into the
        # shell line) so a workflow_dispatch input containing shell metachars
        # cannot break out of the command. PYTEST_PATHS comes from prep, which
        # validated it against a known test-phase allowlist.
        run: |
          set -euo pipefail
          pytest $PYTEST_PATHS -v -m integration --tb=long \
            --junitxml="e2e-results-${AIO_RELEASE}-secretsync-${SECRET_SYNC_MODE}.xml"

      - name: Deploy AIO through the published engine and package
        if: needs.prep.outputs.published-mode == 'true'
        shell: bash
        env:
          RELEASE: ${{ needs.prep.outputs.published-release }}
          SOURCE_SHA: ${{ needs.prep.outputs.published-source-sha }}
          SITE_NAME: ${{ steps.names.outputs.site_name }}
          E2E_JOURNEY: ${{ needs.prep.outputs.published-journey }}
        run: |
          set -euo pipefail
          run_root="$RUNNER_TEMP/published-run"
          mkdir "$run_root"
          cd "$run_root"
          target_args=(-l "name=$SITE_NAME")
          trust_args=(--trust-policy "$SITEOPS_E2E_POLICY" --trusted-root "$SITEOPS_E2E_TRUSTED_ROOT")
          if [[ "$PUBLISHED_JOURNEY" == "guided" ]]; then
            target_args=(--input-file "$RUNNER_TEMP/published-answers.json" --read-resources)
            trust_args=(--approved-source guided)
          fi
          if ! siteops \
            --project "$SITEOPS_E2E_PROJECT" \
            "${trust_args[@]}" \
            deploy aio-install \
            --offline \
            "${target_args[@]}" \
            --output json \
            > "$RUNNER_TEMP/published-deploy-output.txt" \
            2> "$RUNNER_TEMP/published-deploy-output.err"; then
            echo "::error::The published Site Ops deployment failed."
            exit 1
          fi
          python - "$RUNNER_TEMP/published-deploy-output.txt" \
            "$RUNNER_TEMP/published-deployment.json" \
            "$RELEASE" "$SOURCE_SHA" "$SITEOPS_E2E_ENGINE_VERSION" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          raw = Path(sys.argv[1]).read_text(encoding="utf-8")
          start = raw.find("{")
          if start < 0:
              raise SystemExit("The published deployment returned no JSON result.")
          result = json.loads(raw[start:])
          summary = result.get("summary", {})
          sites = summary.get("sites", {})
          operations = summary.get("operations", {})
          site_counts = sites.get("counts", {})
          operation_counts = operations.get("counts", {})
          if (
              result.get("apiVersion") != "siteops/v1alpha1"
              or result.get("kind") != "DeploymentRun"
              or result.get("projection") != "publishable"
              or result.get("status") != "succeeded"
              or result.get("exitCode") != 0
              or result.get("engine", {}).get("version") != sys.argv[5]
              or type(sites.get("total")) is not int
              or sites["total"] != 1
              or site_counts.get("succeeded") != 1
              or type(operations.get("total")) is not int
              or operations["total"] < 1
              or type(operation_counts.get("succeeded")) is not int
              or operation_counts["succeeded"] < 1
              or (
                  os.environ.get("E2E_JOURNEY") == "guided"
                  and result.get("assessments") != {
                      "readiness": "not-assessed", "functionality": "not-assessed"
                  }
              )
          ):
              raise SystemExit("The published deployment result is incomplete.")
          receipt = {
              "apiVersion": "siteops.e2e/v1",
              "kind": "PublishedPackageDeployment",
              "release": sys.argv[3],
              "sourceSha": sys.argv[4],
              "engineVersion": sys.argv[5],
              "siteCount": sites["total"],
              "operationCount": operations["total"],
              "succeededOperations": operation_counts["succeeded"],
              "status": result["status"],
          }
          Path(sys.argv[2]).write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Observe bounded AIO readiness
        if: needs.prep.outputs.published-mode == 'true'
        shell: bash
        env:
          RG: ${{ steps.names.outputs.rg }}
          E2E_JOURNEY: ${{ needs.prep.outputs.published-journey }}
          E2E_ENABLE_SECRET_SYNC: ${{ matrix.secret-sync-mode == 'enabled' && 'true' || 'false' }}
        run: |
          set -euo pipefail
          umask 077
          az resource list --resource-group "$RG" --output json \
            > "$RUNNER_TEMP/published-resources.json"
          if [[ "$E2E_JOURNEY" == "guided" ]]; then
            # Parse inputs requires an existing RG for published guided runs.
            # The persistent snapshot precedes Arc connection. Missing state stays fatal.
            python3 - \
              "$RUNNER_TEMP/published-resources.json" \
              "$RUNNER_TEMP/e2e-teardown/pre-ids.txt" \
              "$RUNNER_TEMP/published-owned-resources.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          try:
              resources = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          except (OSError, UnicodeError, ValueError):
              raise SystemExit("Azure resource observation is invalid.") from None
          try:
              prior_ids = {
                  line.strip().rstrip("/").casefold()
                  for line in Path(sys.argv[2]).read_text(encoding="utf-8").splitlines()
                  if line.strip()
              }
          except (OSError, UnicodeError):
              raise SystemExit("Published guided ownership snapshot is unavailable.") from None
          if not isinstance(resources, list):
              raise SystemExit("Azure resource observation is invalid.")
          owned = []
          for resource in resources:
              if not isinstance(resource, dict) or any(
                  not isinstance(resource.get(key), str) or not resource[key]
                  for key in ("id", "name", "type")
              ):
                  raise SystemExit("Azure resource observation is invalid.")
              if resource["id"].rstrip("/").casefold() not in prior_ids:
                  owned.append({
                      "id": resource["id"], "name": resource.get("name"),
                      "type": resource.get("type"),
                  })
          try:
              Path(sys.argv[3]).write_text(json.dumps(owned), encoding="utf-8")
          except OSError:
              raise SystemExit("Published guided resource observation could not be stored.") from None
          PY
          fi
          ready=false
          for _ in {1..60}; do
            kubectl get pods --namespace azure-iot-operations --output json \
              > "$RUNNER_TEMP/published-pods.json"
            if ! kubectl get instance.iotoperations.azure.com \
              --namespace azure-iot-operations --output json \
              > "$RUNNER_TEMP/published-instances.json" 2> /dev/null; then
              printf '{"items":[]}\n' > "$RUNNER_TEMP/published-instances.json"
            fi
            if python - \
              "$RUNNER_TEMP/published-pods.json" \
              "$RUNNER_TEMP/published-instances.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          pods = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          instances = json.loads(Path(sys.argv[2]).read_text(encoding="utf-8"))
          if not instances.get("items"):
              raise SystemExit(1)
          for pod in pods.get("items", []):
              status = pod.get("status", {})
              conditions = status.get("conditions", [])
              if status.get("phase") == "Running" and any(
                  condition.get("type") == "Ready"
                  and condition.get("status") == "True"
                  for condition in conditions
                  if isinstance(condition, dict)
              ):
                  raise SystemExit(0)
          raise SystemExit(1)
          PY
            then
              ready=true
              break
            fi
            sleep 5
          done
          if [[ "$ready" != "true" ]]; then
            echo "::error::AIO instance projection and operator readiness did not converge within five minutes."
            exit 1
          fi
          if [[ "$E2E_JOURNEY" == "guided" && "$E2E_ENABLE_SECRET_SYNC" == "true" ]]; then
            mapfile -t secret_resources < <(python3 - "$RUNNER_TEMP/published-owned-resources.json" <<'PY'
          import json
          import sys
          from pathlib import Path
          owned = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          for resource_type in (
              "microsoft.managedidentity/userassignedidentities",
              "microsoft.iotoperations/instances",
          ):
              matching = [
                  item for item in owned
                  if item.get("type", "").lower() == resource_type
              ]
              if len(matching) != 1:
                  label = (
                      "managed identity"
                      if resource_type.startswith("microsoft.managedidentity/")
                      else "AIO instance"
                  )
                  raise SystemExit(f"Guided Secret Sync {label} selection is incomplete.")
              print(matching[0]["name"] if resource_type.startswith("microsoft.managedidentity")
                    else matching[0]["id"])
          PY
            )
            if [[ "${#secret_resources[@]}" -ne 2 ]]; then
              echo "::error::Guided Secret Sync resources could not be selected."
              exit 1
            fi
            az identity federated-credential list -g "$RG" \
              --identity-name "${secret_resources[0]}" --only-show-errors -o json \
              > "$RUNNER_TEMP/published-federated.json" \
              2> "$RUNNER_TEMP/published-federated.err"
            az resource show --ids "${secret_resources[1]}" \
              --api-version 2026-07-01 \
              --only-show-errors -o json \
              > "$RUNNER_TEMP/published-aio-instance.json" \
              2> "$RUNNER_TEMP/published-aio-instance.err"
          fi
          python - \
            "$RUNNER_TEMP/published-resources.json" \
            "$RUNNER_TEMP/published-pods.json" \
            "$RUNNER_TEMP/published-instances.json" \
            "$RUNNER_TEMP/published-readiness.json" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          resources = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          pods = json.loads(Path(sys.argv[2]).read_text(encoding="utf-8"))
          instances = json.loads(Path(sys.argv[3]).read_text(encoding="utf-8"))
          if not isinstance(resources, list):
              raise SystemExit("Azure resource observation is invalid.")
          types = [
              item.get("type", "").lower()
              for item in resources
              if isinstance(item, dict)
          ]
          instance_count = types.count("microsoft.iotoperations/instances")
          schema_count = types.count("microsoft.deviceregistry/schemaregistries")
          namespace_count = types.count("microsoft.deviceregistry/namespaces")
          pod_count = len(pods.get("items", []))
          ready_pod_count = sum(
              pod.get("status", {}).get("phase") == "Running"
              and any(
                  condition.get("type") == "Ready"
                  and condition.get("status") == "True"
                  for condition in pod.get("status", {}).get("conditions", [])
                  if isinstance(condition, dict)
              )
              for pod in pods.get("items", [])
              if isinstance(pod, dict)
          )
          custom_resource_count = len(instances.get("items", []))
          if min(
              instance_count,
              schema_count,
              namespace_count,
              pod_count,
              ready_pod_count,
              custom_resource_count,
          ) < 1:
              raise SystemExit("The bounded AIO readiness observations are incomplete.")
          receipt = {
              "apiVersion": "siteops.e2e/v1",
              "kind": "PublishedPackageReadiness",
              "aioInstances": instance_count,
              "schemaRegistries": schema_count,
              "deviceRegistryNamespaces": namespace_count,
              "namespacePods": pod_count,
              "readyOperatorPods": ready_pod_count,
              "instanceCustomResources": custom_resource_count,
          }
          if os.environ["E2E_JOURNEY"] == "guided":
              owned = json.loads(
                  (Path(os.environ["RUNNER_TEMP"]) / "published-owned-resources.json")
                  .read_text(encoding="utf-8")
              )
              if not isinstance(owned, list):
                  raise SystemExit("Published guided resource observation is invalid.")
              owned_types = [item.get("type", "").lower() for item in owned]
              spcs = [
                  item for item in owned
                  if item.get("type", "").lower()
                  == "microsoft.secretsynccontroller/azurekeyvaultsecretproviderclasses"
              ]
              identities = owned_types.count("microsoft.managedidentity/userassignedidentities")
              vaults = owned_types.count("microsoft.keyvault/vaults")
              enabled = os.environ["E2E_ENABLE_SECRET_SYNC"] == "true"
              if enabled:
                  root = Path(os.environ["RUNNER_TEMP"])
                  federated = json.loads(
                      (root / "published-federated.json").read_text(encoding="utf-8")
                  )
                  instance = json.loads(
                      (root / "published-aio-instance.json").read_text(encoding="utf-8")
                  )
                  reference = (
                      instance.get("properties", {})
                      .get("defaultSecretProviderClassRef", {})
                      .get("resourceId")
                  )
                  bound = (
                      len(spcs) == 1
                      and isinstance(reference, str)
                      and reference.casefold() == spcs[0].get("id", "").casefold()
                  )
                  if (
                      identities != 1 or vaults != 1 or not bound
                      or not isinstance(federated, list) or not federated
                  ):
                      raise SystemExit("Guided Secret Sync infrastructure observations failed.")
                  receipt.update({
                      "secretSyncEnabled": True,
                      "secretProviderClasses": len(spcs),
                      "managedIdentities": identities,
                      "keyVaults": vaults,
                      "federatedCredentials": len(federated),
                      "spcBoundToInstance": bound,
                  })
              else:
                  if spcs or identities or vaults:
                      raise SystemExit("Guided disabled path created Secret Sync resources.")
                  receipt["secretSyncEnabled"] = False
          Path(sys.argv[4]).write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && needs.prep.outputs.published-mode != 'true'
        with:
          name: e2e-results-${{ matrix.aio-release }}-secretsync-${{ matrix.secret-sync-mode }}
          path: e2e-results-${{ matrix.aio-release }}-secretsync-${{ matrix.secret-sync-mode }}.xml

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && needs.prep.outputs.published-mode == 'true'
        with:
          name: published-e2e-${{ matrix.aio-release }}-${{ matrix.secret-sync-mode }}-${{ needs.prep.outputs.published-journey }}
          path: |
            ${{ runner.temp }}/published-deployment.json
            ${{ runner.temp }}/published-readiness.json
          if-no-files-found: warn

      - name: Re-render E2E site at upgrade-to
        id: upgrade_render
        if: success() && needs.prep.outputs.upgrade-to != '' && needs.prep.outputs.upgrade-to != matrix.aio-release
        shell: bash
        env:
          E2E_SITE_NAME: ${{ steps.names.outputs.site_name }}
          E2E_SUBSCRIPTION: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          E2E_RESOURCE_GROUP: ${{ steps.names.outputs.rg }}
          E2E_LOCATION: ${{ steps.loc.outputs.location }}
          E2E_CLUSTER_NAME: ${{ steps.names.outputs.cluster }}
          E2E_AIO_RELEASE: ${{ needs.prep.outputs.upgrade-to }}
          E2E_ENABLE_SECRET_SYNC: ${{ matrix.secret-sync-mode == 'enabled' && 'true' || 'false' }}
        # Overwrites the rendered site at the same path (E2E_SITE_NAME is
        # unchanged) so SITEOPS_EXTRA_SITES_DIRS still resolves the same
        # site key but with the upgrade-to release pinned.
        run: |
          set -euo pipefail
          python scripts/render-e2e-site.py \
            --template tests/e2e/sites/e2e-test.yaml.tmpl \
            --output-dir "$RUNNER_TEMP/e2e-sites"
          echo "::group::Rendered site (upgrade-to ${E2E_AIO_RELEASE}, identifying values masked)"
          sed -E 's/^([[:space:]]*(subscription|resourceGroup|location|clusterName)):.*/\1: <masked>/' \
            "$RUNNER_TEMP/e2e-sites/${E2E_SITE_NAME}.yaml"
          echo "::endgroup::"

      - name: Run upgrade-phase integration tests
        if: success() && needs.prep.outputs.upgrade-to != '' && needs.prep.outputs.upgrade-to != matrix.aio-release
        shell: bash
        env:
          SITEOPS_EXTRA_SITES_DIRS: ${{ runner.temp }}/e2e-sites
          INTEGRATION_SELECTOR: name=${{ steps.names.outputs.site_name }}
          SITEOPS_E2E_UPGRADE_PHASE: "1"
          AIO_RELEASE_FROM: ${{ matrix.aio-release }}
          AIO_RELEASE_TO: ${{ needs.prep.outputs.upgrade-to }}
          SECRET_SYNC_MODE: ${{ matrix.secret-sync-mode }}
          PYTEST_PATHS: ${{ needs.prep.outputs.pytest-paths }}
          # See the comment on the prior "Run E2E integration tests" step.
          SITEOPS_TEST_KUBECONFIG: /etc/rancher/k3s/k3s.yaml
        # SITEOPS_E2E_UPGRADE_PHASE is the contract with conftest.py:
        #   - aio_install_result becomes a sentinel (re-running install on
        #     an existing instance at a new release is unsupported).
        #   - pytest_collection_modifyitems narrows the run to the upgrade
        #     test classes that operate purely on upgrade-step outputs.
        run: |
          set -euo pipefail
          pytest $PYTEST_PATHS -v -m integration --tb=long \
            --junitxml="e2e-results-${AIO_RELEASE_FROM}-to-${AIO_RELEASE_TO}-secretsync-${SECRET_SYNC_MODE}.xml"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && needs.prep.outputs.upgrade-to != '' && needs.prep.outputs.upgrade-to != matrix.aio-release
        with:
          name: e2e-results-${{ matrix.aio-release }}-to-${{ needs.prep.outputs.upgrade-to }}-secretsync-${{ matrix.secret-sync-mode }}
          path: e2e-results-${{ matrix.aio-release }}-to-${{ needs.prep.outputs.upgrade-to }}-secretsync-${{ matrix.secret-sync-mode }}.xml

      - name: Keep cluster alive (pre-teardown hold)
        if: always() && inputs.keep-cluster-alive-minutes > 0
        shell: bash
        env:
          HOLD_MIN: "${{ inputs.keep-cluster-alive-minutes }}"
          RG: "${{ steps.names.outputs.rg }}"
          CLUSTER: "${{ steps.names.outputs.cluster }}"
          JOB_START_EPOCH: "${{ steps.names.outputs.job_start_epoch }}"
          JOB_BUDGET_MIN: "${{ (inputs.keep-cluster-alive-minutes > 0 || inputs.upgrade-to != '') && 360 || 180 }}"
        # Sleep so the runner (and its k3s cluster + Arc connection) remain
        # reachable for interactive debugging before teardown. The hold is
        # capped by what is left of the job budget, not by a fixed ceiling: a
        # hold that outlasts the budget is cancelled mid-sleep, which skips
        # teardown and leaks the resource group. Cancel the run to exit early,
        # since teardown still runs via `if: always()`.
        run: |
          set -euo pipefail
          RESERVE_MIN=20
          ELAPSED_MIN=$(( ( $(date +%s) - JOB_START_EPOCH ) / 60 ))
          REMAINING_MIN=$(( JOB_BUDGET_MIN - ELAPSED_MIN - RESERVE_MIN ))
          MINS=$HOLD_MIN
          if (( MINS > REMAINING_MIN )); then
            echo "::warning::Requested ${MINS}m hold exceeds the ${REMAINING_MIN}m left in the job budget after ${ELAPSED_MIN}m elapsed. Holding ${REMAINING_MIN}m so teardown still runs."
            MINS=$REMAINING_MIN
          fi
          if (( MINS <= 0 )); then
            echo "::warning::No budget left to hold after ${ELAPSED_MIN}m elapsed. Proceeding to teardown."
            exit 0
          fi
          echo "Holding for $MINS minute(s) before teardown. Arc cluster: $CLUSTER in RG: $RG."
          echo "- Keep-alive: holding cluster \`$CLUSTER\` for ${MINS}m before teardown" >> "$GITHUB_STEP_SUMMARY"
          for ((i=1; i<=MINS; i++)); do
            sleep 60
            echo "keep-alive heartbeat: ${i}/${MINS} minute(s) elapsed"
          done

      - name: Teardown (ephemeral mode, delete RG)
        if: always() && env.PERSISTENT_RG != 'true' && !inputs.skip-teardown
        shell: bash
        env:
          RG: "${{ steps.names.outputs.rg }}"
          EXPECTED_RUN_ID: "${{ github.run_id }}"
          EXPECTED_RUN_ATTEMPT: "${{ github.run_attempt }}"
          RG_CREATED: "${{ steps.create-rg.outcome }}"
        # Layered defense against ever deleting a non-ephemeral RG:
        #   1. Name must match `rg-e2e-<run_id>-<attempt>-*`, the exact
        #      shape `Compute names` emits in ephemeral mode.
        #   2. RG must carry tags `managedBy=siteops-e2e`, `ephemeral=true`,
        #      and a `run_id`/`run_attempt` that equal THIS run's values.
        #      Class-only tags without run provenance are not enough. An
        #      unrelated RG tagged ephemeral could otherwise pass.
        #   3. If the RG is already gone (e.g. a prior retry cleaned up),
        #      treat as idempotent success, not failure.
        # Any other mismatch hard-fails the job so an unexpected state
        # surfaces loudly rather than destroying data.
        run: |
          set -euo pipefail
          EXPECTED_PREFIX="rg-e2e-${EXPECTED_RUN_ID}-${EXPECTED_RUN_ATTEMPT}-"
          if [[ "$RG" != "$EXPECTED_PREFIX"* ]]; then
            echo "::error::Refusing to delete RG '$RG': name does not match this run's ephemeral pattern '${EXPECTED_PREFIX}*'."
            exit 1
          fi
          # `az group exists` can fail rather than answer, for example when the
          # identity lacks subscription-scope read. That is distinct from the
          # RG being absent, so handle the query failure on its own terms
          # instead of letting `set -e` end the step.
          #
          # Route stderr away rather than merging it. A warning on a successful
          # call would join the value and compare unequal to `true`, so a live
          # resource group would read as absent. Nothing reads the merged stream.
          EXISTS=""
          if ! EXISTS=$(az group exists --name "$RG" -o tsv --only-show-errors 2>/dev/null); then
            if [[ "$RG_CREATED" != "success" ]]; then
              echo "Could not query RG '$RG' and creation did not succeed, so there is nothing this run made to remove."
              echo "- Ephemeral RG never created: \`$RG\`" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "::error::RG '$RG' was created but cannot be queried, so it may survive this run. Delete it by hand."
            echo "- Ephemeral RG may have leaked, delete by hand: \`$RG\`" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [[ "$EXISTS" == "false" ]]; then
            echo "RG '$RG' does not exist, so teardown is a no-op."
            echo "- Ephemeral RG already absent: \`$RG\`" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # `true` and `false` are the only answers. Anything else means the
          # value did not come from the query, so stop rather than treat the
          # group as absent.
          if [[ "$EXISTS" != "true" ]]; then
            echo "::error::RG '$RG' existence check returned '$EXISTS' rather than true or false, so teardown cannot run safely. Delete it by hand."
            echo "- Ephemeral RG state unknown, delete by hand: \`$RG\`" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          TAGS_JSON=$(az group show --name "$RG" --query tags -o json)
          MANAGED=$(echo "$TAGS_JSON" | python3 -c "import json,sys;print((json.load(sys.stdin) or {}).get('managedBy',''))")
          EPHEMERAL=$(echo "$TAGS_JSON" | python3 -c "import json,sys;print((json.load(sys.stdin) or {}).get('ephemeral',''))")
          TAG_RUN_ID=$(echo "$TAGS_JSON" | python3 -c "import json,sys;print((json.load(sys.stdin) or {}).get('run_id',''))")
          TAG_RUN_ATTEMPT=$(echo "$TAGS_JSON" | python3 -c "import json,sys;print((json.load(sys.stdin) or {}).get('run_attempt',''))")
          if [[ "$MANAGED" != "siteops-e2e" \
             || "$EPHEMERAL" != "true" \
             || "$TAG_RUN_ID" != "$EXPECTED_RUN_ID" \
             || "$TAG_RUN_ATTEMPT" != "$EXPECTED_RUN_ATTEMPT" ]]; then
            echo "::error::Refusing to delete RG '$RG': tag provenance check failed."
            echo "  expected: managedBy=siteops-e2e ephemeral=true run_id=$EXPECTED_RUN_ID run_attempt=$EXPECTED_RUN_ATTEMPT"
            echo "  actual:   managedBy=$MANAGED ephemeral=$EPHEMERAL run_id=$TAG_RUN_ID run_attempt=$TAG_RUN_ATTEMPT"
            exit 1
          fi
          echo "Guards passed, deleting ephemeral RG '$RG'."
          if ! az group delete --name "$RG" --yes --no-wait; then
            echo "::warning::Ephemeral RG delete failed, so RG $RG may linger."
            echo "- Ephemeral RG delete failed: \`$RG\`" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Teardown (persistent mode, delta cleanup, keep RG)
        if: always() && env.PERSISTENT_RG == 'true' && !inputs.skip-teardown
        shell: bash
        env:
          RG: "${{ steps.names.outputs.rg }}"
          CLUSTER: "${{ steps.names.outputs.cluster }}"
        # Deletes only resources that did not exist in the pre-run snapshot
        # (see `Snapshot RG resources` step). If the snapshot file is missing
        # we refuse to compute a delta and skip cleanup. An operator must
        # clean up manually. Cluster delete runs first (when this run owns
        # it) so Arc extensions cascade out cleanly. Role assignments (proxy
        # resources) are not listed by `az resource list` and are cleaned
        # up implicitly when scoped resources are deleted.
        run: |
          set +e
          umask 077
          PRE_FILE="$RUNNER_TEMP/e2e-teardown/pre-ids.txt"
          if [[ ! -f "$PRE_FILE" ]]; then
            echo "::warning::Snapshot file missing. Skipping delta cleanup. Inspect the selected RG privately."
            echo "- Persistent-mode teardown skipped (snapshot missing)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # `az connectedk8s delete` reaches into the cluster via the Arc
          # proxy at 127.0.0.1:47021 to clean up agent CRDs. Even with
          # `--force`, the CLI still runs a kube-connectivity check before
          # the ARM call. The proxy expires before teardown on long runs
          # (>70 minutes), so the connectivity check fails with
          # "Connection refused" and the ARM delete never executes.
          # `az resource delete` is also a dead end: the RP rejects the
          # generic delete verb on connectedClusters with
          # `ResourceDeletionValidateFailed`.
          #
          # Bypass both by calling the ARM REST API directly. The cluster
          # is on a throwaway runner that dies with the job, so the
          # in-cluster cleanup the CLI was trying to do is unnecessary.
          # `az rest` defaults to `https://management.azure.com` when the
          # `--uri` is a relative path and uses the current az login
          # token. The ARM DELETE is async and returns 202. The retry loop
          # below re-lists and confirms the cluster eventually disappears.
          delete_arc_cluster_arm() {
            local rg="$1" cluster="$2"
            local sub uri
            sub=$(az account show --query id -o tsv 2>/dev/null)
            if [[ -z "$sub" ]]; then
              echo "::warning::[connectedk8s delete] cannot resolve subscription id"
              return 1
            fi
            uri="/subscriptions/${sub}/resourceGroups/${rg}/providers/Microsoft.Kubernetes/connectedClusters/${cluster}?api-version=2024-01-01"
            if az rest --method DELETE --uri "$uri" --only-show-errors \
              > "$RUNNER_TEMP/e2e-teardown/cluster-delete.out" \
              2> "$RUNNER_TEMP/e2e-teardown/cluster-delete.err"; then
              echo "[connectedk8s delete] ARM DELETE accepted"
              return 0
            fi
            echo "::warning::[connectedk8s delete] ARM DELETE failed; retrying through the delta pass."
            return 1
          }
          # Only delete the Arc cluster if it was created by THIS run: grep
          # the pre-snapshot for a matching connectedClusters/<name> id. If
          # it was already there, the operator owns it. Skip.
          if grep -qiE "/providers/Microsoft\.Kubernetes/connectedClusters/${CLUSTER}$" "$PRE_FILE"; then
            echo "Skipping cluster delete: Arc resource pre-existed the snapshot (operator-owned)."
          else
            delete_arc_cluster_arm "$RG" "$CLUSTER"
          fi
          LIST_OK=0
          for i in 1 2 3 4 5; do
            LIST_ERR="$RUNNER_TEMP/e2e-teardown/list-err-$i.log"
            POST_IDS=$(az resource list -g "$RG" --query "[].id" -o tsv 2>"$LIST_ERR")
            if [[ $? -ne 0 ]]; then
              echo "::warning::Teardown pass $i: resource enumeration failed; private diagnostic retained."
              sleep 30
              continue
            fi
            LIST_OK=1
            DELTA=$(comm -23 <(printf '%s\n' "$POST_IDS" | sort -u) <(sort -u "$PRE_FILE") | sed '/^$/d')
            [[ -z "$DELTA" ]] && break
            count=$(printf '%s\n' "$DELTA" | wc -l)
            echo "::group::Teardown pass $i: deleting $count resource(s) in parallel"
            echo "::endgroup::"
            # Parallel deletes retain per-resource output privately by ID digest.
            # Dependency-order failures are retried and reported by fixed category.
            #
            # connectedClusters cannot be removed via `az resource delete`
            # (RP rejects with `ResourceDeletionValidateFailed`) and
            # `az connectedk8s delete` requires kube connectivity that has
            # expired by teardown. Route those IDs through the ARM REST
            # API directly. Match the top-level cluster only, not child
            # resources under it (extensions, configurations, etc.) which
            # the regex anchor excludes via the trailing `[^/]+$` shape.
            printf '%s\n' "$DELTA" | xargs -r -P 10 -I{} bash -c '
              id="$1"
              key=$(printf "%s" "$id" | sha256sum | cut -d " " -f 1)
              out="$RUNNER_TEMP/e2e-teardown/delete-$2-$key.out"
              err="$RUNNER_TEMP/e2e-teardown/delete-$2-$key.err"
              if [[ "$id" =~ /providers/Microsoft\.Kubernetes/connectedClusters/[^/]+$ ]]; then
                if az rest --method DELETE --uri "${id}?api-version=2024-01-01" \
                  --only-show-errors > "$out" 2> "$err"; then
                  echo "[delete-ok pass=$2] connectedk8s ARM"
                else
                  echo "::warning::[delete-failed pass=$2] connectedk8s ARM; private diagnostic retained."
                fi
              elif az resource delete --ids "$id" --verbose > "$out" 2> "$err"; then
                echo "[delete-ok pass=$2] resource"
              else
                echo "::warning::[delete-failed pass=$2] resource; private diagnostic retained."
              fi
            ' _ {} "$i"
            sleep 30
          done
          if [[ $LIST_OK -eq 0 ]]; then
            echo "::warning::Persistent-mode teardown could not enumerate the selected RG. Delta cleanup did not run; inspect it privately."
            echo "- Persistent-mode teardown unable to enumerate the selected RG" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          FINAL_ERR="$RUNNER_TEMP/e2e-teardown/list-err-final.log"
          POST_IDS=$(az resource list -g "$RG" --query "[].id" -o tsv 2>"$FINAL_ERR")
          if [[ $? -ne 0 ]]; then
            echo "::warning::Final residual check: az resource list failed, so residual state is unknown."
            echo "- Persistent-mode teardown final check failed for the selected RG" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          FINAL_DELTA=$(comm -23 <(printf '%s\n' "$POST_IDS" | sort -u) <(sort -u "$PRE_FILE") | sed '/^$/d')
          if [[ -n "$FINAL_DELTA" ]]; then
            residual=$(printf '%s\n' "$FINAL_DELTA" | wc -l)
            echo "::warning::Persistent-mode teardown left $residual resource(s) created by this run in the selected RG."
            echo "- Persistent-mode teardown incomplete ($residual residual resource(s))" >> "$GITHUB_STEP_SUMMARY"
          fi
