version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    # limit to security updates only
    open-pull-requests-limit: 0
    commit-message:
      prefix: "chore(pip-deps)"
      prefix-development: "chore(pip-dev-deps)"

  - package-ecosystem: "github-actions"
    directories:
      # "/" covers .github/workflows. Composite actions are separate manifests that
      # are only scanned when their directory is listed, which is why actions used
      # solely by a composite action did not receive update pull requests. The glob
      # keeps future composite actions covered without editing this file.
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(actions)"
