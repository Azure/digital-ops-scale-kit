name: Setup published Site Ops
description: Verify and install one published Site Ops bundle for package-backed E2E.

inputs:
  repository:
    description: GitHub repository that owns the release.
    required: true
  release:
    description: Exact published release tag.
    required: true
  source-sha:
    description: Full expected main-branch source commit.
    required: true
  github-token:
    description: Read-only GitHub token for release and attestation access.
    required: true
  state:
    description: New private state directory beneath RUNNER_TEMP.
    required: true

outputs:
  version:
    description: Installed Site Ops package version.
    value: ${{ steps.install.outputs.version }}

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.11"

    - name: Verify and install the published bundle
      id: install
      shell: bash
      env:
        EXPECTED_REPOSITORY: ${{ inputs.repository }}
        EXPECTED_RELEASE: ${{ inputs.release }}
        EXPECTED_SOURCE_SHA: ${{ inputs.source-sha }}
        GH_TOKEN: ${{ inputs.github-token }}
        STATE: ${{ inputs.state }}
        PYTHONSAFEPATH: "1"
      run: |
        set -euo pipefail
        umask 077
        unset PYTHONPATH PYTHONHOME

        python - "$STATE" "$RUNNER_TEMP" "$EXPECTED_REPOSITORY" \
          "$GITHUB_REPOSITORY" "$EXPECTED_RELEASE" "$EXPECTED_SOURCE_SHA" <<'PY'
        import re
        import sys
        from pathlib import Path

        state, temp = (Path(value).resolve() for value in sys.argv[1:3])
        if not state.is_relative_to(temp) or state == temp or state.exists():
            raise SystemExit("Published E2E state must be a new directory beneath RUNNER_TEMP.")
        if sys.argv[3] != sys.argv[4]:
            raise SystemExit("Published E2E can consume releases only from the current repository.")
        if not sys.argv[5].strip() or len(sys.argv[5]) > 128 or any(
            character.isspace() for character in sys.argv[5]
        ):
            raise SystemExit("The published release tag is invalid.")
        if not re.fullmatch(r"[0-9a-f]{40}", sys.argv[6]):
            raise SystemExit("The published release source SHA must be a full lowercase commit.")
        state.mkdir(parents=True)
        PY

        mkdir "$STATE/gh" "$STATE/download" "$STATE/trust"
        export GH_CONFIG_DIR="$STATE/gh"
        encoded_tag="$(python -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$EXPECTED_RELEASE")"
        gh api "repos/$EXPECTED_REPOSITORY/releases/tags/$encoded_tag" > "$STATE/release.json"
        gh api "repos/$EXPECTED_REPOSITORY/git/ref/tags/$encoded_tag" > "$STATE/tag.json"
        python - "$STATE/release.json" "$STATE/tag.json" \
          "$EXPECTED_RELEASE" "$EXPECTED_SOURCE_SHA" <<'PY'
        import json
        import sys
        from pathlib import Path

        release = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
        reference = json.loads(Path(sys.argv[2]).read_text(encoding="utf-8"))
        if (
            release.get("tag_name") != sys.argv[3]
            or release.get("draft") is not False
            or reference.get("object", {}).get("type") != "commit"
            or reference.get("object", {}).get("sha") != sys.argv[4]
        ):
            raise SystemExit("The published release does not target the expected commit.")
        assets = release.get("assets")
        if not isinstance(assets, list):
            raise SystemExit("The published release has no bounded asset inventory.")
        selected = {
            asset.get("name"): asset
            for asset in assets
            if isinstance(asset, dict)
            and asset.get("name") in {
                "siteops-install.zip",
                "siteops-install.zip.attestation.jsonl",
            }
        }
        if set(selected) != {
            "siteops-install.zip",
            "siteops-install.zip.attestation.jsonl",
        }:
            raise SystemExit("The published release lacks the verified installation pair.")
        limits = {
            "siteops-install.zip": 128 * 1024 * 1024,
            "siteops-install.zip.attestation.jsonl": 2 * 1024 * 1024,
        }
        for name, asset in selected.items():
            size = asset.get("size")
            digest = asset.get("digest")
            if (
                type(size) is not int
                or not 1 <= size <= limits[name]
                or not isinstance(digest, str)
                or not digest.startswith("sha256:")
                or len(digest) != 71
            ):
                raise SystemExit("The published installation asset identity is invalid.")
        Path(sys.argv[1]).with_name("selected-assets.json").write_text(
            json.dumps(selected, sort_keys=True),
            encoding="utf-8",
        )
        PY

        gh release download "$EXPECTED_RELEASE" \
          --repo "$EXPECTED_REPOSITORY" \
          --pattern siteops-install.zip \
          --pattern siteops-install.zip.attestation.jsonl \
          --dir "$STATE/download"
        python - "$STATE/selected-assets.json" "$STATE/download" <<'PY'
        import hashlib
        import json
        import sys
        from pathlib import Path

        selected = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
        root = Path(sys.argv[2])
        for name, identity in selected.items():
            path = root / name
            raw = path.read_bytes()
            if (
                len(raw) != identity.get("size")
                or "sha256:" + hashlib.sha256(raw).hexdigest() != identity.get("digest")
            ):
                raise SystemExit(f"The downloaded published asset changed: {name}")
        PY

        source_ref=refs/heads/main
        signer="https://github.com/$EXPECTED_REPOSITORY/.github/workflows/_siteops-distribution.yaml@$source_ref"
        builder="https://github.com/$EXPECTED_REPOSITORY/.github/workflows/release.yaml@$source_ref"
        gh attestation verify "$STATE/download/siteops-install.zip" \
          --bundle "$STATE/download/siteops-install.zip.attestation.jsonl" \
          --repo "$EXPECTED_REPOSITORY" \
          --cert-identity "$signer" \
          --source-ref "$source_ref" \
          --source-digest "$EXPECTED_SOURCE_SHA" \
          --signer-digest "$EXPECTED_SOURCE_SHA" \
          --cert-oidc-issuer https://token.actions.githubusercontent.com \
          --predicate-type https://slsa.dev/provenance/v1 \
          --hostname github.com \
          --digest-alg sha256 \
          --format json > "$STATE/engine-verification.json"
        python - "$STATE/engine-verification.json" "$EXPECTED_REPOSITORY" \
          "$EXPECTED_SOURCE_SHA" "$source_ref" "$signer" "$builder" <<'PY'
        import json
        import sys
        from pathlib import Path

        results = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
        expected = {
            "subjectAlternativeName": sys.argv[5],
            "issuer": "https://token.actions.githubusercontent.com",
            "sourceRepositoryURI": "https://github.com/" + sys.argv[2],
            "sourceRepositoryDigest": sys.argv[3],
            "sourceRepositoryRef": sys.argv[4],
            "buildSignerDigest": sys.argv[3],
            "buildConfigURI": sys.argv[6],
            "buildConfigDigest": sys.argv[3],
            "runnerEnvironment": "self-hosted",
        }
        if not isinstance(results, list) or not 1 <= len(results) <= 128:
            raise SystemExit("The engine verifier returned no bounded evidence.")
        for result in results:
            try:
                verified = result["verificationResult"]
                certificate = verified["signature"]["certificate"]
                valid = (
                    verified["mediaType"]
                    == "application/vnd.dev.sigstore.verificationresult+json;version=0.1"
                    and all(certificate.get(key) == value for key, value in expected.items())
                )
            except (KeyError, TypeError):
                valid = False
            if not valid:
                raise SystemExit("The engine certificate does not satisfy release policy.")
        PY

        gh attestation trusted-root > "$STATE/trust/trusted-root.json"
        unset GH_TOKEN GITHUB_TOKEN GH_ENTERPRISE_TOKEN GITHUB_ENTERPRISE_TOKEN
        if [[ -n "${UV_INSECURE_HOST:-}${UV_PYTHON_DOWNLOADS_JSON_URL:-}${UV_PYTHON_INSTALL_MIRROR:-}" ||
              -n "${UV_INSECURE_NO_ZIP_VALIDATION:-}" &&
              "${UV_INSECURE_NO_ZIP_VALIDATION}" != "0" &&
              "${UV_INSECURE_NO_ZIP_VALIDATION}" != "false" ]]; then
          echo "::error::The published E2E runtime source is not admitted."
          exit 1
        fi
        while IFS= read -r name; do
          case "$name" in UV_*|PIP_*|PYTHON*) unset "$name" ;; esac
        done < <(compgen -e)
        mkdir "$STATE/tools" "$STATE/bin" "$STATE/python" "$STATE/cache" "$STATE/home" "$STATE/helper"
        export HOME="$STATE/home"
        export XDG_DATA_HOME="$STATE/home"
        export XDG_CONFIG_HOME="$STATE/home"
        export UV_TOOL_DIR="$STATE/tools"
        export UV_TOOL_BIN_DIR="$STATE/bin"
        export UV_PYTHON_INSTALL_DIR="$STATE/python"
        export UV_CACHE_DIR="$STATE/cache"
        export UV_PYTHON_DOWNLOADS=never
        curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
          --tlsv1.2 --max-redirs 3 --max-time 180 --max-filesize 19827214 \
          --output "$STATE/uv.tar.gz" \
          https://github.com/astral-sh/uv/releases/download/0.12.20/uv-x86_64-unknown-linux-gnu.tar.gz \
          2> "$STATE/uv-download.log" ||
          { echo "::error::Pinned native uv could not be acquired."; exit 1; }
        if [[ "$(wc -c < "$STATE/uv.tar.gz")" -ne 19827214 ||
              "$(sha256sum "$STATE/uv.tar.gz" | cut -d ' ' -f 1)" != 6590717592ace991ff83a63fef799e3ad9d33ecc8f96c5d6bdd732496e79337f ]]; then
          echo "::error::The native uv archive differs from the selected release."
          exit 1
        fi
        tar -xzOf "$STATE/uv.tar.gz" uv-x86_64-unknown-linux-gnu/uv > "$STATE/uv" \
          2> "$STATE/uv-extract.log" ||
          { echo "::error::Pinned native uv could not be extracted."; exit 1; }
        if [[ "$(wc -c < "$STATE/uv")" -ne 50437584 ||
              "$(sha256sum "$STATE/uv" | cut -d ' ' -f 1)" != b8299463da6fa7da3b94464444d252d0afca8ac6c96cb229f1baf4012f365246 ]]; then
          echo "::error::The native uv executable differs from the selected release."
          exit 1
        fi
        chmod 700 "$STATE/uv"
        UV_PYTHON_DOWNLOADS=automatic "$STATE/uv" python install 3.11.16 \
          --no-bin --no-registry --no-config --no-progress --system-certs \
          > "$STATE/python-install.log" 2>&1 ||
          { echo "::error::The published E2E managed Python could not be provisioned."; exit 1; }
        app_python="$STATE/python/cpython-3.11.16-linux-x86_64-gnu/bin/python3.11"
        python -I -S -B - "$STATE" "$app_python" <<'PY'
        import os
        import stat
        import subprocess
        import sys
        from pathlib import Path

        state, executable = map(Path, sys.argv[1:])
        concrete = state / "python/cpython-3.11.16-linux-x86_64-gnu"
        if (state.is_symlink() or state.stat().st_uid != os.getuid()
                or state.stat().st_mode & 0o077 or not concrete.is_dir()
                or concrete.is_symlink()):
            raise SystemExit("The published E2E tool and runtime storage is not private.")
        count = 0
        for directory, folders, files in os.walk(concrete, followlinks=False):
            for name in folders + files:
                count += 1
                path = Path(directory) / name
                info = path.lstat()
                if (count > 16384 or (not stat.S_ISLNK(info.st_mode)
                        and (info.st_uid not in {0, os.getuid()} or info.st_mode & 0o022))
                        or (stat.S_ISLNK(info.st_mode)
                            and not path.resolve(strict=True).is_relative_to(concrete))):
                    raise SystemExit("The published E2E managed runtime is not admitted.")
        if not executable.is_file() or executable.is_symlink():
            raise SystemExit("The published E2E managed runtime is incomplete.")
        identity = subprocess.run(
            [str(executable), "-I", "-S", "-B", "-c",
             "import sys;print(sys.implementation.name, *sys.version_info[:3], "
             "sys.maxsize > 2**32, sys._base_executable)"],
            capture_output=True, text=True, timeout=20, check=True,
        )
        if identity.stdout.strip() != f"cpython 3 11 16 True {executable}":
            raise SystemExit("The published E2E managed runtime has another identity.")
        PY
        python -I -S -B - "$STATE/download/siteops-install.zip" "$STATE/helper" <<'PY'
        import stat
        import sys
        import zipfile
        from pathlib import Path

        with zipfile.ZipFile(sys.argv[1]) as archive:
            entries = [member for member in archive.infolist()
                       if member.filename.casefold() == "siteops-install.py"]
            if (len(entries) != 1 or entries[0].filename != "siteops-install.py"
                    or not 0 < entries[0].file_size <= 1048576
                    or stat.S_IFMT(entries[0].external_attr >> 16) not in (0, stat.S_IFREG)):
                raise SystemExit("The authenticated bundle has no valid installer helper.")
            with archive.open(entries[0]) as stream:
                content = stream.read(1048577)
            if len(content) != entries[0].file_size:
                raise SystemExit("The authenticated installer helper is incomplete.")
        with (Path(sys.argv[2]) / "siteops-install.py").open("xb") as output:
            output.write(content)
        PY
        python -I -S -B - "$STATE/uv" "$STATE/helper/siteops-install.py" <<'PY'
        import os
        import stat
        import sys
        from pathlib import Path

        for name in sys.argv[1:]:
            path = Path(name)
            info = path.lstat()
            if (not stat.S_ISREG(info.st_mode) or info.st_uid != os.getuid()
                    or info.st_mode & 0o022 or path.is_symlink()):
                raise SystemExit("The published E2E executable storage is not admitted.")
        PY
        "$app_python" -I -S -B "$STATE/helper/siteops-install.py" install \
          "$STATE/download/siteops-install.zip" "$STATE/bundle" "$EXPECTED_REPOSITORY" \
          "$EXPECTED_SOURCE_SHA" "$source_ref" "$STATE/uv" "$UV_TOOL_DIR" "$UV_TOOL_BIN_DIR" \
          > "$STATE/installed.json" 2> "$STATE/install.log" ||
          { echo "::error::The authenticated published bundle could not be installed."; exit 1; }
        if [[ ! -s "$STATE/installed.json" ||
              "$(wc -c < "$STATE/installed.json")" -gt 4096 ]]; then
          echo "::error::The authenticated installer returned an invalid receipt."
          exit 1
        fi
        package_version="$(python -I -S -B - "$STATE/installed.json" <<'PY'
        import json
        import sys
        from pathlib import Path

        result = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
        version = result.get("version")
        if (not isinstance(version, str) or not version
                or not isinstance(result.get("wheel"), str)
                or not result["wheel"].startswith("wheels/")):
            raise SystemExit("The authenticated bundle has no package version.")
        print(version)
        PY
        )"
        observed="$(cd "$STATE" && "$UV_TOOL_BIN_DIR/siteops" --version 2> "$STATE/version.log")" ||
          { echo "::error::The installed published command could not be executed."; exit 1; }
        if [[ "$observed" != "siteops $package_version" ]]; then
          echo "::error::The installed command does not match the authenticated bundle."
          exit 1
        fi
        if ! "$UV_TOOL_DIR/siteops/bin/python" -I - \
          "$GITHUB_WORKSPACE" "$UV_TOOL_DIR" "$package_version" \
          > "$STATE/origin.log" 2>&1 <<'PY'
        import importlib.metadata
        import sys
        from pathlib import Path

        source = Path(sys.argv[1]).resolve()
        import siteops

        module = Path(siteops.__file__).resolve()
        if module.is_relative_to(source) or not module.is_relative_to(Path(sys.argv[2]).resolve()):
            raise SystemExit("Published E2E imported Site Ops from checkout.")
        if importlib.metadata.version("siteops") != sys.argv[3]:
            raise SystemExit("The installed Site Ops package version changed.")
        PY
        then
          echo "::error::The installed published package has an unexpected origin or version."
          exit 1
        fi

        root_digest="$(sha256sum "$STATE/trust/trusted-root.json" | cut -d ' ' -f 1)"
        root_size="$(wc -c < "$STATE/trust/trusted-root.json")"
        if (( root_size < 1 || root_size > 2097152 )); then
          echo "::error::The independent trusted-root snapshot is invalid."
          exit 1
        fi
        python - "$STATE/trust/policy.json" "$root_digest" \
          "$EXPECTED_REPOSITORY" <<'PY'
        import json
        import sys
        from datetime import datetime, timedelta, timezone
        from pathlib import Path

        document = {
            "apiVersion": "siteops/v1alpha1",
            "kind": "ArtifactVerificationPolicy",
            "id": "published-e2e-workspace",
            "version": 1,
            "validUntil": (datetime.now(timezone.utc) + timedelta(hours=6)).isoformat(),
            "trustedRootSha256": sys.argv[2],
            "provider": {
                "kind": "github-attestation/v1",
                "repository": sys.argv[3],
                "sourceRef": "refs/heads/main",
                "signerWorkflow": ".github/workflows/_workspace-distribution.yaml",
                "builderWorkflow": ".github/workflows/release.yaml",
                "runnerEnvironment": "self-hosted",
            },
        }
        Path(sys.argv[1]).write_text(
            json.dumps(document, separators=(",", ":")),
            encoding="utf-8",
        )
        PY

        {
          echo "SITEOPS_E2E_POLICY=$STATE/trust/policy.json"
          echo "SITEOPS_E2E_TRUSTED_ROOT=$STATE/trust/trusted-root.json"
          echo "SITEOPS_E2E_INSTALL_STATE=$STATE"
          echo "SITEOPS_E2E_ENGINE_VERSION=$package_version"
          echo "PYTHONSAFEPATH=1"
        } >> "$GITHUB_ENV"
        echo "$UV_TOOL_BIN_DIR" >> "$GITHUB_PATH"
        echo "version=$package_version" >> "$GITHUB_OUTPUT"
